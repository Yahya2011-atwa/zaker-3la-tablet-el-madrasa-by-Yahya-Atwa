<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
    <link rel="manifest" href="./manifest.json">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <meta name="theme-color" content="#ffffff">
    <link rel="icon" type="image/png" href="./icon-192.png">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
    <title>Zaker by Yahya Atwa</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf_viewer.min.css">
    <style>
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, sans-serif; 
            -webkit-tap-highlight-color: transparent; 
        }
        
        body { 
            background: #eef2f5;
            color: #1c1c1e; 
            height: 100vh; 
            height: 100dvh; 
            display: flex; 
            flex-direction: column; 
            overflow: hidden; 
            touch-action: manipulation;
        }

        .glass-bg {
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%;
            background: radial-gradient(circle at 30% 20%, rgba(255, 255, 255, 0.98) 0%, rgba(225, 232, 245, 0.85) 50%, rgba(200, 212, 230, 0.9) 100%);
            filter: blur(20px);
            z-index: -1;
        }

        .apple-glass {
            background: rgba(255, 255, 255, 0.45) !important;
            backdrop-filter: blur(35px) saturate(220%) contrast(90%);
            -webkit-backdrop-filter: blur(35px) saturate(220%) contrast(90%);
            border: 1px solid rgba(255, 255, 255, 0.75) !important;
            box-shadow: 
                0 16px 40px 0 rgba(31, 38, 135, 0.08),
                inset 0 1px 2px 0 rgba(255, 255, 255, 0.9),
                inset 0 -1px 1px 0 rgba(0, 0, 0, 0.03);
            transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.25s ease, background 0.3s;
        }

        #status-bar {
            position: fixed;
            top: 8px;
            right: 15px;
            z-index: 1005;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 11px;
            font-weight: 600;
            color: #1c1c1e;
            padding: 4px 12px;
            border-radius: 16px;
            pointer-events: none;
            letter-spacing: -0.2px;
        }

        #eraser-cursor {
            position: fixed;
            pointer-events: none;
            border: 1.5px solid rgba(0, 0, 0, 0.5);
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            z-index: 9999;
            display: none;
            box-shadow: 0 0 12px rgba(0,0,0,0.1);
            backdrop-filter: blur(3px);
            -webkit-backdrop-filter: blur(3px);
        }

        #home-screen { padding: 25px; display: flex; flex-direction: column; height: 100%; max-width: 900px; margin: 0 auto; width: 100%; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .header h2 { font-weight: 600; font-size: 22px; letter-spacing: -0.5px; color: #1c1c1e; }

        .btn-apple { 
            background: rgba(255, 255, 255, 0.75); color: #1c1c1e; border: 0.5px solid rgba(0, 0, 0, 0.12); 
            padding: 8px 16px; border-radius: 20px; font-weight: 600; cursor: pointer; font-size: 13px;
            backdrop-filter: blur(15px); transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1); display: flex; align-items: center; gap: 6px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }
        .btn-apple:active { transform: scale(0.95); background: rgba(255, 255, 255, 0.9); }

        .notes-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 15px; overflow-y: auto; flex: 1; padding: 5px; will-change: transform; }
        .note-card { border-radius: 18px; padding: 15px; cursor: pointer; display: flex; flex-direction: column; align-items: center; position: relative; transition: all 0.2s ease; will-change: transform; }
        .note-card:active { transform: scale(0.96); }
        .pdf-icon { font-size: 40px; margin: 10px 0; opacity: 0.9; color: #1c1c1e; }
        .note-title { font-weight: 500; font-size: 12px; text-align: center; color: #1c1c1e; width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .delete-btn { position: absolute; top: 8px; right: 8px; background: rgba(255, 59, 48, 0.85); color: white; border: none; border-radius: 50%; width: 22px; height: 22px; font-weight: bold; cursor: pointer; font-size: 11px; }

        #editor-screen { display: none; flex-direction: column; height: 100vh; height: 100dvh; position: relative; width: 100vw; overflow: hidden; background: #eef2f5; }
        
        .glass-bar-width {
            width: 92vw;
            max-width: 850px;
        }

        #toolbar-container {
            position: fixed; 
            top: 28px; 
            left: 50%; 
            transform: translateX(-50%);
            z-index: 1000; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            gap: 8px;
            pointer-events: auto;
            transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.25s ease;
        }
        
        #toolbar { 
            display: flex; gap: 6px; padding: 6px 12px; border-radius: 30px; align-items: center; 
            justify-content: space-between; flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none;
        }
        #toolbar::-webkit-scrollbar { display: none; }
        
        #toolbar button { 
            padding: 6px 10px; border-radius: 20px; border: 0.5px solid rgba(0, 0, 0, 0.08); 
            background: rgba(0, 0, 0, 0.04); color: #1c1c1e; cursor: pointer; font-size: 13px; transition: all 0.2s;
            display: flex; align-items: center; gap: 4px; flex-shrink: 0;
            font-weight: 500;
        }
        #toolbar button svg {
            fill: #1c1c1e;
            width: 16px;
            height: 16px;
        }
        #toolbar button:active { transform: scale(0.95); }
        #toolbar button.active { background: #1c1c1e; color: #ffffff; border-color: #1c1c1e; }
        #toolbar button.active svg { fill: #ffffff; }
        
        .btn-view-mode {
            background: rgba(0, 0, 0, 0.05) !important;
            border: 0.5px solid rgba(0, 0, 0, 0.12) !important;
            color: #1c1c1e !important;
        }

        #autosave-indicator {
            font-size: 11px;
            padding: 2px 10px;
            border-radius: 10px;
            background: rgba(0, 0, 0, 0.04);
            color: #34c759;
            margin-left: 5px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-weight: 600;
        }

        #toast-container {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(0, 0, 0, 0.1);
            color: #1c1c1e;
            padding: 10px 20px;
            border-radius: 25px;
            z-index: 2000;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.12);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s ease;
            opacity: 0;
            pointer-events: none;
        }
        #toast-container.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
            pointer-events: auto;
        }
        #toast-container button {
            background: #1c1c1e;
            color: white;
            border: none;
            padding: 4px 12px;
            border-radius: 15px;
            cursor: pointer;
            font-weight: 600;
            font-size: 12px;
        }

        #size-slider-panel {
            display: none;
            align-items: center;
            gap: 12px;
            padding: 6px 20px;
            border-radius: 20px;
            width: 100%;
            animation: fadeIn 0.2s ease;
        }

        .size-slider {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 6px;
            border-radius: 3px;
            background: rgba(0, 0, 0, 0.1);
            outline: none;
        }

        .size-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #1c1c1e;
            box-shadow: 0 0 8px rgba(0, 0, 0, 0.2);
            cursor: pointer;
            border: 2px solid #ffffff;
        }

        .size-val-badge {
            font-size: 12px; font-weight: bold; min-width: 28px; text-align: center; color: #1c1c1e;
        }

        .color-palette { display: flex; gap: 4px; align-items: center; background: rgba(0,0,0,0.04); padding: 3px 6px; border-radius: 20px; border: 0.5px solid rgba(0,0,0,0.08); flex-shrink: 0; }
        .recent-color-swatch { width: 18px; height: 18px; border-radius: 50%; cursor: pointer; border: 1px solid rgba(0,0,0,0.15); }

        #background-panel {
            display: none;
            align-items: center;
            justify-content: center;
            gap: 15px;
            padding: 8px 20px;
            border-radius: 20px;
            width: 100%;
            animation: fadeIn 0.2s ease;
        }

        .circle-btn {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 2px solid #ccc;
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
            cursor: pointer;
            background-color: #fff;
            transition: transform 0.2s, border-color 0.2s;
            flex-shrink: 0;
        }
        .circle-btn:hover { transform: scale(1.15); border-color: #1c1c1e; }

        .btn-lined {
            background-image: repeating-linear-gradient(transparent, transparent 5px, #a3a3a3 5px, #a3a3a3 6px);
        }
        .btn-grid {
            background-size: 8px 8px;
            background-image: 
                linear-gradient(to right, #a3a3a3 1px, transparent 1px), 
                linear-gradient(to bottom, #a3a3a3 1px, transparent 1px);
        }

        .page-wrapper.blank { background-image: none; background-color: #ffffff; }
        .page-wrapper.lined {
            background-color: #ffffff;
            background-image: repeating-linear-gradient(transparent, transparent 31px, #d1d5db 31px, #d1d5db 32px);
            background-position: 0 10px;
        }
        .page-wrapper.grid {
            background-color: #ffffff;
            background-size: 30px 30px;
            background-image:
                linear-gradient(to right, #e5e7eb 1px, transparent 1px),
                linear-gradient(to bottom, #e5e7eb 1px, transparent 1px);
        }

        /* تحسين التصفح والوصول لأي ركن بحرية تامة بغض النظر عن الزوم */
        #viewer-container {
            flex: 1;
            width: 100%;
            height: 100%;
            min-width: 0;
            min-height: 0;
            overflow: auto;
            display: flex;
            align-items: flex-start;
            justify-content: flex-start;
            flex-direction: row;
            gap: 0;
            padding: 180px;
            padding-bottom: max(180px, calc(180px + env(safe-area-inset-bottom)));
            touch-action: pan-x pan-y pinch-zoom;
            -webkit-overflow-scrolling: touch;
            overscroll-behavior: contain;
            scroll-behavior: auto;
            scrollbar-width: auto;
            will-change: scroll-position;
            scrollbar-gutter: stable;
        }

        #viewer-container.horizontal .page-wrapper { display: none; }
        #viewer-container.horizontal .page-wrapper.active {
            display: block;
            animation: fadeIn 0.25s ease-in-out;
        }

        #viewer-container.vertical {
            gap: 40px;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
        }

        #viewer-container.vertical .page-wrapper { display: block; }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.98); }
            to { opacity: 1; transform: scale(1); }
        }

        .page-wrapper {
            position: relative;
            border-radius: 12px;
            box-shadow: 0 12px 35px rgba(0,0,0,0.12);
            flex: 0 0 auto;
            margin: 0 auto;
            transition: background 0.3s ease;
            min-height: 500px;
        }

        /* مساحة أمان حول الصفحة للوصول لكل حافاتها بعد التكبير */
        #viewer-container::before,
        #viewer-container::after {
            content: "";
            flex: 0 0 1px;
        }

        /* عند كِبَر الصفحة لا نعتمد على transform؛ الحجم الحقيقي هو مساحة الـ scroll */
        #viewer-container.horizontal .page-wrapper.active {
            margin-left: max(0px, calc((100vw - 360px) / 2));
            margin-right: max(0px, calc((100vw - 360px) / 2));
        }

        #viewer-container.vertical .page-wrapper {
            margin-left: auto;
            margin-right: auto;
        }

                canvas.pdf-render { display: block; border-radius: 12px; width: 100%; height: 100%; mix-blend-mode: multiply; }
        canvas.draw-canvas { 
            position: absolute; top: 0; left: 0; border-radius: 12px; 
            touch-action: none; z-index: 2; width: 100%; height: 100%; 
            pointer-events: none; 
        }

        .textLayer {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            overflow: hidden; opacity: 1.0; line-height: 1.0; z-index: 1; border-radius: 12px; 
            pointer-events: auto;
        }
        
        .textLayer ::selection { background: rgba(0, 0, 0, 0.15); color: transparent; }
        .textLayer span { color: transparent; cursor: text; position: absolute; white-space: pre; transform-origin: 0% 0%; }

        /* البوكمارك الحمراء على الصفحة من فوق وتحتها ظل */
        .page-bookmark-badge {
            position: absolute;
            top: -12px;
            right: 30px;
            width: 32px;
            height: 42px;
            background: linear-gradient(135deg, #ff3b30 0%, #d32f2f 100%);
            border-radius: 0 0 6px 6px;
            box-shadow: 0 6px 12px rgba(255, 59, 48, 0.4), 0 2px 4px rgba(0,0,0,0.2);
            z-index: 15;
            display: none;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 14px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .page-bookmark-badge:hover {
            transform: translateY(-2px);
        }
        .page-wrapper.bookmarked .page-bookmark-badge {
            display: flex;
        }

        /* ستايل القائمة الجانبية للبوكماركس والفهرس */
        #sidebar-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(4px);
            z-index: 2000;
            display: none;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        #sidebar-overlay.show {
            display: block;
            opacity: 1;
        }

        #sidebar {
            position: fixed;
            top: 0;
            left: -320px;
            width: 300px;
            height: 100%;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(30px);
            z-index: 2001;
            box-shadow: 5px 0 30px rgba(0,0,0,0.15);
            transition: left 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            flex-direction: column;
            padding: 20px;
            border-right: 1px solid rgba(255,255,255,0.8);
        }
        #sidebar.open {
            left: 0;
        }
        .sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(0,0,0,0.1);
        }
        .sidebar-header h3 {
            font-size: 16px;
            font-weight: 600;
            color: #1c1c1e;
        }
        .sidebar-close {
            background: none;
            border: none;
            font-size: 18px;
            cursor: pointer;
            color: #1c1c1e;
        }
        .sidebar-content {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .bookmark-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 12px;
            background: rgba(255, 255, 255, 0.6);
            border: 0.5px solid rgba(0, 0, 0, 0.08);
            border-radius: 12px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .bookmark-item:hover {
            background: rgba(255, 255, 255, 0.9);
        }
        .bookmark-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
            flex: 1;
        }
        .bookmark-title {
            font-size: 13px;
            font-weight: 600;
            color: #1c1c1e;
            outline: none;
            border-bottom: 1px dashed transparent;
        }
        .bookmark-title:focus {
            border-bottom-color: #007aff;
        }
        .bookmark-page {
            font-size: 11px;
            color: #8e8e93;
        }
        .bookmark-actions {
            display: flex;
            gap: 6px;
        }
        .bookmark-delete {
            background: none;
            border: none;
            color: #ff3b30;
            cursor: pointer;
            font-size: 14px;
        }

        #bottom-thumbnails-bar {
            position: fixed; 
            bottom: 15px; 
            left: 50%; 
            transform: translateX(-50%);
            z-index: 1000; 
            display: flex; 
            align-items: center; 
            justify-content: space-between;
            gap: 8px; 
            padding: 8px 12px; 
            border-radius: 24px;
            pointer-events: auto;
            transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.25s ease;
        }


        .thumb-scroll-btn {
            background: rgba(0, 0, 0, 0.05); border: 0.5px solid rgba(0, 0, 0, 0.1);
            color: #1c1c1e; border-radius: 50%; width: 34px; height: 34px; display: flex;
            align-items: center; justify-content: center; cursor: pointer; font-size: 12px; flex-shrink: 0; transition: all 0.2s;
            font-weight: bold;
        }
        .thumb-scroll-btn:active { transform: scale(0.9); background: rgba(0, 0, 0, 0.15); }

        .thumbnails-container {
            display: flex; gap: 10px; overflow-x: auto; scroll-behavior: smooth;
            padding: 8px 4px; flex: 1; scrollbar-width: none; touch-action: pan-x;
        }
        .thumbnails-container::-webkit-scrollbar { display: none; }

        .thumb-item {
            position: relative; flex-shrink: 0; cursor: pointer; border-radius: 8px;
            overflow: visible; border: 2px solid transparent; transition: all 0.2s ease;
            background: rgba(0, 0, 0, 0.03); display: flex; flex-direction: column; align-items: center;
            user-select: none; min-width: 45px; min-height: 60px;
        }

        .thumb-item.active { border-color: #1c1c1e; box-shadow: 0 0 12px rgba(0, 0, 0, 0.2); transform: scale(1.05); }
        .thumb-item canvas { display: block; height: 60px; width: auto; border-radius: 6px; pointer-events: none; }
        .thumb-item { overflow: visible; }
        .thumb-annotation-canvas { position: absolute; left: 0; top: 0; height: 60px; width: auto; border-radius: 6px; pointer-events: none; z-index: 1; }
        .thumb-page-num { z-index: 2; }

        .thumb-page-num {
            position: absolute; bottom: 3px; right: 3px; background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border: 0.5px solid rgba(0, 0, 0, 0.15); color: #1c1c1e; font-size: 10px;
            padding: 2px 6px; border-radius: 8px; font-weight: 700; box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
            pointer-events: none;
        }

        .thumb-delete-badge {
            display: none; position: absolute; top: -8px; left: -8px; background: #ff3b30;
            color: white; border: 1.5px solid #fff; border-radius: 50%; width: 22px; height: 22px;
            font-size: 12px; font-weight: bold; cursor: pointer; align-items: center; justify-content: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2); z-index: 10;
        }

        .thumbnails-container.edit-mode .thumb-delete-badge { display: flex; }
        .thumbnails-container.edit-mode .thumb-item { animation: jiggle 0.25s infinite alternate ease-in-out; }
        @keyframes jiggle {
            0% { transform: rotate(-1.5deg) scale(0.98); }
            100% { transform: rotate(1.5deg) scale(1.02); }
        }

        .thumb-item.dragging { opacity: 0.3; }

        .text-node-wrapper { position: absolute; z-index: 10; display: inline-block; touch-action: none; user-select: none; }
        .text-node { background: transparent; border: 1px dashed transparent; padding: 4px 8px; cursor: move; min-width: 40px; outline: none; font-family: inherit; line-height: 1.3; word-break: break-word; user-select: text; }
        .text-node-wrapper:focus-within .text-node { border-color: rgba(0, 0, 0, 0.3); cursor: text; }
        .delete-text-badge { display: none; position: absolute; top: -10px; right: -10px; background: #ff3b30; color: white; border: none; border-radius: 50%; width: 20px; height: 20px; font-size: 11px; font-weight: bold; cursor: pointer; align-items: center; justify-content: center; box-shadow: 0 2px 6px rgba(0,0,0,0.2); z-index: 11; }
        .text-node-wrapper:focus-within .delete-text-badge, .text-node-wrapper:hover .delete-text-badge { display: flex; }

        .img-node { position: absolute; border: 1px dashed #1c1c1e; cursor: move; user-select: none; z-index: 3; touch-action: none; }
        .img-node img { width: 100%; height: 100%; pointer-events: none; display: block; }
        .img-node .delete-img { position: absolute; top: -8px; right: -8px; background: #ff3b30; color: white; border: none; border-radius: 50%; width: 18px; height: 18px; font-size: 10px; cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 5; }
        .resize-handle { position: absolute; width: 12px; height: 12px; background: #1c1c1e; border: 2px solid #fff; border-radius: 50%; bottom: -6px; right: -6px; cursor: se-resize; z-index: 5; }

        @media (orientation: landscape) {
            #toolbar-container { top: 18px; }
            #viewer-container { padding: 180px; }
        }

        /* ===== Weak-tablet performance layer ===== */
        html.low-power * { scroll-behavior: auto !important; }
        html.low-power .apple-glass { backdrop-filter: none !important; -webkit-backdrop-filter: none !important; }
        html.low-power .glass-bg { filter: none; opacity:.96; }
        html.low-power #status-bar, html.low-power #eraser-cursor { backdrop-filter:none !important; -webkit-backdrop-filter:none !important; }
        #extra-toolbar { display:flex; gap:5px; align-items:center; flex-shrink:0; }

<script>
        let fullscreenWanted = false;
        let fullscreenWasActive = false;
        let fullscreenExplicitlyExited = false;

        function isFullscreenActive() {
            return !!(document.fullscreenElement || document.webkitFullscreenElement);
        }

        function updateFullscreenButton() {
            const btn = document.getElementById('fullscreenBtn');
            if (!btn) return;
            const active = isFullscreenActive();
            btn.classList.toggle('active', active);
            btn.title = active ? 'Exit Fullscreen' : 'Fullscreen';
            btn.innerHTML = active
                ? `<svg viewBox="0 0 24 24"><path d="M9 7H7v3H5V5h5v2H9zm8 3V7h-2V5h4v5h-2zM7 14H5v5h5v-2H7v-3zm10 0h2v5h-5v-2h3v-3z"/></svg>`
                : `<svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm0-4h3V7h2v5H7V10zm10 4h2v5h-5v-2h3v-3zM14 7h3v3h2V5h-5v2z"/></svg>`;
        }

        async function requestAppFullscreen(fromUserGesture = false) {
            if (!document.documentElement.requestFullscreen || isFullscreenActive()) {
                updateFullscreenButton();
                return false;
            }
            try {
                await document.documentElement.requestFullscreen({ navigationUI: 'hide' });
                fullscreenWasActive = true;
                fullscreenExplicitlyExited = false;
                updateFullscreenButton();
                return true;
            } catch (err) {
                // Browser security can reject fullscreen without a user gesture.
                if (fromUserGesture) console.warn('Fullscreen request rejected:', err);
                return false;
            }
        }

        async function exitAppFullscreen() {
            try {
                if (document.exitFullscreen && isFullscreenActive()) {
                    fullscreenExplicitlyExited = true;
                    await document.exitFullscreen();
                }
            } catch (err) {
                console.warn('Fullscreen exit rejected:', err);
            } finally {
                updateFullscreenButton();
            }
        }

        async function toggleFullscreen() {
            if (isFullscreenActive()) {
                fullscreenWanted = false;
                fullscreenExplicitlyExited = true;
                await exitAppFullscreen();
            } else {
                fullscreenWanted = true;
                fullscreenExplicitlyExited = false;
                await requestAppFullscreen(true);
            }
        }

        function tryRestoreFullscreenOnReturn() {
            if (!fullscreenWanted || fullscreenExplicitlyExited) return;
            if (document.getElementById('editor-screen')?.style.display === 'none') return;
            if (!isFullscreenActive()) {
                requestAppFullscreen(false);
            }
        }

        document.addEventListener('fullscreenchange', () => {
            const active = isFullscreenActive();
            if (active) fullscreenWasActive = true;
            updateFullscreenButton();
            if (!active && fullscreenWanted && !fullscreenExplicitlyExited) {
                setTimeout(tryRestoreFullscreenOnReturn, 120);
            }
        });
        document.addEventListener('webkitfullscreenchange', updateFullscreenButton);
        window.addEventListener('pageshow', tryRestoreFullscreenOnReturn);
        document.addEventListener('visibilitychange', () => {
            if (!document.hidden) setTimeout(tryRestoreFullscreenOnReturn, 120);
        });

        // Preserve the original convenience: the first real interaction may enter fullscreen.
        function autoEnableFullScreenFromGesture() {
            if (!fullscreenWanted && !isFullscreenActive() && document.getElementById('editor-screen')?.style.display !== 'none') {
                fullscreenWanted = true;
                requestAppFullscreen(true);
            }
            document.removeEventListener('pointerdown', autoEnableFullScreenFromGesture);
            document.removeEventListener('touchstart', autoEnableFullScreenFromGesture);
        }
        document.addEventListener('pointerdown', autoEnableFullScreenFromGesture, { once: true });
        document.addEventListener('touchstart', autoEnableFullScreenFromGesture, { once: true, passive: true });
        updateFullscreenButton();

        // تحديث الوقت بتنسيق 12 ساعة مع الثواني والبطارية
        function updateSystemStatus() {
            const timeSpan = document.getElementById('time-display');
            const batterySpan = document.getElementById('battery-display');
            
            const now = new Date();
            if (timeSpan) {
                timeSpan.innerText = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true });
            }

            if (navigator.getBattery) {
                navigator.getBattery().then(battery => {
                    const level = Math.round(battery.level * 100);
                    if (batterySpan) batterySpan.innerText = (battery.charging ? "⚡ " : "🔋 ") + level + "%";
                });
            } else if (batterySpan) {
                batterySpan.innerText = "🔋 100%";
            }
        }
        setInterval(updateSystemStatus, 1000);
        updateSystemStatus();

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW registration failed:', err));
            });
        }

        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        let db;
        let currentPdfUrl = null;
        // Keep PDF data chunked in IndexedDB so opening large files does not require the whole file in RAM.
        // 4 MB is deliberately kept small for weak tablets while still avoiding excessive range requests.
        const PDF_CHUNK_SIZE = 4 * 1024 * 1024;
        const THUMB_SCALE = 0.12;

        const request = indexedDB.open("AppleGlassPDFDB", 3);
        request.onupgradeneeded = e => {
            db = e.target.result;
            if (!db.objectStoreNames.contains("files")) {
                db.createObjectStore("files", { keyPath: "id" });
            }
            if (!db.objectStoreNames.contains("pages")) {
                const pages = db.createObjectStore("pages", { keyPath: ["fileId", "page"] });
                pages.createIndex("fileId", "fileId", { unique: false });
            }
            if (!db.objectStoreNames.contains("settings")) {
                db.createObjectStore("settings", { keyPath: "fileId" });
            }
            if (!db.objectStoreNames.contains("chunks")) {
                const chunks = db.createObjectStore("chunks", { keyPath: ["fileId", "index"] });
                chunks.createIndex("fileId", "fileId", { unique: false });
            }
        };

        request.onsuccess = e => {
            db = e.target.result;
            db.onversionchange = () => db.close();
            loadHomeFiles();
            initColorPicker();
        };
        request.onerror = e => console.error('IndexedDB error:', e.target?.error);

        function idbRequest(req) {
            return new Promise((resolve, reject) => {
                req.onsuccess = e => resolve(e.target.result);
                req.onerror = e => reject(e.target.error || new Error('IndexedDB request failed'));
            });
        }

        function getRecord(id) {
            return idbRequest(db.transaction('files', 'readonly').objectStore('files').get(id));
        }

        function putRecord(record) {
            return idbRequest(db.transaction('files', 'readwrite').objectStore('files').put(record));
        }

        function getSettings(fileId) {
            return idbRequest(db.transaction('settings', 'readonly').objectStore('settings').get(fileId));
        }

        function putSettings(settings) {
            return idbRequest(db.transaction('settings', 'readwrite').objectStore('settings').put(settings));
        }

        function getPageState(fileId, actualPage) {
            return idbRequest(db.transaction('pages', 'readonly').objectStore('pages').get([fileId, Number(actualPage)]));
        }

        function putPageState(state) {
            return idbRequest(db.transaction('pages', 'readwrite').objectStore('pages').put(state));
        }

        function deletePageState(fileId, actualPage) {
            return idbRequest(db.transaction('pages', 'readwrite').objectStore('pages').delete([fileId, Number(actualPage)]));
        }

        function getAllPageStates(fileId) {
            return idbRequest(db.transaction('pages', 'readonly').objectStore('pages').index('fileId').getAll(fileId));
        }

        function getAllChunks(fileId) {
            return idbRequest(db.transaction('chunks', 'readonly').objectStore('chunks').index('fileId').getAll(fileId));
        }

        async function storePdfInChunks(fileId, file) {
            try {
                if (navigator.storage?.persist) {
                    try { await navigator.storage.persist(); } catch (_) {}
                }
                const count = Math.ceil(file.size / PDF_CHUNK_SIZE);
                for (let i = 0; i < count; i++) {
                    const blob = file.slice(i * PDF_CHUNK_SIZE, Math.min(file.size, (i + 1) * PDF_CHUNK_SIZE), 'application/octet-stream');
                    await idbRequest(db.transaction('chunks', 'readwrite').objectStore('chunks').put({
                        fileId, index: i, data: blob, size: blob.size
                    }));
                    // Yield periodically so a weak tablet keeps responding while saving very large PDFs.
                    if ((i + 1) % 3 === 0) await new Promise(resolve => setTimeout(resolve, 0));
                }
            } catch (err) {
                console.error('Chunked PDF storage failed:', err);
                throw err;
            }
        }

        async function deleteAllChunks(fileId) {
            const chunks = await getAllChunks(fileId);
            if (!chunks.length) return;
            const tx = db.transaction('chunks', 'readwrite');
            const store = tx.objectStore('chunks');
            chunks.forEach(c => store.delete([fileId, c.index]));
            await new Promise((resolve, reject) => {
                tx.oncomplete = resolve;
                tx.onerror = e => reject(e.target.error);
                tx.onabort = e => reject(e.target.error || new Error('Chunk delete aborted'));
            });
        }

        async function readLegacyDataAsUint8Array(data) {
            if (data instanceof Uint8Array) return data;
            if (data instanceof ArrayBuffer) return new Uint8Array(data);
            if (data instanceof Blob) return new Uint8Array(await data.arrayBuffer());
            return new Uint8Array(data || []);
        }

        async function assemblePdfBytes(record) {
            if (record?.chunked) {
                const chunks = (await getAllChunks(record.id)).sort((a,b) => a.index - b.index);
                const total = chunks.reduce((n, c) => n + (c.data?.size || 0), 0);
                const result = new Uint8Array(total);
                let offset = 0;
                for (const c of chunks) {
                    const part = new Uint8Array(await c.data.arrayBuffer());
                    result.set(part, offset);
                    offset += part.byteLength;
                }
                return result;
            }
            return readLegacyDataAsUint8Array(record?.data);
        }

        class IDBRangeTransport extends pdfjsLib.PDFDataRangeTransport {
            constructor(fileId, length) {
                super(length, null, false, null, false);
                this.fileId = fileId;
                this.length = length;
                this.pending = new Map();
            }

            requestDataRange(begin, end) {
                const key = begin + ':' + end;
                if (this.pending.has(key)) return;
                this.pending.set(key, true);
                this._readRange(begin, end).then(bytes => {
                    this.pending.delete(key);
                    this.onDataRange(begin, bytes);
                }).catch(err => {
                    this.pending.delete(key);
                    console.error('PDF range read error:', err);
                });
            }

            async _readRange(begin, end) {
                const first = Math.floor(begin / PDF_CHUNK_SIZE);
                const last = Math.floor((Math.max(begin, end - 1)) / PDF_CHUNK_SIZE);
                const chunks = await Promise.all(
                    Array.from({ length: last - first + 1 }, (_, i) =>
                        idbRequest(db.transaction('chunks', 'readonly').objectStore('chunks').get([this.fileId, first + i]))
                    )
                );

                const output = new Uint8Array(end - begin);
                let outOffset = 0;
                for (let i = 0; i < chunks.length; i++) {
                    const chunk = chunks[i];
                    if (!chunk?.data) continue;
                    const bytes = new Uint8Array(await chunk.data.arrayBuffer());
                    const chunkStart = (first + i) * PDF_CHUNK_SIZE;
                    const from = Math.max(begin, chunkStart);
                    const to = Math.min(end, chunkStart + bytes.byteLength);
                    if (to > from) {
                        const part = bytes.subarray(from - chunkStart, to - chunkStart);
                        output.set(part, outOffset);
                        outOffset += part.byteLength;
                    }
                }
                return output;
            }
        }

        let currentFileId = null, pdfDoc = null, currentPage = 1;
        let pageOrder = [];
        let renderQualityScale = ((navigator.deviceMemory || 4) <= 2 ? 0.85 : 1.15);
        let baseScale = ((navigator.deviceMemory || 4) <= 2 ? 1.05 : 1.15), zoomScale = 1.0;
        let currentDrawings = {}, currentTexts = {}, currentImages = {}, currentBookmarks = {};
        let viewMode = 'horizontal';
        let globalPageStyle = 'blank';
        let savedPageViewState = {};
        let historyStack = [];
        let recentColorsList = ['#000000', '#333333', '#666666', '#999999', '#cccccc'];
        let activeColor = '#000000';
        let activeTextNode = null;
        let isDrawing = false;
        let currentTool = null;
        let toolSizes = { pen: 4, eraser: 30, text: 18, highlighter: 16 };
        let lastDeletedItem = null;
        let toastTimeout = null;
        let isEditMode = false;
        let longPressTimer = null;
        let pageObserver = null;
        let renderedPages = new Set();
        let saveTimeout;
        let viewSaveTimeout;
        let legacyMigrationDone = false;

        async function loadDocumentState(record) {
            currentDrawings = {};
            currentTexts = {};
            currentImages = {};
            currentBookmarks = {};
            savedPageViewState = {};
            legacyMigrationDone = false;

            const settings = await getSettings(record.id).catch(() => null);
            if (settings) {
                pageOrder = Array.isArray(settings.pageOrder) ? [...settings.pageOrder] : [];
                currentBookmarks = settings.bookmarks || {};
                viewMode = settings.viewMode || 'horizontal';
                globalPageStyle = settings.globalPageStyle || 'blank';
                savedPageViewState = settings.pageViewState || {};
            } else if (record.pageOrder?.length) {
                pageOrder = [...record.pageOrder];
                currentBookmarks = record.bookmarks || {};
                viewMode = record.viewMode || 'horizontal';
                globalPageStyle = record.globalPageStyle || 'blank';
                savedPageViewState = record.pageViewState || {};
            }

            const pageStates = await getAllPageStates(record.id).catch(() => []);
            if (pageStates.length) {
                pageStates.forEach(state => {
                    const p = Number(state.page);
                    if (state.drawings) currentDrawings[p] = state.drawings;
                    if (state.texts) currentTexts[p] = state.texts;
                    if (state.images) currentImages[p] = state.images;
                });
            } else if (record.drawings || record.texts || record.images) {
                currentDrawings = record.drawings || {};
                currentTexts = record.texts || {};
                currentImages = record.images || {};
                await migrateLegacyAnnotations(record);
            }
        }

        async function migrateLegacyAnnotations(record) {
            if (legacyMigrationDone || !currentFileId) return;
            legacyMigrationDone = true;
            const pages = new Set([
                ...Object.keys(currentDrawings || {}),
                ...Object.keys(currentTexts || {}),
                ...Object.keys(currentImages || {})
            ].map(Number).filter(Number.isFinite));
            for (const actualPage of pages) {
                await putPageState({
                    fileId: currentFileId,
                    page: actualPage,
                    drawings: currentDrawings[actualPage] || null,
                    texts: currentTexts[actualPage] || [],
                    images: currentImages[actualPage] || []
                });
            }
            await putSettings({
                fileId: currentFileId,
                pageOrder: [...pageOrder],
                bookmarks: currentBookmarks,
                viewMode,
                globalPageStyle,
                pageViewState: savedPageViewState
            });
        }

        async function openPdfForRecord(record) {
            if (currentPdfUrl) {
                URL.revokeObjectURL(currentPdfUrl);
                currentPdfUrl = null;
            }
            if (pdfDoc) {
                try { await pdfDoc.destroy(); } catch (e) {}
                pdfDoc = null;
            }

            if (record.chunked) {
                const range = new IDBRangeTransport(record.id, record.size);
                pdfDoc = await pdfjsLib.getDocument({
                    range,
                    length: record.size,
                    disableStream: true,
                    disableAutoFetch: true,
                    rangeChunkSize: PDF_CHUNK_SIZE
                }).promise;
            } else {
                const legacyBlob = record.data instanceof Blob ? record.data : new Blob([await readLegacyDataAsUint8Array(record.data)], { type: 'application/pdf' });
                currentPdfUrl = URL.createObjectURL(legacyBlob);
                pdfDoc = await pdfjsLib.getDocument({
                    url: currentPdfUrl,
                    disableStream: false,
                    disableAutoFetch: false
                }).promise;
            }
        }

        async function removeFile(id, e) {

            try {

                const pageStates = await getAllPageStates(id).catch(() => []);

                tx.objectStore('files').delete(id);
                pageStates.forEach(state => tx.objectStore('pages').delete([id, state.page]));
                tx.objectStore('settings').delete(id);
                await new Promise((resolve, reject) => {
                    tx.oncomplete = resolve;
                    tx.onerror = e2 => reject(e2.target.error);
                    tx.onabort = e2 => reject(e2.target.error || new Error('Delete aborted'));
                });
                if (currentFileId === id) {
                    currentFileId = null;
                    if (currentPdfUrl) { URL.revokeObjectURL(currentPdfUrl); currentPdfUrl = null; }

                const pageState = savedPageViewState[currentPage] || savedPageViewState[String(currentPage)] || {};
                zoomScale = Math.max(0.5, Math.min(6.0, Number(pageState.zoomScale ?? savedPageViewState.zoomScale ?? 1)));

                });

        function shiftAnnotations(actualPage, direction) {
            const shiftDict = (dict) => {
                const newDict = {};
                for (const key in dict) {
                    const k = parseInt(key);
                    if (direction === 'insert') {
                        if (k >= actualPage) newDict[k + 1] = dict[key];
                        else newDict[k] = dict[key];
                    } else if (direction === 'delete') {
                        if (k > actualPage) newDict[k - 1] = dict[key];
                        else if (k < actualPage) newDict[k] = dict[key];
                    }
                }
                return newDict;
            };

            currentDrawings = shiftDict(currentDrawings);
            currentTexts = shiftDict(currentTexts);
            currentImages = shiftDict(currentImages);
        }

        function shiftBookmarks(displayPage, direction) {
            const next = {};
            for (const key in currentBookmarks) {
                const k = Number(key);
                if (direction === 'insert') {
                    if (k >= displayPage) next[k + 1] = currentBookmarks[key];
                    else next[k] = currentBookmarks[key];
                } else if (direction === 'delete') {
                    if (k > displayPage) next[k - 1] = currentBookmarks[key];
                    else if (k < displayPage) next[k] = currentBookmarks[key];
                }
            }
            currentBookmarks = next;
        }

        async function addBlankPage() {
            try {
                if (!currentFileId || !pdfDoc) return;
                await Promise.all([savePageDataNow(currentPage), saveDocumentSettings()]);
                updateAutosaveIndicator('saving');

                const record = await getRecord(currentFileId);
                if (!record) throw new Error('Document not found in database.');

                const pdfBytes = await assemblePdfBytes(record);
                const pdfLibDoc = await PDFLib.PDFDocument.load(pdfBytes);
                const currPage = pdfLibDoc.getPages()[pageOrder[currentPage - 1] - 1] || pdfLibDoc.getPages()[0];
                const { width, height } = currPage.getSize();

                const insertIndex = pageOrder[currentPage - 1];
                pdfLibDoc.insertPage(insertIndex, [width, height]);
                const newPdfBytes = await pdfLibDoc.save({ useObjectStreams: true });

                const newActualPageNum = insertIndex + 1;
                shiftAnnotations(newActualPageNum, 'insert');
                for (let i = 0; i < pageOrder.length; i++) {
                    if (pageOrder[i] >= newActualPageNum) pageOrder[i]++;
                }
                pageOrder.splice(currentPage, 0, newActualPageNum);
                shiftBookmarks(currentPage + 1, 'insert');

                await deleteAllChunks(currentFileId).catch(() => {});
                await storePdfInChunks(currentFileId, new Blob([newPdfBytes], { type: 'application/pdf' }));
                record.size = newPdfBytes.byteLength;
                record.chunked = true;
                record.chunkSize = PDF_CHUNK_SIZE;
                delete record.data;
                await putRecord(record);
                await replaceAllPageStates(currentFileId);

                await openPdfForRecord(record);
                currentPage = Math.min(currentPage + 1, pageOrder.length);
                initVirtualViewer();
                await goToPage(currentPage);
                await saveDocumentSettings();
                updateAutosaveIndicator('saved');
            } catch (error) {
                console.error(error);
                alert('Error adding page: ' + error.message);
                updateAutosaveIndicator('saved');
            }
        }

        async function deletePage(pageIndex) {
            try {
                if (pageOrder.length <= 1) return;
                await Promise.all([savePageDataNow(currentPage), saveDocumentSettings()]);
                updateAutosaveIndicator('saving');

                const record = await getRecord(currentFileId);
                if (!record) throw new Error('Document not found.');
                const actualToRemove = pageOrder[pageIndex - 1];
                const pdfBytes = await assemblePdfBytes(record);
                const pdfLibDoc = await PDFLib.PDFDocument.load(pdfBytes);
                pdfLibDoc.removePage(actualToRemove - 1);
                const newPdfBytes = await pdfLibDoc.save({ useObjectStreams: true });

                pageOrder.splice(pageIndex - 1, 1);
                for (let i = 0; i < pageOrder.length; i++) {
                    if (pageOrder[i] > actualToRemove) pageOrder[i]--;
                }
                shiftAnnotations(actualToRemove, 'delete');
                shiftBookmarks(pageIndex, 'delete');

                await deleteAllChunks(currentFileId).catch(() => {});
                await storePdfInChunks(currentFileId, new Blob([newPdfBytes], { type: 'application/pdf' }));
                record.size = newPdfBytes.byteLength;
                record.chunked = true;
                record.chunkSize = PDF_CHUNK_SIZE;
                delete record.data;
                await putRecord(record);

                if (currentPage > pageOrder.length) currentPage = pageOrder.length;
                await replaceAllPageStates(currentFileId);
                await openPdfForRecord(record);
                initVirtualViewer();
                await goToPage(currentPage);
                await saveDocumentSettings();
                updateAutosaveIndicator('saved');
            } catch (error) {
                console.error(error);
                alert('Error deleting page: ' + error.message);
                updateAutosaveIndicator('saved');
            }
        }

        function initVirtualViewer() {
            const container = document.getElementById('viewer-container');
            const thumbsContainer = document.getElementById('thumbnailsContainer');
            if (!container || !thumbsContainer) return;
            container.innerHTML = '';
            thumbsContainer.innerHTML = '';
            renderedPages.clear();

            if (pageObserver) pageObserver.disconnect();

            pageObserver = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    const pageWrapper = entry.target;
                    const displayIndex = parseInt(pageWrapper.dataset.pageNum);
                    const actualPageNum = parseInt(pageWrapper.dataset.actualPage);

                    if (entry.isIntersecting) {
                        if (!renderedPages.has(displayIndex)) {
                            renderPageContent(pageWrapper, actualPageNum, displayIndex);
                            renderedPages.add(displayIndex);
                        }
                    } else {
                        if (renderedPages.has(displayIndex)) {
                            const canvases = pageWrapper.querySelectorAll('canvas');
                            canvases.forEach(c => {
                                const ctx = c.getContext('2d');
                                if (ctx) ctx.clearRect(0, 0, c.width, c.height);
                            });
                            pageWrapper.dataset.rendered = "false";
                            renderedPages.delete(displayIndex);
                        }
                    }
                });
            }, { root: container, rootMargin: ((navigator.deviceMemory || 4) <= 2 ? '140px 120px' : '260px 220px') }); // زيادة مساحة التتبع لضمان سلاسة السحب في كل الاتجاهات

            for (let index = 0; index < pageOrder.length; index++) {
                const actualPageNum = pageOrder[index];
                const displayIndex = index + 1;

                const pageWrapper = document.createElement('div');
                pageWrapper.className = `page-wrapper ${globalPageStyle} ${displayIndex === currentPage ? 'active' : ''}`;
                pageWrapper.dataset.pageNum = displayIndex;
                pageWrapper.dataset.actualPage = actualPageNum;

                // إضافة البوكمارك الحمراء على الصفحة من فوق وتحتها ظل
                const bookmarkBadge = document.createElement('div');
                bookmarkBadge.className = 'page-bookmark-badge';
                bookmarkBadge.innerHTML = '🔖';
                bookmarkBadge.onclick = () => {
                    if (typeof goToPage === 'function') goToPage(displayIndex);
                    toggleSidebar(true);
                };
                pageWrapper.appendChild(bookmarkBadge);

                container.appendChild(pageWrapper);
                pageObserver.observe(pageWrapper);

                if (typeof renderThumbnailSkeleton === 'function') renderThumbnailSkeleton(displayIndex, actualPageNum);
                updatePageBookmarkUI(displayIndex);
            }

            applyViewModeUI();
            if (typeof reorderDOMPages === 'function') reorderDOMPages();
            if (typeof goToPage === 'function') goToPage(currentPage);
            requestAnimationFrame(() => {
                applyZoomTransform();
                const c = document.getElementById('viewer-container');
                const state = savedPageViewState[currentPage] || savedPageViewState[String(currentPage)] || {};
                if (c) { c.scrollLeft = Number(state.scrollLeft || 0); c.scrollTop = Number(state.scrollTop || 0); }
            });
        }

        async function renderPageContent(pageWrapper, actualPageNum, displayIndex) {
            if (pageWrapper.dataset.rendered === "true") return;
            pageWrapper.dataset.rendered = "true";

            const page = await pdfDoc.getPage(actualPageNum);
            const viewport = page.getViewport({ scale: baseScale });
            let quality = renderQualityScale;
            const maxPixels = ((navigator.deviceMemory || 4) <= 2 ? 1900000 : 3200000);
            const wantedPixels = viewport.width * viewport.height * quality * quality;
            if (wantedPixels > maxPixels) quality = Math.sqrt(maxPixels / (viewport.width * viewport.height));
            const hdViewport = page.getViewport({ scale: baseScale * quality });

            pageWrapper.dataset.baseWidth = viewport.width;
            pageWrapper.dataset.baseHeight = viewport.height;
            pageWrapper.style.width = (viewport.width * zoomScale) + 'px';
            pageWrapper.style.height = (viewport.height * zoomScale) + 'px';

            let pdfCanvas = pageWrapper.querySelector('canvas.pdf-render');
            if (!pdfCanvas) {
                pdfCanvas = document.createElement('canvas');
                pdfCanvas.className = 'pdf-render';
                pageWrapper.appendChild(pdfCanvas);
            }
            pdfCanvas.width = Math.ceil(hdViewport.width);
            pdfCanvas.height = Math.ceil(hdViewport.height);
            pdfCanvas.style.width = '100%';
            pdfCanvas.style.height = '100%';

            let textLayerDiv = pageWrapper.querySelector('.textLayer');
            if (!textLayerDiv) {

function renderThumbnailSkeleton(displayIndex, actualPageNum) {

            const thumbObserver = new IntersectionObserver((entries, obs) => {
                entries.forEach(async entry => {
                    if (entry.isIntersecting) {
                        obs.disconnect();
                        if (!pdfDoc) return;
                        try {
                            const page = await pdfDoc.getPage(actualPageNum);
                            const thumbViewport = page.getViewport({ scale: THUMB_SCALE });
                            const thumbCanvas = document.createElement('canvas');

                            thumbItem.insertBefore(overlayCanvas, pageNumBadge);

                            await page.render({
                                canvasContext: thumbCanvas.getContext('2d', { alpha: false }),
                                viewport: thumbViewport
                            }).promise;

                            renderThumbnailAnnotations(displayIndex, actualPageNum, thumbCanvas, overlayCanvas);

                        } catch (err) {

        function getThumbnailCanvases(displayIndex) {
            const thumb = document.querySelector(`.thumb-item[data-page-num="${displayIndex}"]`);
            if (!thumb) return null;
            return {
                pdf: thumb.querySelector('canvas:not(.thumb-annotation-canvas)'),
                overlay: thumb.querySelector('canvas.thumb-annotation-canvas')
            };
        }

        function loadThumbnailImage(src) {
            return new Promise(resolve => {
                if (!src) return resolve(null);
                const img = new Image();
                img.onload = () => resolve(img);
                img.onerror = () => resolve(null);
                img.src = src;
            });
        }

        async function renderThumbnailAnnotations(displayIndex, actualPageNum, pdfCanvas = null, overlayCanvas = null) {
            const canvases = overlayCanvas ? { pdf: pdfCanvas, overlay: overlayCanvas } : getThumbnailCanvases(displayIndex);
            if (!canvases?.overlay) return;

            const canvas = canvases.overlay;
            const ctx = canvas.getContext('2d');
            if (!ctx) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const baseW = parseFloat(document.querySelector(`.page-wrapper[data-page-num="${displayIndex}"]`)?.dataset.baseWidth) || (canvas.width / THUMB_SCALE);
            const scale = canvas.width / baseW;

            const drawing = currentDrawings[actualPageNum];
            if (drawing) {
                const img = await loadThumbnailImage(drawing);
                if (img) ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            }

            const images = currentImages[actualPageNum] || [];
            for (const item of images) {
                const img = await loadThumbnailImage(item.src);
                if (!img) continue;
                ctx.drawImage(img,
                    (Number(item.x) || 0) * scale,
                    (Number(item.y) || 0) * scale,
                    Math.max(1, (Number(item.w) || 150) * scale),
                    Math.max(1, (Number(item.h) || 150) * scale)
                );
            }

            const texts = currentTexts[actualPageNum] || [];
            ctx.save();
            ctx.textBaseline = 'top';
            for (const item of texts) {
                if (!item?.text) continue;
                const fontSize = Math.max(4, (Number(item.fontSize) || 18) * scale);
                ctx.font = `${fontSize}px -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif`;
                ctx.fillStyle = item.color || activeColor || '#000000';
                const lines = String(item.text).split(/\r?\n/);
                lines.forEach((line, index) => {
                    ctx.fillText(line, (Number(item.x) || 0) * scale, ((Number(item.y) || 0) * scale) + index * fontSize * 1.3);
                });
            }
            ctx.restore();
        }

        function refreshThumbnail(displayIndex, actualPageNum = Number(pageOrder[displayIndex - 1])) {
            const canvases = getThumbnailCanvases(displayIndex);
            if (!canvases?.overlay) return;

        function setupDragAndDrop(thumb) {
            thumb.addEventListener('dragstart', (e) => {
                thumb.classList.add('dragging');

            });

            thumb.addEventListener('dragend', () => {

            });

            thumb.addEventListener('dragover', (e) => {
                e.preventDefault();
                const container = document.getElementById('thumbnailsContainer');
                if (!container) return;
                const dragging = container.querySelector('.dragging');
                if (!dragging) return;
                const siblings = [...container.querySelectorAll('.thumb-item:not(.dragging)')];
                const nextSibling = siblings.find(sibling => {
                    return e.clientX <= sibling.getBoundingClientRect().left + sibling.getBoundingClientRect().width / 2;
                });
                if (nextSibling) {
                    container.insertBefore(dragging, nextSibling);
                } else {
                    container.appendChild(dragging);
                }
            });

            thumb.addEventListener('drop', (e) => {
                e.preventDefault();
            });
        }

        function scheduleDocumentSettingsSave() {
            clearTimeout(viewSaveTimeout);

        async function deleteAllPageStates(fileId) {
            const states = await getAllPageStates(fileId).catch(() => []);
            if (!states.length) return;
            const tx = db.transaction('pages', 'readwrite');
            const store = tx.objectStore('pages');
            states.forEach(state => store.delete([fileId, Number(state.page)]));
            await new Promise((resolve, reject) => {
                tx.oncomplete = resolve;
                tx.onerror = e => reject(e.target.error);
                tx.onabort = e => reject(e.target.error || new Error('Page-state delete aborted'));
            });
        }

        async function replaceAllPageStates(fileId) {

        async function saveAllLoadedPageStates() {
            const tasks = [];
            for (const displayIndex of Object.keys(currentDrawings)) {
                const actualPage = Number(displayIndex);
                tasks.push(putPageState({
                    fileId: currentFileId,
                    page: actualPage,
                    drawings: currentDrawings[actualPage] || null,
                    texts: currentTexts[actualPage] || [],
                    images: currentImages[actualPage] || []
                }));
            }
            for (const displayIndex of Object.keys(currentTexts)) {
                const actualPage = Number(displayIndex);
                if (currentDrawings[actualPage] !== undefined) continue;
                tasks.push(putPageState({
                    fileId: currentFileId,
                    page: actualPage,
                    drawings: null,
                    texts: currentTexts[actualPage] || [],
                    images: currentImages[actualPage] || []
                }));
            }
            for (const displayIndex of Object.keys(currentImages)) {
                const actualPage = Number(displayIndex);
                if (currentDrawings[actualPage] !== undefined || currentTexts[actualPage] !== undefined) continue;
                tasks.push(putPageState({
                    fileId: currentFileId,
                    page: actualPage,
                    drawings: null,
                    texts: [],
                    images: currentImages[actualPage] || []
                }));
            }
            await Promise.all(tasks);
        }

        function goToPage(pageNum) {
            if (!pdfDoc || pageNum < 1 || pageNum > pageOrder.length) return;
            const previousPage = currentPage;
            if (previousPage !== pageNum) {
                savePageDataNow(previousPage).catch(() => {});

            }

            const container = document.getElementById('viewer-container');
            const targetWrapper = document.querySelector(`.page-wrapper[data-page-num="${pageNum}"]`);

            });

            const pageState = savedPageViewState[currentPage] || {};
            if (Number.isFinite(Number(pageState.zoomScale))) {

            if (viewMode !== 'horizontal') return;
            const wrappers = document.querySelectorAll('.page-wrapper');
            wrappers.forEach(wrapper => {

        /* Pinch/zoom: always anchors on the point between the two fingers. */
        let initialDistance = null;
        let pinchStartZoom = 1;
        let pinchPoint = { x: 0, y: 0 };
        let pinchMidClient = { x: 0, y: 0 };
        const viewer = document.getElementById('viewer-container');
        const editorScreen = document.getElementById('editor-screen');
        const isLowPowerDevice = (navigator.deviceMemory || 4) <= 2;
        const startTouch = () => { if (currentTool && editorScreen) editorScreen.classList.add('is-touching'); };
        const endTouch = () => { if (editorScreen) editorScreen.classList.remove('is-touching'); };
        const touchDistance = (a,b) => Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);
        const touchMid = (a,b) => ({x:(a.clientX+b.clientX)/2,y:(a.clientY+b.clientY)/2});

        function applyZoomAround(newScale, clientX, clientY) {
            if (!viewer || !pdfDoc) return;
            const rect = viewer.getBoundingClientRect();
            const old = zoomScale;
            const z = Math.max(0.5, Math.min(6.0, newScale));
            if (Math.abs(z-old)<0.001) return;
            const lx = clientX-rect.left, ly=clientY-rect.top;
            const logicalX=(viewer.scrollLeft+lx)/old;
            const logicalY=(viewer.scrollTop+ly)/old;
            zoomScale=z;
            applyZoomTransform();
            requestAnimationFrame(()=>{
                viewer.scrollLeft=Math.max(0,logicalX*z-lx);
                viewer.scrollTop=Math.max(0,logicalY*z-ly);
                scheduleDocumentSettingsSave();
                updateZoomLabel();
            });
        }

        if (viewer) {
            viewer.addEventListener('touchstart', e => {
                if (e.touches.length!==2) return;
                e.preventDefault();
                e.stopImmediatePropagation();
                isDrawing=false;
                const d=touchDistance(e.touches[0],e.touches[1]);
                const m=touchMid(e.touches[0],e.touches[1]);
                const rect=viewer.getBoundingClientRect();
                initialDistance=Math.max(1,d);
                pinchStartZoom=zoomScale;
                pinchMidClient=m;
                pinchPoint={x:(viewer.scrollLeft+(m.x-rect.left))/zoomScale,y:(viewer.scrollTop+(m.y-rect.top))/zoomScale};
            },{passive:false,capture:true});

            viewer.addEventListener('touchmove', e => {
                if (e.touches.length!==2 || initialDistance===null) return;
                e.preventDefault();
                e.stopImmediatePropagation();
                const d=touchDistance(e.touches[0],e.touches[1]);
                const m=touchMid(e.touches[0],e.touches[1]);
                const z=Math.max(0.5,Math.min(6.0,pinchStartZoom*(d/initialDistance)));
                zoomScale=z;
                applyZoomTransform();
                const rect=viewer.getBoundingClientRect();
                viewer.scrollLeft=Math.max(0,pinchPoint.x*z-(m.x-rect.left));
                viewer.scrollTop=Math.max(0,pinchPoint.y*z-(m.y-rect.top));
                pinchMidClient=m;
                updateZoomLabel();
            },{passive:false,capture:true});

            const endPinch=()=>{ if(initialDistance!==null){ initialDistance=null; scheduleDocumentSettingsSave(); } };
            viewer.addEventListener('touchend', e => { e.stopImmediatePropagation(); endPinch(); },{passive:true,capture:true});
            viewer.addEventListener('touchcancel', e => { e.stopImmediatePropagation(); endPinch(); },{passive:true,capture:true});

            viewer.addEventListener('wheel', e => {
                if (!(e.ctrlKey||e.metaKey)||!pdfDoc) return;
                e.preventDefault();
                e.stopImmediatePropagation();
                applyZoomAround(zoomScale*Math.exp(-e.deltaY*0.0025),e.clientX,e.clientY);
            },{passive:false,capture:true});

            let scrollRaf=null;
            viewer.addEventListener('scroll',()=>{
                if(scrollRaf)return;
                scrollRaf=requestAnimationFrame(()=>{scrollRaf=null;scheduleDocumentSettingsSave();});
            },{passive:true});
        }

        function applyZoomTransform() {
            document.querySelectorAll('.page-wrapper').forEach(w=>{
                const baseW=parseFloat(w.dataset.baseWidth)||600;
                const baseH=parseFloat(w.dataset.baseHeight)||800;
                w.style.width=(baseW*zoomScale)+'px';

                    const y=parseFloat(node.dataset.baseY)||0;

                    node.style.top=(y*zoomScale)+'px';
                });
            });
            updateZoomLabel();
        }

        function fitPage(){const w=document.querySelector(`.page-wrapper[data-page-num="${currentPage}"]`);if(!w)return;const bw=+(w.dataset.baseWidth||600),bh=+(w.dataset.baseHeight||800);applyZoomAround(Math.min((viewer.clientWidth-40)/bw,(viewer.clientHeight-40)/bh),viewer.clientWidth/2,viewer.clientHeight/2);}

        let strokePoints = [];
        const eraserCursor = document.getElementById('eraser-cursor');

        function initDrawingEvents(canvas, displayIndex, actualPageNum) {
            const ctx=canvas.getContext('2d',{alpha:true,desynchronized:true});
            const getPos=e=>{const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*(canvas.width/r.width),y:(e.clientY-r.top)*(canvas.height/r.height)}};

                if(!drawing)return;

                    const rect=canvas.parentElement.getBoundingClientRect();const fontSize=toolSizes.text||18;const bw=+(canvas.parentElement.dataset.baseWidth||600),bh=+(canvas.parentElement.dataset.baseHeight||800);
                    createTextNode(((e.clientX-rect.left)/rect.width)*bw,((e.clientY-rect.top)/rect.height)*bh,'Type here...',activeColor,canvas.parentElement,displayIndex,fontSize);savePageData(displayIndex);return;
                }

                redoStack=[];
                historyStack.push({pageNum:displayIndex,dataUrl:canvas.toDataURL('image/png')});if(historyStack.length>12)historyStack.shift();
                drawing=true;canvas.setPointerCapture?.(e.pointerId);const p=getPos(e);points=[p];
                const factor=baseScale*renderQualityScale;const size=(toolSizes[currentTool]||4)*factor;
                ctx.lineWidth=size;ctx.lineCap='round';ctx.lineJoin='round';
                if(currentTool==='eraser'){
                    ctx.globalCompositeOperation='destination-out';ctx.globalAlpha=1;
                    if(eraserCursor){const ds=toolSizes.eraser*zoomScale;eraserCursor.style.width=ds+'px';eraserCursor.style.height=ds+'px';eraserCursor.style.left=e.clientX+'px';eraserCursor.style.top=e.clientY+'px';eraserCursor.style.display='block';}

                if(!drawing)return;const p=getPos(e),last=points[points.length-1];if(!last)return;if(Math.hypot(p.x-last.x,p.y-last.y)<1.2)return;
                if(currentTool==='pen'||currentTool==='highlighter'){
                    const mid={x:(last.x+p.x)/2,y:(last.y+p.y)/2};ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.quadraticCurveTo(last.x,last.y,mid.x,mid.y);ctx.stroke();
                }else if(currentTool==='eraser'){ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(p.x,p.y);ctx.stroke();}

            };

        // تحويل ألوان Hex/RGB إلى RGB متوافق مع PDFLib
        function parseColorToPdfRgb(colorStr) {
            if (!colorStr) return PDFLib.rgb(0, 0, 0);
            if (colorStr.startsWith('#')) {
                let hex = colorStr.replace('#', '');
                if (hex.length === 3) hex = hex.split('').map(c => c + c).join('');
                const intVal = parseInt(hex, 16);
                return PDFLib.rgb(((intVal >> 16) & 255) / 255, ((intVal >> 8) & 255) / 255, (intVal & 255) / 255);
            }
            const match = colorStr.match(/rgba?\((\d+),\s*(\d+),\s*(\d+)/);
            if (match) {
                return PDFLib.rgb(parseInt(match[1]) / 255, parseInt(match[2]) / 255, parseInt(match[3]) / 255);
            }
            return PDFLib.rgb(0, 0, 0);
        }

        async function exportFullPDF() {
            if (!pdfDoc || !window.PDFLib || !currentFileId) return;
            try {
                await savePageDataNow(currentPage);
                await saveDocumentSettings();
                updateAutosaveIndicator('saving');

                const record = await getRecord(currentFileId);
                if (!record || (!record.data && !record.chunked)) return;
                const sourceBytes = await assemblePdfBytes(record);
                const pdfLibDoc = await PDFLib.PDFDocument.load(sourceBytes);
                const newDoc = await PDFLib.PDFDocument.create();

                for (let i = 0; i < pageOrder.length; i++) {
                    const actualPageNum = pageOrder[i];
                    const [copiedPage] = await newDoc.copyPages(pdfLibDoc, [actualPageNum - 1]);
                    const page = newDoc.addPage(copiedPage);
                    const { width, height } = page.getSize();

                    if (currentDrawings && currentDrawings[actualPageNum]) {
                        try {
                            const img = await newDoc.embedPng(currentDrawings[actualPageNum]);
                            page.drawImage(img, { x: 0, y: 0, width, height });
                        } catch (err) { console.error('Error embedding drawings:', err); }
                    }

                    if (currentImages && currentImages[actualPageNum]) {
                        for (const imgData of currentImages[actualPageNum]) {
                            try {
                                let embeddedImg;
                                if (String(imgData.src).startsWith('data:image/png')) embeddedImg = await newDoc.embedPng(imgData.src);
                                else embeddedImg = await newDoc.embedJpg(imgData.src);
                                const pdfY = height - imgData.y - imgData.h;
                                page.drawImage(embeddedImg, { x: imgData.x, y: pdfY, width: imgData.w, height: imgData.h });
                            } catch (err) { console.error('Error embedding image node:', err); }
                        }
                    }

                    if (currentTexts && currentTexts[actualPageNum]) {
                        currentTexts[actualPageNum].forEach(t => {
                            if (!t.text) return;
                            try {
                                const pdfY = height - t.y - (t.fontSize || 18);
                                page.drawText(t.text, {
                                    x: t.x,
                                    y: pdfY > 0 ? pdfY : t.y,
                                    size: t.fontSize || 18,
                                    color: parseColorToPdfRgb(t.color)
                                });
                            } catch (err) { console.error('Error drawing text node:', err); }
                        });
                    }
                }

                const pdfBytes = await newDoc.save({ useObjectStreams: true });
                const blob = new Blob([pdfBytes], { type: 'application/pdf' });
                const link = document.createElement('a');
                const url = URL.createObjectURL(blob);
                link.href = url;
                link.download = `notebook_export_${Date.now()}.pdf`;
                document.body.appendChild(link);
                link.click();
                link.remove();
                setTimeout(() => URL.revokeObjectURL(url), 60_000);
                updateAutosaveIndicator('saved');
            } catch (err) {
                console.error('Export error:', err);
                updateAutosaveIndicator('saved');
                alert('Export failed: ' + (err?.message || err));
            }
        }

                const move=ev=>{const dx=(ev.clientX-startX)*(+(parent.dataset.baseWidth||600)/rect.width);const dy=(ev.clientY-startY)*(+(parent.dataset.baseHeight||800)/rect.height);origin.forEach(o=>{const nx=o.x+dx,ny=o.y+dy;o.n.dataset.baseX=nx;o.n.dataset.baseY=ny;o.n.style.left=(nx*zoomScale)+'px';o.n.style.top=(ny*zoomScale)+'px';});};

            const move=ev=>{const x=ev.clientX-r.left,y=ev.clientY-r.top;box.style.left=Math.min(x0,x)+'px';box.style.top=Math.min(y0,y)+'px';box.style.width=Math.abs(x-x0)+'px';box.style.height=Math.abs(y-y0)+'px';};
            const up=()=>{window.removeEventListener('pointermove',move,true);window.removeEventListener('pointerup',up,true);const br=box.getBoundingClientRect();box.remove();wrapper.querySelectorAll('.text-node-wrapper,.img-node').forEach(n=>{if(rectIntersects(br,nodeRect(n))){selectedNodes.add(n);n.classList.add('selected-node');}});};

        async function runPdfSearch(){
            const q=(document.getElementById('pdfSearchInput')?.value||'').trim().toLowerCase();if(!q||!pdfDoc)return;
            pdfSearchResults=[];pdfSearchIndex=-1;clearSearchHighlights();const st=document.getElementById('searchStatus');if(st)st.textContent='…';
            for(let d=1;d<=pageOrder.length;d++){
                const actual=pageOrder[d-1];const text=(await getPageTextCached(actual)).toLowerCase();if(text.includes(q))pdfSearchResults.push(d);
                if(d%5===0)await new Promise(r=>setTimeout(r,0));

            if(pdfSearchResults.length){pdfSearchIndex=0;showSearchResult();}

        // Dark mode UI was removed; do not re-apply any previous dark-mode preference.
        // Persist small UI preferences without touching PDF bytes.
        const _oldSaveDocumentSettings = saveDocumentSettings;
        saveDocumentSettings = async function(){
            await _oldSaveDocumentSettings();
            try { localStorage.setItem('zakerLastZoom', String(zoomScale)); localStorage.setItem('zakerLastViewMode', viewMode); } catch(e){}
        };
        window.addEventListener('beforeunload',()=>{try{scheduleDocumentSettingsSave();}catch(e){}});
        updateZoomLabel();
    </script>
</body>
</html>
