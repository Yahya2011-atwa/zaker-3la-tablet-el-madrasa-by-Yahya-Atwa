<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
    <link rel="manifest" href="./manifest.json">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <meta name="theme-color" content="#ffffff">
    <link rel="icon" type="image/png" href="./icon-192.png">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
    <title>Zaker by Yahya Atwa</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf_viewer.min.css">
    <style>
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, sans-serif; 
            -webkit-tap-highlight-color: transparent; 
        }
        
        html, body {
            width: 100%;
            min-width: 0;
            min-height: 100%;
            overscroll-behavior: none;
        }

        body { 
            background: #eef2f5;
            color: #1c1c1e; 
            height: 100vh; 
            height: 100dvh; 
            display: flex; 
            flex-direction: column; 
            overflow: hidden; 
            touch-action: manipulation;
            -webkit-text-size-adjust: 100%;
        }

        .glass-bg {
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%;
            background: radial-gradient(circle at 30% 20%, rgba(255, 255, 255, 0.98) 0%, rgba(225, 232, 245, 0.85) 50%, rgba(200, 212, 230, 0.9) 100%);
            filter: blur(20px);
            z-index: -1;
        }

        .apple-glass {
            background: rgba(255, 255, 255, 0.45) !important;
            backdrop-filter: blur(35px) saturate(220%) contrast(90%);
            -webkit-backdrop-filter: blur(35px) saturate(220%) contrast(90%);
            border: 1px solid rgba(255, 255, 255, 0.75) !important;
            box-shadow: 
                0 16px 40px 0 rgba(31, 38, 135, 0.08),
                inset 0 1px 2px 0 rgba(255, 255, 255, 0.9),
                inset 0 -1px 1px 0 rgba(0, 0, 0, 0.03);
            transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.25s ease, background 0.3s;
        }

        #status-bar {
            position: fixed;
            top: 8px;
            right: 15px;
            z-index: 1005;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 11px;
            font-weight: 600;
            color: #1c1c1e;
            padding: 4px 12px;
            border-radius: 16px;
            pointer-events: none;
            letter-spacing: -0.2px;
        }

        #eraser-cursor {
            position: fixed;
            pointer-events: none;
            border: 1.5px solid rgba(0, 0, 0, 0.5);
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            z-index: 9999;
            display: none;
            box-shadow: 0 0 12px rgba(0,0,0,0.1);
            backdrop-filter: blur(3px);
            -webkit-backdrop-filter: blur(3px);
        }

        #home-screen { padding: 25px; display: flex; flex-direction: column; height: 100%; max-width: 900px; margin: 0 auto; width: 100%; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .header h2 { font-weight: 600; font-size: 22px; letter-spacing: -0.5px; color: #1c1c1e; }

        .btn-apple { 
            background: rgba(255, 255, 255, 0.75); color: #1c1c1e; border: 0.5px solid rgba(0, 0, 0, 0.12); 
            padding: 8px 16px; border-radius: 20px; font-weight: 600; cursor: pointer; font-size: 13px;
            backdrop-filter: blur(15px); transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1); display: flex; align-items: center; gap: 6px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }
        .btn-apple:active { transform: scale(0.95); background: rgba(255, 255, 255, 0.9); }

        .notes-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 15px; overflow-y: auto; flex: 1; padding: 5px; will-change: transform; }
        .note-card { border-radius: 18px; padding: 15px; cursor: pointer; display: flex; flex-direction: column; align-items: center; position: relative; transition: all 0.2s ease; will-change: transform; }
        .note-card:active { transform: scale(0.96); }
        .pdf-icon { font-size: 40px; margin: 10px 0; opacity: 0.9; color: #1c1c1e; }
        .note-title { font-weight: 500; font-size: 12px; text-align: center; color: #1c1c1e; width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .delete-btn { position: absolute; top: 8px; right: 8px; background: rgba(255, 59, 48, 0.85); color: white; border: none; border-radius: 50%; width: 22px; height: 22px; font-weight: bold; cursor: pointer; font-size: 11px; }

        #editor-screen { display: none; flex-direction: column; height: 100vh; height: 100dvh; position: relative; width: 100vw; overflow: hidden; background: #eef2f5; }
        
        .glass-bar-width {
            width: 92vw;
            max-width: 850px;
        }

        #toolbar-container {
            position: fixed; 
            top: 28px; 
            left: 50%; 
            transform: translateX(-50%);
            z-index: 1000; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            gap: 8px;
            pointer-events: auto;
            transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.25s ease;
        }
        
        #toolbar { 
            display: flex; gap: 6px; padding: 6px 12px; border-radius: 30px; align-items: center; 
            justify-content: space-between; flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none;
        }
        #toolbar::-webkit-scrollbar { display: none; }
        
        #toolbar button { 
            padding: 6px 10px; border-radius: 20px; border: 0.5px solid rgba(0, 0, 0, 0.08); 
            background: rgba(0, 0, 0, 0.04); color: #1c1c1e; cursor: pointer; font-size: 13px; transition: all 0.2s;
            display: flex; align-items: center; gap: 4px; flex-shrink: 0;
            font-weight: 500;
        }
        #toolbar button svg {
            fill: #1c1c1e;
            width: 16px;
            height: 16px;
        }
        #toolbar button:active { transform: scale(0.95); }
        #toolbar button.active { background: #1c1c1e; color: #ffffff; border-color: #1c1c1e; }
        #toolbar button.active svg { fill: #ffffff; }
        
        .btn-view-mode {
            background: rgba(0, 0, 0, 0.05) !important;
            border: 0.5px solid rgba(0, 0, 0, 0.12) !important;
            color: #1c1c1e !important;
        }

        #autosave-indicator {
            font-size: 11px;
            padding: 2px 10px;
            border-radius: 10px;
            background: rgba(0, 0, 0, 0.04);
            color: #34c759;
            margin-left: 5px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-weight: 600;
        }

        #toast-container {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(0, 0, 0, 0.1);
            color: #1c1c1e;
            padding: 10px 20px;
            border-radius: 25px;
            z-index: 2000;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.12);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s ease;
            opacity: 0;
            pointer-events: none;
        }
        #toast-container.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
            pointer-events: auto;
        }
        #toast-container button {
            background: #1c1c1e;
            color: white;
            border: none;
            padding: 4px 12px;
            border-radius: 15px;
            cursor: pointer;
            font-weight: 600;
            font-size: 12px;
        }

        #size-slider-panel {
            display: none;
            align-items: center;
            gap: 12px;
            padding: 6px 20px;
            border-radius: 20px;
            width: 100%;
            animation: fadeIn 0.2s ease;
        }

        .size-slider {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 6px;
            border-radius: 3px;
            background: rgba(0, 0, 0, 0.1);
            outline: none;
        }

        .size-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #1c1c1e;
            box-shadow: 0 0 8px rgba(0, 0, 0, 0.2);
            cursor: pointer;
            border: 2px solid #ffffff;
        }

        .size-val-badge {
            font-size: 12px; font-weight: bold; min-width: 28px; text-align: center; color: #1c1c1e;
        }

        .color-palette { display: flex; gap: 4px; align-items: center; background: rgba(0,0,0,0.04); padding: 3px 6px; border-radius: 20px; border: 0.5px solid rgba(0,0,0,0.08); flex-shrink: 0; }
        .recent-color-swatch { width: 18px; height: 18px; border-radius: 50%; cursor: pointer; border: 1px solid rgba(0,0,0,0.15); }

        #background-panel {
            display: none;
            align-items: center;
            justify-content: center;
            gap: 15px;
            padding: 8px 20px;
            border-radius: 20px;
            width: 100%;
            animation: fadeIn 0.2s ease;
        }

        .circle-btn {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 2px solid #ccc;
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
            cursor: pointer;
            background-color: #fff;
            transition: transform 0.2s, border-color 0.2s;
            flex-shrink: 0;
        }
        .circle-btn:hover { transform: scale(1.15); border-color: #1c1c1e; }

        .btn-lined {
            background-image: repeating-linear-gradient(transparent, transparent 5px, #a3a3a3 5px, #a3a3a3 6px);
        }
        .btn-grid {
            background-size: 8px 8px;
            background-image: 
                linear-gradient(to right, #a3a3a3 1px, transparent 1px), 
                linear-gradient(to bottom, #a3a3a3 1px, transparent 1px);
        }

        .page-wrapper.blank { background-image: none; background-color: #ffffff; }
        .page-wrapper.lined {
            background-color: #ffffff;
            background-image: repeating-linear-gradient(transparent, transparent 31px, #d1d5db 31px, #d1d5db 32px);
            background-position: 0 10px;
        }
        .page-wrapper.grid {
            background-color: #ffffff;
            background-size: 30px 30px;
            background-image:
                linear-gradient(to right, #e5e7eb 1px, transparent 1px),
                linear-gradient(to bottom, #e5e7eb 1px, transparent 1px);
        }

        /* تحسين التصفح والوصول لأي ركن بحرية تامة بغض النظر عن الزوم */
        #viewer-container {
            flex: 1;
            width: 100%;
            height: 100%;
            min-width: 0;
            min-height: 0;
            overflow: auto;
            display: flex;
            align-items: flex-start;
            justify-content: flex-start;
            flex-direction: row;
            gap: 0;
            padding: 180px;
            padding-bottom: max(180px, calc(180px + env(safe-area-inset-bottom)));
            touch-action: pan-x pan-y pinch-zoom;
            -webkit-overflow-scrolling: touch;
            overscroll-behavior: contain;
            scroll-behavior: auto;
            scrollbar-width: auto;
            will-change: scroll-position;
            scrollbar-gutter: stable;
        }

        #viewer-container.horizontal .page-wrapper { display: none; }
        #viewer-container.horizontal .page-wrapper.active {
            display: block;
            animation: fadeIn 0.25s ease-in-out;
        }

        #viewer-container.vertical {
            gap: 40px;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
        }

        #viewer-container.vertical .page-wrapper { display: block; }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.98); }
            to { opacity: 1; transform: scale(1); }
        }

        .page-wrapper {
            position: relative;
            border-radius: 12px;
            box-shadow: 0 12px 35px rgba(0,0,0,0.12);
            flex: 0 0 auto;
            margin: 0 auto;
            transition: background 0.2s ease;
            min-height: 500px;
        }

        /* مساحة أمان حول الصفحة للوصول لكل حافاتها بعد التكبير */
        #viewer-container::before,
        #viewer-container::after {
            content: "";
            flex: 0 0 1px;
        }

        /* عند كِبَر الصفحة لا نعتمد على transform؛ الحجم الحقيقي هو مساحة الـ scroll */
        #viewer-container.horizontal .page-wrapper.active {
            margin-left: max(0px, calc((100vw - 360px) / 2));
            margin-right: max(0px, calc((100vw - 360px) / 2));
        }

        #viewer-container.vertical .page-wrapper {
            margin-left: auto;
            margin-right: auto;
        }

                canvas.pdf-render { display: block; border-radius: 12px; width: 100%; height: 100%; mix-blend-mode: multiply; }
        canvas.draw-canvas { 
            position: absolute; top: 0; left: 0; border-radius: 12px; 
            touch-action: none; z-index: 2; width: 100%; height: 100%; 
            pointer-events: none; 
        }

        .textLayer {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            overflow: hidden; opacity: 1.0; line-height: 1.0; z-index: 1; border-radius: 12px; 
            pointer-events: auto;
        }
        
        .textLayer ::selection { background: rgba(0, 0, 0, 0.15); color: transparent; }
        .textLayer span { color: transparent; cursor: text; position: absolute; white-space: pre; transform-origin: 0% 0%; }

        /* Modern bookmark: clean solid tab with a triangular cut at the bottom. */
        .page-bookmark-badge {
            position: absolute;
            top: -1px;
            right: 28px;
            width: 30px;
            height: 42px;
            background: #ff3b30;
            clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 78%, 0 100%);
            box-shadow: 0 5px 10px rgba(255, 59, 48, 0.25);
            z-index: 15;
            display: none;
            cursor: pointer;
            transition: transform 0.16s ease, filter 0.16s ease;
        }
        .page-bookmark-badge:hover {
            transform: translateY(-2px);
            filter: brightness(1.04);
        }
        .page-wrapper.bookmarked .page-bookmark-badge {
            display: block;
        }

        /* ستايل القائمة الجانبية للبوكماركس والفهرس */
        #sidebar-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(4px);
            z-index: 2000;
            display: none;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        #sidebar-overlay.show {
            display: block;
            opacity: 1;
        }

        #sidebar {
            position: fixed;
            top: 0;
            left: -320px;
            width: 300px;
            height: 100%;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(30px);
            z-index: 2001;
            box-shadow: 5px 0 30px rgba(0,0,0,0.15);
            transition: left 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            flex-direction: column;
            padding: 20px;
            border-right: 1px solid rgba(255,255,255,0.8);
        }
        #sidebar.open {
            left: 0;
        }
        .sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(0,0,0,0.1);
        }
        .sidebar-header h3 {
            font-size: 16px;
            font-weight: 600;
            color: #1c1c1e;
        }
        .sidebar-close {
            background: none;
            border: none;
            font-size: 18px;
            cursor: pointer;
            color: #1c1c1e;
        }
        .sidebar-content {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .bookmark-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 12px;
            background: rgba(255, 255, 255, 0.6);
            border: 0.5px solid rgba(0, 0, 0, 0.08);
            border-radius: 12px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .bookmark-item:hover { background: rgba(255, 255, 255, 0.9); }
        .bookmark-item.current { border-color: rgba(0,122,255,.25); background: rgba(0,122,255,.08); }
        .bookmark-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
            flex: 1;
        }
        .bookmark-title {
            font-size: 13px;
            font-weight: 600;
            color: #1c1c1e;
            outline: none;
            border-bottom: 1px dashed transparent;
        }
        .bookmark-title:focus {
            border-bottom-color: #007aff;
        }
        .bookmark-page {
            font-size: 11px;
            color: #8e8e93;
        }
        .bookmark-actions {
            display: flex;
            gap: 6px;
        }
        .bookmark-delete {
            background: none;
            border: none;
            color: #ff3b30;
            cursor: pointer;
            font-size: 14px;
        }
        .bookmark-empty { text-align:center; color:#8e8e93; font-size:13px; margin-top:30px; line-height:1.6; }
        .bookmark-empty span { font-size:11px; opacity:.8; }
        .sidebar-header h3::after {
            content: attr(data-count); margin-left:7px; font-size:10px; opacity:.55; font-weight:700;
        }

        #bottom-thumbnails-bar {
            position: fixed; 
            bottom: 15px; 
            left: 50%; 
            transform: translateX(-50%);
            z-index: 1000; 
            display: flex; 
            align-items: center; 
            justify-content: space-between;
            gap: 8px; 
            padding: 8px 12px; 
            border-radius: 24px;
            pointer-events: auto;
            transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.25s ease;
        }


        .thumb-scroll-btn {
            background: rgba(0, 0, 0, 0.05); border: 0.5px solid rgba(0, 0, 0, 0.1);
            color: #1c1c1e; border-radius: 50%; width: 34px; height: 34px; display: flex;
            align-items: center; justify-content: center; cursor: pointer; font-size: 12px; flex-shrink: 0; transition: all 0.2s;
            font-weight: bold;
        }
        .thumb-scroll-btn:active { transform: scale(0.9); background: rgba(0, 0, 0, 0.15); }

        .thumbnails-container {
            display: flex; gap: 10px; overflow-x: auto; scroll-behavior: smooth;
            padding: 8px 4px; flex: 1; scrollbar-width: none; touch-action: pan-x;
        }
        .thumbnails-container::-webkit-scrollbar { display: none; }

        .thumb-item {
            position: relative; flex-shrink: 0; cursor: pointer; border-radius: 8px;
            overflow: visible; border: 2px solid transparent; transition: all 0.2s ease;
            background: rgba(0, 0, 0, 0.03); display: flex; flex-direction: column; align-items: center;
            user-select: none; min-width: 45px; min-height: 60px;
        }

        .thumb-item.active { border-color: #1c1c1e; box-shadow: 0 0 12px rgba(0, 0, 0, 0.2); transform: scale(1.05); }
        .thumb-item canvas { display: block; height: 60px; width: auto; border-radius: 6px; pointer-events: none; }
        .thumb-item { overflow: visible; }
        .thumb-annotation-canvas { position: absolute; left: 0; top: 0; height: 60px; width: auto; border-radius: 6px; pointer-events: none; z-index: 1; }
        .thumb-page-num { z-index: 2; }
        .thumb-bookmark-badge {
            position:absolute; top:-5px; right:2px; width:14px; height:21px; z-index:12;
            display:none; background:#ff3b30;
            clip-path:polygon(0 0,100% 0,100% 100%,50% 78%,0 100%);
            box-shadow:0 2px 5px rgba(255,59,48,.22); pointer-events:none;
        }
        .thumb-item.bookmarked .thumb-bookmark-badge { display:block; }

        .thumb-page-num {
            position: absolute; bottom: 3px; right: 3px; background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border: 0.5px solid rgba(0, 0, 0, 0.15); color: #1c1c1e; font-size: 10px;
            padding: 2px 6px; border-radius: 8px; font-weight: 700; box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
            pointer-events: none;
        }

        .thumb-delete-badge {
            display: none; position: absolute; top: -8px; left: -8px; background: #ff3b30;
            color: white; border: 1.5px solid #fff; border-radius: 50%; width: 22px; height: 22px;
            font-size: 12px; font-weight: bold; cursor: pointer; align-items: center; justify-content: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2); z-index: 10;
        }

        .thumbnails-container.edit-mode .thumb-delete-badge { display: flex; }
        .thumbnails-container.edit-mode .thumb-item { animation: none; }
        .thumbnails-container.edit-mode .thumb-item.active { transform: scale(1.05); }

        .thumb-item.dragging { opacity: 0.3; }

        .text-node-wrapper { position: absolute; z-index: 10; display: inline-block; touch-action: none; user-select: none; }
        .text-node { background: transparent; border: 1px dashed transparent; padding: 4px 8px; cursor: move; min-width: 40px; outline: none; font-family: inherit; line-height: 1.3; word-break: break-word; user-select: text; }
        .text-node-wrapper:focus-within .text-node { border-color: rgba(0, 0, 0, 0.3); cursor: text; }
        .delete-text-badge { display: none; position: absolute; top: -10px; right: -10px; background: #ff3b30; color: white; border: none; border-radius: 50%; width: 20px; height: 20px; font-size: 11px; font-weight: bold; cursor: pointer; align-items: center; justify-content: center; box-shadow: 0 2px 6px rgba(0,0,0,0.2); z-index: 11; }
        .text-node-wrapper:focus-within .delete-text-badge, .text-node-wrapper:hover .delete-text-badge { display: flex; }

        .img-node { position: absolute; border: 1px dashed #1c1c1e; cursor: move; user-select: none; z-index: 3; touch-action: none; }
        .img-node img { width: 100%; height: 100%; pointer-events: none; display: block; }
        .img-node .delete-img { position: absolute; top: -8px; right: -8px; background: #ff3b30; color: white; border: none; border-radius: 50%; width: 18px; height: 18px; font-size: 10px; cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 5; }
        .resize-handle { position: absolute; width: 12px; height: 12px; background: #1c1c1e; border: 2px solid #fff; border-radius: 50%; bottom: -6px; right: -6px; cursor: se-resize; z-index: 5; }

        @media (orientation: landscape) {
            #toolbar-container { top: 18px; }

        /* ===== In-app color wheel ===== */

<script>
        let fullscreenWanted = false;
        let fullscreenWasActive = false;
        let fullscreenExplicitlyExited = false;

        function isFullscreenActive() {
            return !!(document.fullscreenElement || document.webkitFullscreenElement);
        }

        function updateFullscreenButton() {
            const btn = document.getElementById('fullscreenBtn');
            if (!btn) return;
            const active = isFullscreenActive();
            btn.classList.toggle('active', active);
            btn.title = active ? 'Exit Fullscreen' : 'Fullscreen';
            btn.innerHTML = active
                ? `<svg viewBox="0 0 24 24"><path d="M9 7H7v3H5V5h5v2H9zm8 3V7h-2V5h4v5h-2zM7 14H5v5h5v-2H7v-3zm10 0h2v5h-5v-2h3v-3z"/></svg>`
                : `<svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm0-4h3V7h2v5H7V10zm10 4h2v5h-5v-2h3v-3zM14 7h3v3h2V5h-5v2z"/></svg>`;
        }

        async function requestAppFullscreen(fromUserGesture = false) {
            if (!document.documentElement.requestFullscreen || isFullscreenActive()) {
                updateFullscreenButton();
                return false;
            }
            try {
                await document.documentElement.requestFullscreen({ navigationUI: 'hide' });
                fullscreenWasActive = true;
                fullscreenExplicitlyExited = false;
                updateFullscreenButton();
                return true;
            } catch (err) {
                // Browser security can reject fullscreen without a user gesture.
                if (fromUserGesture) console.warn('Fullscreen request rejected:', err);
                return false;
            }
        }

        async function exitAppFullscreen() {
            try {
                if (document.exitFullscreen && isFullscreenActive()) {
                    fullscreenExplicitlyExited = true;
                    await document.exitFullscreen();
                }
            } catch (err) {
                console.warn('Fullscreen exit rejected:', err);
            } finally {
                updateFullscreenButton();
            }
        }

        async function toggleFullscreen() {
            if (isFullscreenActive()) {
                fullscreenWanted = false;
                fullscreenExplicitlyExited = true;
                await exitAppFullscreen();
            } else {
                fullscreenWanted = true;
                fullscreenExplicitlyExited = false;
                await requestAppFullscreen(true);
            }
        }

        function tryRestoreFullscreenOnReturn() {
            if (!fullscreenWanted || fullscreenExplicitlyExited) return;
            if (document.getElementById('editor-screen')?.style.display === 'none') return;
            if (!isFullscreenActive()) {
                requestAppFullscreen(false);
            }
        }

        document.addEventListener('fullscreenchange', () => {
            const active = isFullscreenActive();
            if (active) fullscreenWasActive = true;
            updateFullscreenButton();
            if (!active && fullscreenWanted && !fullscreenExplicitlyExited) {
                setTimeout(tryRestoreFullscreenOnReturn, 120);
            }
        });
        document.addEventListener('webkitfullscreenchange', updateFullscreenButton);
        window.addEventListener('pageshow', tryRestoreFullscreenOnReturn);
        document.addEventListener('visibilitychange', () => {
            if (!document.hidden) setTimeout(tryRestoreFullscreenOnReturn, 120);
        });

        // Preserve the original convenience: the first real interaction may enter fullscreen.
        function autoEnableFullScreenFromGesture() {
            if (!fullscreenWanted && !isFullscreenActive() && document.getElementById('editor-screen')?.style.display !== 'none') {
                fullscreenWanted = true;
                requestAppFullscreen(true);
            }
            document.removeEventListener('pointerdown', autoEnableFullScreenFromGesture);
            document.removeEventListener('touchstart', autoEnableFullScreenFromGesture);
        }
        document.addEventListener('pointerdown', autoEnableFullScreenFromGesture, { once: true });
        document.addEventListener('touchstart', autoEnableFullScreenFromGesture, { once: true, passive: true });
        updateFullscreenButton();

        // تحديث الوقت بتنسيق 12 ساعة مع الثواني والبطارية
        function updateSystemStatus() {
            const timeSpan = document.getElementById('time-display');
            const batterySpan = document.getElementById('battery-display');
            
            const now = new Date();
            if (timeSpan) {
                timeSpan.innerText = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true });
            }

            if (navigator.getBattery) {
                navigator.getBattery().then(battery => {
                    const level = Math.round(battery.level * 100);
                    if (batterySpan) batterySpan.innerText = (battery.charging ? "⚡ " : "🔋 ") + level + "%";
                });

            const store = tx.objectStore('portable');

        async function storePortablePdfInChunks(fileId, file) {
            const old = await getAllPortableChunks(fileId).catch(() => []);
            if (old.length) {
                const clearTx = db.transaction('portable', 'readwrite');
                const clearStore = clearTx.objectStore('portable');
                old.forEach(c => clearStore.delete([fileId, c.index]));
                await new Promise((resolve, reject) => {

                    clearTx.onerror = e => reject(e.target.error || new Error('Portable PDF clear failed'));
                    clearTx.onabort = e => reject(e.target.error || new Error('Portable PDF clear aborted'));
                });

            const count = Math.ceil(file.size / PDF_CHUNK_SIZE);
            for (let i = 0; i < count; i++) {
                const blob = file.slice(i * PDF_CHUNK_SIZE, Math.min(file.size, (i + 1) * PDF_CHUNK_SIZE), 'application/octet-stream');
                await idbRequest(db.transaction('portable', 'readwrite').objectStore('portable').put({
                    fileId, index: i, data: blob, size: blob.size
                }));
                if ((i + 1) % 3 === 0) await new Promise(resolve => setTimeout(resolve, 0));
            }
        }

        async function assemblePortablePdfBytes(fileId) {
            const chunks = (await getAllPortableChunks(fileId)).sort((a,b) => a.index - b.index);
            if (!chunks.length) return null;
            const total = chunks.reduce((n, c) => n + (c.data?.size || 0), 0);
            const result = new Uint8Array(total);
            let offset = 0;
            for (const c of chunks) {
                const part = new Uint8Array(await c.data.arrayBuffer());
                result.set(part, offset);
                offset += part.byteLength;
            }
            return result;
        }

                    await idbRequest(db.transaction('chunks', 'readwrite').objectStore('chunks').put({

        async function assemblePdfBytes(record) {

                let offset = 0;
                for (const c of chunks) {

        class IDBRangeTransport extends pdfjsLib.PDFDataRangeTransport {
            constructor(fileId, length) {
                super(length, null, false, null, false);
                this.fileId = fileId;
                this.length = length;
                this.pending = new Map();
            }

            requestDataRange(begin, end) {
                const key = begin + ':' + end;
                if (this.pending.has(key)) return;
                this.pending.set(key, true);
                this._readRange(begin, end).then(bytes => {
                    this.pending.delete(key);
                    this.onDataRange(begin, bytes);
                }).catch(err => {
                    this.pending.delete(key);
                    console.error('PDF range read error:', err);
                });
            }

            async _readRange(begin, end) {
                const first = Math.floor(begin / PDF_CHUNK_SIZE);
                const last = Math.floor((Math.max(begin, end - 1)) / PDF_CHUNK_SIZE);
                const chunks = await Promise.all(
                    Array.from({ length: last - first + 1 }, (_, i) =>
                        idbRequest(db.transaction('chunks', 'readonly').objectStore('chunks').get([this.fileId, first + i]))
                    )
                );

                const output = new Uint8Array(end - begin);
                let outOffset = 0;
                for (let i = 0; i < chunks.length; i++) {
                    const chunk = chunks[i];
                    if (!chunk?.data) continue;
                    const bytes = new Uint8Array(await chunk.data.arrayBuffer());
                    const chunkStart = (first + i) * PDF_CHUNK_SIZE;
                    const from = Math.max(begin, chunkStart);
                    const to = Math.min(end, chunkStart + bytes.byteLength);
                    if (to > from) {
                        const part = bytes.subarray(from - chunkStart, to - chunkStart);
                        output.set(part, outOffset);
                        outOffset += part.byteLength;
                    }
                }
                return output;
            }
        }

            const settings = await getSettings(record.id).catch(() => null);
            if (settings) {
                pageOrder = Array.isArray(settings.pageOrder) ? [...settings.pageOrder] : [];
                currentBookmarks = settings.bookmarks || {};
                // v2 bookmarks are keyed by the physical/actual page id, not by display position.
                // Migrate old display-position bookmarks once so reordering can never detach them.
                if (settings.bookmarkVersion !== 2) {
                    const migrated = {};
                    for (const [displayKey, title] of Object.entries(currentBookmarks)) {
                        const display = Number(displayKey);
                        const actual = Number(pageOrder[display - 1] ?? display);
                        if (actual) migrated[actual] = title;
                    }
                    currentBookmarks = migrated;
                }
                viewMode = settings.viewMode || 'horizontal';
                globalPageStyle = settings.globalPageStyle || 'blank';
                savedPageViewState = settings.pageViewState || {};
            } else if (record.pageOrder?.length) {
                pageOrder = [...record.pageOrder];
                currentBookmarks = record.bookmarks || {};
                viewMode = record.viewMode || 'horizontal';
                globalPageStyle = record.globalPageStyle || 'blank';
                savedPageViewState = record.pageViewState || {};
            }

            const pageStates = await getAllPageStates(record.id).catch(() => []);
            if (pageStates.length) {
                pageStates.forEach(state => {
                    const p = Number(state.page);
                    if (state.drawings) currentDrawings[p] = state.drawings;
                    if (state.texts) currentTexts[p] = state.texts;
                    if (state.images) currentImages[p] = state.images;
                });
            } else if (record.drawings || record.texts || record.images) {
                currentDrawings = record.drawings || {};
                currentTexts = record.texts || {};
                currentImages = record.images || {};
                await migrateLegacyAnnotations(record);
            }

        async function migrateLegacyAnnotations(record) {
            if (legacyMigrationDone || !currentFileId) return;
            legacyMigrationDone = true;
            const pages = new Set([
                ...Object.keys(currentDrawings || {}),
                ...Object.keys(currentTexts || {}),
                ...Object.keys(currentImages || {})
            ].map(Number).filter(Number.isFinite));
            for (const actualPage of pages) {
                await putPageState({
                    fileId: currentFileId,
                    page: actualPage,
                    drawings: currentDrawings[actualPage] || null,
                    texts: currentTexts[actualPage] || [],
                    images: currentImages[actualPage] || []
                });
            }
            await putSettings({
                fileId: currentFileId,
                pageOrder: [...pageOrder],
                bookmarks: currentBookmarks,
                bookmarkVersion: 2,
                viewMode,
                globalPageStyle,
                pageViewState: savedPageViewState
            });
        }

                    length: record.size,
                    disableStream: true,
                    disableAutoFetch: true,

                const legacyBlob = record.data instanceof Blob ? record.data : new Blob([await readLegacyDataAsUint8Array(record.data)], { type: 'application/pdf' });

                    url: currentPdfUrl,
                    disableStream: false,
                    disableAutoFetch: false
                }).promise;
            }
        }

            const c=v*s, x=c*(1-Math.abs((h/60)%2-1)), m=v-c;
            let r=0,g=0,b=0;
            if(h<60){r=c;g=x;} else if(h<120){r=x;g=c;} else if(h<180){g=c;b=x;}
            else if(h<240){g=x;b=c;} else if(h<300){r=x;b=c;} else {r=c;b=x;}
            return rgbToHex((r+m)*255,(g+m)*255,(b+m)*255);
        }

        function hexToHsv(hex) {
            const n = normalizeHex(hex) || '#000000';
            const r=parseInt(n.slice(1,3),16)/255,g=parseInt(n.slice(3,5),16)/255,b=parseInt(n.slice(5,7),16)/255;
            const max=Math.max(r,g,b), min=Math.min(r,g,b), d=max-min;
            let h=0;
            if(d){ if(max===r) h=60*((g-b)/d%6); else if(max===g) h=60*((b-r)/d+2); else h=60*((r-g)/d+4); }
            const s=max===0?0:d/max;
            return {h:(h+360)%360,s,v:max};
        }

        function syncColorEditorFromHex(hex) {
            const normalized = normalizeHex(hex) || '#000000';
            const hsv = hexToHsv(normalized);
            colorWheelHue = hsv.h; colorWheelSaturation = hsv.s; colorWheelValue = hsv.v;
            const input=document.getElementById('colorHexInput');
            if(input) input.value=normalized;
            updateColorEditor();

        function updateColorEditor() {
            const wheel=document.getElementById('colorWheel');
            const sv=document.getElementById('colorSV');
            const preview=document.getElementById('colorPreview');
            const input=document.getElementById('colorHexInput');
            const hex=hsvToHex(colorWheelHue,colorWheelSaturation,colorWheelValue);
            activeColor=hex;
            if(wheel){
                const angle=(colorWheelHue-90)*Math.PI/180, r=88;
                const cx=105+Math.cos(angle)*r, cy=105+Math.sin(angle)*r;
                const marker=wheel.querySelector('.color-wheel-center');
                if(marker){marker.style.left=cx+'px';marker.style.top=cy+'px';}
            }
            if(sv){
                const hueColor=hsvToHex(colorWheelHue,1,1);
                sv.style.background=`linear-gradient(to top,#000,transparent),linear-gradient(to right,#fff,${hueColor})`;
                sv.style.setProperty('--sv-x',(colorWheelSaturation*100)+'%');

        function handleColorWheelPointer(e) {
            const wheel=document.getElementById('colorWheel'); if(!wheel)return;
            const r=wheel.getBoundingClientRect(), x=e.clientX-r.left-r.width/2, y=e.clientY-r.top-r.height/2;
            const distance=Math.sqrt(x*x+y*y);
            if(distance < r.width*.38 || distance > r.width*.52) return;
            colorWheelHue=(Math.atan2(y,x)*180/Math.PI+90+360)%360;
            updateColorEditor();
        }

        function handleColorSVPointer(e) {
            const sv=document.getElementById('colorSV'); if(!sv)return;

            colorWheelValue=1-Math.max(0,Math.min(1,(e.clientY-r.top)/r.height));
            updateColorEditor();
        }

        async function cleanupDuplicateFileRecords() {
            if (!db) return;
            try {
                const all = await idbRequest(
                    db.transaction('files', 'readonly').objectStore('files').getAll()
                );
                const groups = new Map();

                for (const record of all) {
                    if (!record?.fingerprint) continue;
                    const key = record.fingerprint;
                    if (!groups.has(key)) groups.set(key, []);
                    groups.get(key).push(record);
                }

                for (const records of groups.values()) {
                    if (records.length <= 1) continue;

                    // Keep the newest non-deleted record. Older duplicate cards
                    // are soft-deleted so their saved annotations remain recoverable.
                    records.sort((a, b) => Number(b.lastReaddedAt || b.createdAt || 0) -
                                          Number(a.lastReaddedAt || a.createdAt || 0));
                    const keep = records.find(r => !r.deleted) || records[0];

                    for (const duplicate of records) {
                        if (duplicate.id === keep.id || duplicate.deleted) continue;
                        duplicate.deleted = true;
                        duplicate.deletedAt = Date.now();
                        await putRecord(duplicate);
                    }
                }
            } catch (err) {
                console.warn('Duplicate cleanup skipped:', err);
            }
        }

        // IMPORTANT: never read the whole PDF just to identify it.
        // Reading a 700+ MB file with file.arrayBuffer() can exhaust tablet RAM
        // before the PDF is even stored. We use a deterministic lightweight
        // content signature made from metadata + the beginning/end of the file.
        async function pdfFingerprint(file) {
            const SAMPLE = 2 * 1024 * 1024;
            const headEnd = Math.min(SAMPLE, file.size);
            const tailStart = Math.max(0, file.size - SAMPLE);
            const [head, tail] = await Promise.all([
                file.slice(0, headEnd).arrayBuffer(),
                file.slice(tailStart, file.size).arrayBuffer()
            ]);

            const meta = new TextEncoder().encode(
                `PDFv3|${file.size}|${file.lastModified || 0}|${file.type || ''}|`
            );
            const combined = new Uint8Array(meta.byteLength + head.byteLength + tail.byteLength);
            combined.set(meta, 0);
            combined.set(new Uint8Array(head), meta.byteLength);
            combined.set(new Uint8Array(tail), meta.byteLength + head.byteLength);

            const hash = await crypto.subtle.digest('SHA-256', combined);
            return Array.from(new Uint8Array(hash))
                .map(b => b.toString(16).padStart(2, '0')).join('');
        }

        async function ensureHandlePermission(handle, request=false) {
            if (!handle) return false;
            const opts={mode:'readwrite'};
            try {
                if ((await handle.queryPermission?.(opts)) === 'granted') return true;
                if (request && (await handle.requestPermission?.(opts)) === 'granted') return true;
            } catch(_) {}
            return false;
        }

        async function openPdfSmart() {
            // Android/iPad installed apps and WebViews can expose a partial or
            // unreliable File System Access API. The native <input type=file>
            // picker is more compatible there and still supports large files.
            const isTouchDevice =
                navigator.maxTouchPoints > 0 ||
                /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

            if (!isTouchDevice && window.showOpenFilePicker) {
                try {
                    const [handle] = await window.showOpenFilePicker({
                        multiple:false,
                        types:[{description:'PDF document',accept:{'application/pdf':['.pdf']}}]
                    });
                    if (!handle) return;
                    await ensureHandlePermission(handle, true);
                    const file = await handle.getFile();
                    await importPdfFile(file, handle);
                    return;
                } catch(err) {
                    if (err?.name === 'AbortError') return;
                    console.warn('Direct file picker unavailable, falling back:', err);
                }
            }

            const input = document.getElementById('pdfUploader');
            if (!input) return;
            input.value = '';
            input.click();
        }

        async function importPdfFile(file, fileHandle=null) {
            if (!file) return;
            if (file.type !== 'application/pdf' && !file.name.toLowerCase().endsWith('.pdf')) {
                alert('Please select a PDF file.'); return;
            }
            const fingerprint = await pdfFingerprint(file);
            const existingFiles = await idbRequest(
                db.transaction('files','readonly').objectStore('files').getAll()
            );

            // Only the ORIGINAL SOURCE signature can identify an imported file.
            // Do not compare it with latestWrittenFingerprint: that fingerprint
            // belongs to an exported/flattened copy and can make an unrelated
            // selected file attach to the wrong document state.
            const existing = existingFiles.find(
                f => !f.deleted && f.fingerprint === fingerprint
            ) || existingFiles.find(
                f => f.fingerprint === fingerprint
            );

            if (existing) {
                existing.deleted = false;
                existing.deletedAt = null;
                existing.lastReaddedAt = Date.now();
                if (fileHandle) existing.fileHandle = fileHandle;
                await putRecord(existing);
                await openPDF(existing.id);
                await loadHomeFiles();
                return;
            }
            const id='pdf_'+Date.now()+'_'+Math.random().toString(36).slice(2,8);
            const record={id,name:file.name,size:file.size,fingerprint,latestWrittenFingerprint:fingerprint,deleted:false,chunked:true,chunkSize:PDF_CHUNK_SIZE,createdAt:Date.now()};
            if(fileHandle) record.fileHandle=fileHandle;
            try {
                updateAutosaveIndicator('saving');
                await putRecord(record); await storePdfInChunks(id,file);
                await putSettings({fileId:id,pageOrder:[],bookmarks:{},bookmarkVersion:2,viewMode:'horizontal',globalPageStyle:'blank',pageViewState:{}});
                await openPDF(id); await savePortablePDF().catch(()=>{}); loadHomeFiles();
            } catch(err) {
                console.error('PDF upload failed:',err);
                try{await deleteAllChunks(id)}catch(_){};
                try{await idbRequest(db.transaction('files','readwrite').objectStore('files').delete(id))}catch(_){};
                alert('Could not save this PDF: '+(err?.message||err));
            } finally { updateAutosaveIndicator('saved'); }
        }

        });

        async function openPDF(id) {
            const token = ++openOperationToken;

            try {
                // Stop a previous document from remaining active while another
                // one is being opened.
                if (pdfDoc) {
                    try { await pdfDoc.destroy(); } catch (_) {}
                    pdfDoc = null;
                }
                if (currentPdfUrl) {
                    URL.revokeObjectURL(currentPdfUrl);
                    currentPdfUrl = null;
                }

                const record = await getRecord(id);
                if (!record || record.deleted) return;
                if (token !== openOperationToken) return;

                // Set identity only after the record was successfully found.
                currentFileId = id;
                currentFileHandle = record.fileHandle || null;
                originalFileWriteErrorShown = false;

                await loadDocumentState(record);
                if (token !== openOperationToken) return;

                await openPdfForRecord(record);
                if (token !== openOperationToken) {
                    try { await pdfDoc?.destroy(); } catch (_) {}
                    pdfDoc = null;
                    return;
                }

                if (!pageOrder.length) {
                    pageOrder = Array.from({ length: pdfDoc.numPages }, (_, i) => i + 1);
                }

                currentPage = Math.min(
                    Math.max(Number(savedPageViewState.currentPage) || 1, 1),
                    pageOrder.length
                );

                const pageState =
                    savedPageViewState[currentPage] ||
                    savedPageViewState[String(currentPage)] || {};

                zoomScale = Math.max(
                    0.5,
                    Math.min(6.0, Number(pageState.zoomScale ?? savedPageViewState.zoomScale ?? 1))
                );
                viewMode = savedPageViewState.viewMode || viewMode || 'horizontal';
                globalPageStyle = savedPageViewState.globalPageStyle || globalPageStyle || 'blank';

                if (token !== openOperationToken) return;

                document.getElementById('home-screen').style.display = 'none';
                document.getElementById('editor-screen').style.display = 'flex';

                await putSettings({
                    fileId: id,
                    pageOrder: [...pageOrder],
                    bookmarks: currentBookmarks,
                    bookmarkVersion: 2,
                    viewMode,
                    globalPageStyle,
                    pageViewState: savedPageViewState
                });

                if (token !== openOperationToken) return;

                initVirtualViewer();
                fullscreenWanted = true;
                fullscreenExplicitlyExited = false;
                requestAppFullscreen(true);
            } catch (err) {
                // Ignore cancellation caused by a newer open operation.
                if (token !== openOperationToken) return;
                console.error('Error loading PDF:', err);
                alert('Error loading PDF file: ' + (err?.message || err));
            }
        }

        function shiftAnnotations(actualPage, direction) {
            const shiftDict = (dict) => {
                const newDict = {};
                for (const key in dict) {
                    const k = parseInt(key);
                    if (direction === 'insert') {
                        if (k >= actualPage) newDict[k + 1] = dict[key];
                        else newDict[k] = dict[key];
                    } else if (direction === 'delete') {
                        if (k > actualPage) newDict[k - 1] = dict[key];
                        else if (k < actualPage) newDict[k] = dict[key];
                    }
                }
                return newDict;
            };

            currentDrawings = shiftDict(currentDrawings);
            currentTexts = shiftDict(currentTexts);
            currentImages = shiftDict(currentImages);
        }

        function shiftBookmarks(actualPage, direction) {
            const next = {};
            for (const key in currentBookmarks) {
                const k = Number(key);
                if (direction === 'insert') {
                    if (k >= actualPage) next[k + 1] = currentBookmarks[key];
                    else next[k] = currentBookmarks[key];
                } else if (direction === 'delete') {
                    if (k > actualPage) next[k - 1] = currentBookmarks[key];
                    else if (k < actualPage) next[k] = currentBookmarks[key];
                }
            }
            currentBookmarks = next;
        }

        async function addBlankPage() {
            try {
                if (!currentFileId || !pdfDoc) return;
                await Promise.all([savePageDataNow(currentPage), saveDocumentSettings()]);
                updateAutosaveIndicator('saving');

                const record = await getRecord(currentFileId);
                if (!record) throw new Error('Document not found in database.');

                const pdfBytes = await assemblePdfBytes(record);
                const pdfLibDoc = await PDFLib.PDFDocument.load(pdfBytes);
                const currPage = pdfLibDoc.getPages()[pageOrder[currentPage - 1] - 1] || pdfLibDoc.getPages()[0];
                const { width, height } = currPage.getSize();

                const insertIndex = pageOrder[currentPage - 1];
                pdfLibDoc.insertPage(insertIndex, [width, height]);
                const newPdfBytes = await pdfLibDoc.save({ useObjectStreams: true });

                const newActualPageNum = insertIndex + 1;
                shiftAnnotations(newActualPageNum, 'insert');
                for (let i = 0; i < pageOrder.length; i++) {
                    if (pageOrder[i] >= newActualPageNum) pageOrder[i]++;
                }
                pageOrder.splice(currentPage, 0, newActualPageNum);
                shiftBookmarks(newActualPageNum, 'insert');

                await deleteAllChunks(currentFileId).catch(() => {});
                await storePdfInChunks(currentFileId, new Blob([newPdfBytes], { type: 'application/pdf' }));
                record.size = newPdfBytes.byteLength;
                record.chunked = true;
                record.chunkSize = PDF_CHUNK_SIZE;
                delete record.data;
                await putRecord(record);
                await clearPortablePdf(currentFileId).catch(() => {});
                await replaceAllPageStates(currentFileId);

                await openPdfForRecord(record);
                currentPage = Math.min(currentPage + 1, pageOrder.length);
                initVirtualViewer();
                await goToPage(currentPage);
                await saveDocumentSettings();
                toggleEditMode(false);
                updateAutosaveIndicator('saved');
            } catch (error) {
                console.error(error);
                alert('Error adding page: ' + error.message);
                updateAutosaveIndicator('saved');
            }
        }

        async function confirmDeletePage(pageIndex) {
            if (pageOrder.length <= 1) {
                alert("Cannot delete the only remaining page.");

        async function deletePage(pageIndex) {
            try {
                if (pageOrder.length <= 1) return;
                await Promise.all([savePageDataNow(currentPage), saveDocumentSettings()]);
                updateAutosaveIndicator('saving');

                const record = await getRecord(currentFileId);
                if (!record) throw new Error('Document not found.');
                const actualToRemove = pageOrder[pageIndex - 1];
                const pdfBytes = await assemblePdfBytes(record);
                const pdfLibDoc = await PDFLib.PDFDocument.load(pdfBytes);
                pdfLibDoc.removePage(actualToRemove - 1);
                const newPdfBytes = await pdfLibDoc.save({ useObjectStreams: true });

                pageOrder.splice(pageIndex - 1, 1);
                for (let i = 0; i < pageOrder.length; i++) {
                    if (pageOrder[i] > actualToRemove) pageOrder[i]--;
                }
                shiftAnnotations(actualToRemove, 'delete');
                shiftBookmarks(actualToRemove, 'delete');

                await deleteAllChunks(currentFileId).catch(() => {});
                await storePdfInChunks(currentFileId, new Blob([newPdfBytes], { type: 'application/pdf' }));
                record.size = newPdfBytes.byteLength;
                record.chunked = true;
                record.chunkSize = PDF_CHUNK_SIZE;
                delete record.data;
                await putRecord(record);
                await clearPortablePdf(currentFileId).catch(() => {});

                if (currentPage > pageOrder.length) currentPage = pageOrder.length;
                await replaceAllPageStates(currentFileId);
                await openPdfForRecord(record);
                initVirtualViewer();
                await goToPage(currentPage);
                await saveDocumentSettings();
                updateAutosaveIndicator('saved');
            } catch (error) {
                console.error(error);
                alert('Error deleting page: ' + error.message);
                updateAutosaveIndicator('saved');
            }
        }
