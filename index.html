<script>
        function autoEnableFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
            }
        }
        document.addEventListener('click', autoEnableFullScreen, { once: true });
        document.addEventListener('touchstart', autoEnableFullScreen, { once: true });

        // تحديث الوقت بتنسيق 12 ساعة مع الثواني والبطارية
        function updateSystemStatus() {
            const timeSpan = document.getElementById('time-display');
            const batterySpan = document.getElementById('battery-display');
            
            const now = new Date();
            if (timeSpan) {
                timeSpan.innerText = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true });
            }

            if (navigator.getBattery) {
                navigator.getBattery().then(battery => {
                    const level = Math.round(battery.level * 100);
                    if (batterySpan) batterySpan.innerText = (battery.charging ? "⚡ " : "🔋 ") + level + "%";
                });
            } else if (batterySpan) {
                batterySpan.innerText = "🔋 100%";
            }
        }
        setInterval(updateSystemStatus, 1000);
        updateSystemStatus();

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW registration failed:', err));
            });
        }

        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        let db;
        const request = indexedDB.open("AppleGlassPDFDB", 2);
        request.onupgradeneeded = e => {
            db = e.target.result;
            if (!db.objectStoreNames.contains("files")) {
                db.createObjectStore("files", { keyPath: "id" });
            }
        };
        request.onsuccess = e => { 
            db = e.target.result; 
            loadHomeFiles(); 
            initColorPicker();
        };

        let currentFileId = null, pdfDoc = null, currentPage = 1;
        let pageOrder = []; 
        let renderQualityScale = 1.5; 
        let baseScale = 1.2, zoomScale = 1.0; 
        let currentDrawings = {}, currentTexts = {}, currentImages = {}, currentBookmarks = {}; 
        let viewMode = 'horizontal';
        let globalPageStyle = 'blank';

        let historyStack = [];
        let recentColorsList = ['#000000', '#333333', '#666666', '#999999', '#cccccc'];
        let activeColor = '#000000';
        let activeTextNode = null;

        let isDrawing = false;
        let currentTool = null; 
        let toolSizes = { pen: 4, eraser: 30, text: 18 };

        let lastDeletedItem = null;
        let toastTimeout = null;
        let isEditMode = false;
        let longPressTimer = null;

        let pageObserver = null;
        let renderedPages = new Set();
        let saveTimeout;

        document.addEventListener('pointerdown', (e) => {
            if (isEditMode && !e.target.closest('#bottom-thumbnails-bar')) {
                toggleEditMode(false);
            }
        });

        function toggleSidebar(open) {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebar-overlay');
            if (open) {
                renderSidebarBookmarks();
                sidebar.classList.add('open');
                overlay.classList.add('show');
            } else {
                sidebar.classList.remove('open');
                overlay.classList.remove('show');
            }
        }

        function toggleCurrentPageBookmark() {
            if (!currentFileId) return;
            if (!currentBookmarks[currentPage]) {
                currentBookmarks[currentPage] = `Page ${currentPage} Bookmark`;
            } else {
                delete currentBookmarks[currentPage];
            }
            updatePageBookmarkUI(currentPage);
            savePageDataNow(currentPage);
            renderSidebarBookmarks();
        }

        function updatePageBookmarkUI(displayIndex) {
            const wrapper = document.querySelector(`.page-wrapper[data-page-num="${displayIndex}"]`);
            const btn = document.getElementById('bookmarkToggleBtn');
            if (!wrapper) return;

            if (currentBookmarks[displayIndex]) {
                wrapper.classList.add('bookmarked');
                if (displayIndex === currentPage && btn) btn.classList.add('active');
            } else {
                wrapper.classList.remove('bookmarked');
                if (displayIndex === currentPage && btn) btn.classList.remove('active');
            }
        }

        function renderSidebarBookmarks() {
            const listContainer = document.getElementById('sidebarBookmarksList');
            if (!listContainer) return;
            listContainer.innerHTML = '';

            const pagesWithBookmarks = Object.keys(currentBookmarks).map(Number).sort((a,b) => a - b);
            
            if (pagesWithBookmarks.length === 0) {
                listContainer.innerHTML = `<div style="text-align: center; color: #8e8e93; font-size: 13px; margin-top: 30px;">No bookmarks yet.<br>Click the bookmark icon on any page to add one.</div>`;
                return;
            }

            pagesWithBookmarks.forEach(pNum => {
                const title = currentBookmarks[pNum];
                const item = document.createElement('div');
                item.className = 'bookmark-item';

                const info = document.createElement('div');
                info.className = 'bookmark-info';

                const titleEl = document.createElement('div');
                titleEl.className = 'bookmark-title';
                titleEl.contentEditable = true;
                titleEl.innerText = title;
                titleEl.onblur = () => {
                    currentBookmarks[pNum] = titleEl.innerText || `Page ${pNum}`;
                    savePageDataNow(currentPage);
                };

                const pageEl = document.createElement('div');
                pageEl.className = 'bookmark-page';
                pageEl.innerText = `Page ${pNum}`;

                info.appendChild(titleEl);
                info.appendChild(pageEl);

                const actions = document.createElement('div');
                actions.className = 'bookmark-actions';

                const delBtn = document.createElement('button');
                delBtn.className = 'bookmark-delete';
                delBtn.innerHTML = '✕';
                delBtn.onclick = (e) => {
                    e.stopPropagation();
                    delete currentBookmarks[pNum];
                    updatePageBookmarkUI(pNum);
                    savePageDataNow(currentPage);
                    renderSidebarBookmarks();
                };

                actions.appendChild(delBtn);

                item.appendChild(info);
                item.appendChild(actions);

                item.onclick = (e) => {
                    if (e.target === titleEl || e.target.closest('.bookmark-title')) return;
                    goToPage(pNum);
                    toggleSidebar(false);
                };

                listContainer.appendChild(item);
            });
        }

        function toggleBackgroundPanel() {
            const panel = document.getElementById('background-panel');
            if (!panel) return;
            if (panel.style.display === 'flex') {
                panel.style.display = 'none';
                document.getElementById('bgToggleBtn')?.classList.remove('active');
            } else {
                panel.style.display = 'flex';
                document.getElementById('bgToggleBtn')?.classList.add('active');
                if (typeof hideSizeSlider === 'function') hideSizeSlider();
                currentTool = null; 
                if (typeof updateToolButtonsUI === 'function') updateToolButtonsUI();
                if (typeof updateCanvasPointerEvents === 'function') updateCanvasPointerEvents();
            }
        }

        function setGlobalPageStyle(style) {
            globalPageStyle = style;
            document.querySelectorAll('.page-wrapper').forEach(page => {
                page.classList.remove('blank', 'lined', 'grid');
                page.classList.add(style);
            });
        }

        function showUndoToast(message, restoreCallback) {
            const toast = document.getElementById('toast-container');
            if (!toast) return;
            document.getElementById('toast-message').innerText = message;
            lastDeletedItem = restoreCallback;
            toast.classList.add('show');

            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove('show');
                lastDeletedItem = null;
            }, 4000);
        }

        function executeUndoDelete() {
            if (lastDeletedItem) {
                lastDeletedItem();
                lastDeletedItem = null;
            }
            document.getElementById('toast-container')?.classList.remove('show');
        }

        function updateAutosaveIndicator(status) {
            const indicator = document.getElementById('autosave-indicator');
            if (!indicator) return;
            if (status === 'saving') {
                indicator.style.color = '#ff9500';
                indicator.innerText = '● Saving...';
            } else {
                indicator.style.color = '#34c759';
                indicator.innerText = '● Saved';
            }
        }

        function initColorPicker() {
            const picker = document.getElementById('colorPicker');
            if (picker) {
                picker.addEventListener('change', (e) => selectColor(e.target.value));
            }
            renderRecentColors();
        }

        function selectColor(hex) {
            activeColor = hex;
            const picker = document.getElementById('colorPicker');
            if (picker) picker.value = hex;
            recentColorsList = recentColorsList.filter(c => c.toLowerCase() !== hex.toLowerCase());
            recentColorsList.unshift(hex);
            if (recentColorsList.length > 5) recentColorsList.pop();
            renderRecentColors();

            if (activeTextNode) {
                activeTextNode.style.color = hex;
                if (typeof savePageData === 'function') savePageData(currentPage);
            }
        }

        function renderRecentColors() {
            const container = document.getElementById('recentColors');
            if (!container) return;
            container.innerHTML = '';
            recentColorsList.forEach(color => {
                const swatch = document.createElement('div');
                swatch.className = 'recent-color-swatch';
                swatch.style.backgroundColor = color;
                swatch.onclick = () => selectColor(color);
                container.appendChild(swatch);
            });
        }

        function loadHomeFiles() {
            const grid = document.getElementById('notesGrid');
            if (!grid) return;
            grid.innerHTML = '';
            const tx = db.transaction("files", "readonly");
            tx.objectStore("files").getAll().onsuccess = e => {
                e.target.result.forEach(f => {
                    const card = document.createElement('div');
                    card.className = 'note-card apple-glass';
                    card.innerHTML = `<button class="delete-btn" onclick="removeFile('${f.id}', event)">✕</button>
                                      <div class="pdf-icon">📄</div>
                                      <div class="note-title">${f.name}</div>`;
                    card.onclick = () => openPDF(f.id);
                    grid.appendChild(card);
                });
            };
        }

        function removeFile(id, e) {
            e.stopPropagation();
            if(!confirm("Are you sure you want to delete this document?")) return;
            const tx = db.transaction("files", "readwrite");
            tx.objectStore("files").delete(id).onsuccess = () => loadHomeFiles();
        }

        async function goHome() {
            if (currentFileId && typeof savePageDataNow === 'function') await savePageDataNow(currentPage);
            if (typeof toggleEditMode === 'function') toggleEditMode(false);
            document.getElementById('editor-screen').style.display = 'none';
            document.getElementById('home-screen').style.display = 'flex';
            loadHomeFiles();
        }

        document.getElementById('pdfUploader')?.addEventListener('change', e => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = ev => {
                const id = 'pdf_' + Date.now();
                const arrayBuffer = ev.target.result;
                const uint8Array = new Uint8Array(arrayBuffer);
                
                const record = { id: id, name: file.name, data: uint8Array, drawings: {}, texts: {}, images: {}, bookmarks: {}, pageOrder: [] };
                const tx = db.transaction("files", "readwrite");
                tx.objectStore("files").add(record).onsuccess = () => { 
                    loadHomeFiles(); 
                    openPDF(id); 
                };
            };
            reader.readAsArrayBuffer(file);
        });

        function openPDF(id) {
            currentFileId = id;
            const tx = db.transaction("files", "readonly");
            tx.objectStore("files").get(id).onsuccess = e => {
                const record = e.target.result;
                if (!record) return;

                currentDrawings = record.drawings || {};
                currentTexts = record.texts || {};
                currentImages = record.images || {};
                currentBookmarks = record.bookmarks || {};
                currentPage = 1;
                zoomScale = 1.0;

                document.getElementById('home-screen').style.display = 'none';
                document.getElementById('editor-screen').style.display = 'flex';

                const pdfData = record.data instanceof Uint8Array ? record.data : new Uint8Array(record.data);

                pdfjsLib.getDocument({ data: pdfData }).promise.then(pdf => {
                    pdfDoc = pdf;
                    if (record.pageOrder && record.pageOrder.length === pdfDoc.numPages) {
                        pageOrder = record.pageOrder;
                    } else {
                        pageOrder = Array.from({length: pdfDoc.numPages}, (_, i) => i + 1);
                    }
                    initVirtualViewer();
                }).catch(err => {
                    alert('Error loading PDF file: ' + err.message);
                });
            };
        }

        function shiftAnnotations(actualPage, direction) {
            const shiftDict = (dict) => {
                const newDict = {};
                for (const key in dict) {
                    const k = parseInt(key);
                    if (direction === 'insert') {
                        if (k >= actualPage) newDict[k + 1] = dict[key];
                        else newDict[k] = dict[key];
                    } else if (direction === 'delete') {
                        if (k > actualPage) newDict[k - 1] = dict[key];
                        else if (k < actualPage) newDict[k] = dict[key];
                    }
                }
                return newDict;
            };

            currentDrawings = shiftDict(currentDrawings);
            currentTexts = shiftDict(currentTexts);
            currentImages = shiftDict(currentImages);
        }

        async function addBlankPage() {
            try {
                if (!currentFileId || !pdfDoc) return;
                
                if (typeof savePageDataNow === 'function') await savePageDataNow(currentPage);
                updateAutosaveIndicator('saving');
                
                const record = await new Promise((resolve, reject) => {
                    const tx = db.transaction("files", "readonly");
                    const req = tx.objectStore("files").get(currentFileId);
                    req.onsuccess = e => resolve(e.target.result);
                    req.onerror = err => reject(err);
                });
                
                if (!record) throw new Error("Document not found in database.");

                const pdfLibDoc = await PDFLib.PDFDocument.load(record.data);
                const pages = pdfLibDoc.getPages();
                const currPage = pages[pageOrder[currentPage - 1] - 1] || pages[0];
                const { width, height } = currPage.getSize();
                
                const insertIndex = pageOrder[currentPage - 1];
                pdfLibDoc.insertPage(insertIndex, [width, height]);
                const newPdfBytes = await pdfLibDoc.save();
                
                const newActualPageNum = insertIndex + 1;
                shiftAnnotations(newActualPageNum, 'insert');

                for (let i = 0; i < pageOrder.length; i++) {
                    if (pageOrder[i] >= newActualPageNum) pageOrder[i]++;
                }
                pageOrder.splice(currentPage, 0, newActualPageNum);

                record.data = newPdfBytes;
                record.pageOrder = pageOrder;
                record.drawings = currentDrawings;
                record.texts = currentTexts;
                record.images = currentImages;
                record.bookmarks = currentBookmarks;
                
                await new Promise((resolve, reject) => {
                    const tx2 = db.transaction("files", "readwrite");
                    const req2 = tx2.objectStore("files").put(record);
                    req2.onsuccess = () => resolve();
                    req2.onerror = err => reject(err);
                });
                
                const targetPage = currentPage + 1;

                if (pdfDoc) {
                    try { await pdfDoc.destroy(); } catch(e){}
                }

                pdfDoc = await pdfjsLib.getDocument({ data: new Uint8Array(newPdfBytes) }).promise;
                await initVirtualViewer();
                if (typeof goToPage === 'function') goToPage(targetPage); 
                updateAutosaveIndicator('saved');

            } catch (error) {
                console.error(error);
                alert("Error adding page: " + error.message);
                updateAutosaveIndicator('saved');
            }
        }

        async function confirmDeletePage(pageIndex) {
            if (pageOrder.length <= 1) {
                alert("Cannot delete the only remaining page.");
                return;
            }
            if (confirm(`Are you sure you want to delete page ${pageIndex}?`)) {
                await deletePage(pageIndex);
            }
        }

        async function deletePage(pageIndex) {
            try {
                if (typeof savePageDataNow === 'function') await savePageDataNow(currentPage);
                updateAutosaveIndicator('saving');

                const record = await new Promise((resolve, reject) => {
                    const tx = db.transaction("files", "readonly");
                    const req = tx.objectStore("files").get(currentFileId);
                    req.onsuccess = e => resolve(e.target.result);
                    req.onerror = err => reject(err);
                });
                if (!record) throw new Error("Document not found.");

                const actualToRemove = pageOrder[pageIndex - 1];
                const pdfLibDoc = await PDFLib.PDFDocument.load(record.data);
                
                pdfLibDoc.removePage(actualToRemove - 1);
                const newPdfBytes = await pdfLibDoc.save();

                pageOrder.splice(pageIndex - 1, 1);
                for (let i = 0; i < pageOrder.length; i++) {
                    if (pageOrder[i] > actualToRemove) pageOrder[i]--;
                }

                shiftAnnotations(actualToRemove, 'delete');

                record.data = newPdfBytes;
                record.pageOrder = pageOrder;
                record.drawings = currentDrawings;
                record.texts = currentTexts;
                record.images = currentImages;
                record.bookmarks = currentBookmarks;

                await new Promise((resolve, reject) => {
                    const tx2 = db.transaction("files", "readwrite");
                    const req2 = tx2.objectStore("files").put(record);
                    req2.onsuccess = () => resolve();
                    req2.onerror = err => reject(err);
                });

                if (currentPage > pageOrder.length) currentPage = pageOrder.length;

                if (pdfDoc) {
                    try { await pdfDoc.destroy(); } catch(e){}
                }

                pdfDoc = await pdfjsLib.getDocument({ data: new Uint8Array(newPdfBytes) }).promise;
                await initVirtualViewer();
                updateAutosaveIndicator('saved');

            } catch (error) {
                console.error(error);
                alert("Error deleting page: " + error.message);
                updateAutosaveIndicator('saved');
            }
        }

        function toggleViewMode() {
            viewMode = (viewMode === 'horizontal') ? 'vertical' : 'horizontal';
            applyViewModeUI();
        }

        function applyViewModeUI() {
            const container = document.getElementById('viewer-container');
            const toggleBtn = document.getElementById('viewModeToggleBtn');
            if (!container || !toggleBtn) return;

            if (viewMode === 'vertical') {
                container.className = 'vertical';
                toggleBtn.innerHTML = `<svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M11 6.99L7 3l-4 3.99h3V14h2V6.99h3zm8 10.02L15 21l3.99-4v-3h-2v3.01h-3z"/></svg> Vertical`;
            } else {
                container.className = 'horizontal';
                toggleBtn.innerHTML = `<svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M6.99 11L3 15l3.99 4v-3H14v-2H6.99v-3zM21 9l-3.99-4v3H10v2h7.01v3L21 9z"/></svg> Horizontal`;
                if (typeof updatePageDisplay === 'function') updatePageDisplay();
            }
            if (typeof applyZoomTransform === 'function') applyZoomTransform();
        }

        function initVirtualViewer() {
            const container = document.getElementById('viewer-container');
            const thumbsContainer = document.getElementById('thumbnailsContainer');
            if (!container || !thumbsContainer) return;
            container.innerHTML = '';
            thumbsContainer.innerHTML = '';
            renderedPages.clear();

            if (pageObserver) pageObserver.disconnect();

            pageObserver = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    const pageWrapper = entry.target;
                    const displayIndex = parseInt(pageWrapper.dataset.pageNum);
                    const actualPageNum = parseInt(pageWrapper.dataset.actualPage);

                    if (entry.isIntersecting) {
                        if (!renderedPages.has(displayIndex)) {
                            renderPageContent(pageWrapper, actualPageNum, displayIndex);
                            renderedPages.add(displayIndex);
                        }
                    } else {
                        if (renderedPages.has(displayIndex)) {
                            const canvases = pageWrapper.querySelectorAll('canvas');
                            canvases.forEach(c => {
                                const ctx = c.getContext('2d');
                                if (ctx) ctx.clearRect(0, 0, c.width, c.height);
                            });
                            pageWrapper.dataset.rendered = "false";
                            renderedPages.delete(displayIndex);
                        }
                    }
                });
            }, { root: container, rootMargin: '500px 500px' }); // زيادة مساحة التتبع لضمان سلاسة السحب في كل الاتجاهات

            for (let index = 0; index < pageOrder.length; index++) {
                const actualPageNum = pageOrder[index];
                const displayIndex = index + 1;

                const pageWrapper = document.createElement('div');
                pageWrapper.className = `page-wrapper ${globalPageStyle} ${displayIndex === currentPage ? 'active' : ''}`;
                pageWrapper.dataset.pageNum = displayIndex;
                pageWrapper.dataset.actualPage = actualPageNum;

                // إضافة البوكمارك الحمراء على الصفحة من فوق وتحتها ظل
                const bookmarkBadge = document.createElement('div');
                bookmarkBadge.className = 'page-bookmark-badge';
                bookmarkBadge.innerHTML = '🔖';
                bookmarkBadge.onclick = () => {
                    if (typeof goToPage === 'function') goToPage(displayIndex);
                    toggleSidebar(true);
                };
                pageWrapper.appendChild(bookmarkBadge);

                container.appendChild(pageWrapper);
                pageObserver.observe(pageWrapper);

                if (typeof renderThumbnailSkeleton === 'function') renderThumbnailSkeleton(displayIndex, actualPageNum);
                updatePageBookmarkUI(displayIndex);
            }

            applyViewModeUI();
            if (typeof reorderDOMPages === 'function') reorderDOMPages();
            if (typeof goToPage === 'function') goToPage(currentPage);
        }

        async function renderPageContent(pageWrapper, actualPageNum, displayIndex) {
            if (pageWrapper.dataset.rendered === "true") return;
            pageWrapper.dataset.rendered = "true";

            const page = await pdfDoc.getPage(actualPageNum);
            const viewport = page.getViewport({ scale: baseScale });
            const hdViewport = page.getViewport({ scale: baseScale * renderQualityScale });

            pageWrapper.dataset.baseWidth = viewport.width;
            pageWrapper.dataset.baseHeight = viewport.height;
            pageWrapper.style.width = (viewport.width * zoomScale) + 'px';
            pageWrapper.style.height = (viewport.height * zoomScale) + 'px';

            let pdfCanvas = pageWrapper.querySelector('canvas.pdf-render');
            if (!pdfCanvas) {
                pdfCanvas = document.createElement('canvas');
                pdfCanvas.className = 'pdf-render';
                pageWrapper.appendChild(pdfCanvas);
            }
            pdfCanvas.width = hdViewport.width;
            pdfCanvas.height = hdViewport.height;

            let textLayerDiv = pageWrapper.querySelector('.textLayer');
            if (!textLayerDiv) {
                textLayerDiv = document.createElement('div');
                textLayerDiv.className = 'textLayer';
                pageWrapper.appendChild(textLayerDiv);
            } else {
                textLayerDiv.innerHTML = '';
            }

            let drawCanvas = pageWrapper.querySelector('canvas.draw-canvas');
            if (!drawCanvas) {
                drawCanvas = document.createElement('canvas');
                drawCanvas.className = 'draw-canvas';
                pageWrapper.appendChild(drawCanvas);
            }
            drawCanvas.width = hdViewport.width;
            drawCanvas.height = hdViewport.height;

            page.render({ 
                canvasContext: pdfCanvas.getContext('2d'), 
                viewport: hdViewport 
            }).promise.then(async () => {
                const textContent = await page.getTextContent();
                pdfjsLib.renderTextLayer({
                    textContent: textContent,
                    container: textLayerDiv,
                    viewport: viewport,
                    textDivs: []
                });
            });

            if (typeof restorePageDrawings === 'function') restorePageDrawings(actualPageNum, drawCanvas);
            if (typeof restorePageTexts === 'function') restorePageTexts(actualPageNum, pageWrapper);
            if (typeof restorePageImages === 'function') restorePageImages(actualPageNum, pageWrapper);
            if (typeof initDrawingEvents === 'function') initDrawingEvents(drawCanvas, displayIndex, actualPageNum);
            if (typeof updateCanvasPointerEvents === 'function') updateCanvasPointerEvents();
        }

function renderThumbnailSkeleton(displayIndex, actualPageNum) {
            const thumbsContainer = document.getElementById('thumbnailsContainer');
            if (!thumbsContainer) return;

            const thumbItem = document.createElement('div');
            thumbItem.className = `thumb-item ${displayIndex === currentPage ? 'active' : ''}`;
            thumbItem.dataset.pageNum = displayIndex;
            thumbItem.dataset.actualPage = actualPageNum;
            thumbItem.draggable = true;

            const deleteBadge = document.createElement('div');
            deleteBadge.className = 'thumb-delete-badge';
            deleteBadge.innerText = '✕';
            deleteBadge.onclick = (e) => {
                e.stopPropagation();
                const pIndex = parseInt(thumbItem.dataset.pageNum);
                if (typeof confirmDeletePage === 'function') confirmDeletePage(pIndex);
            };

            const pageNumBadge = document.createElement('div');
            pageNumBadge.className = 'thumb-page-num';
            pageNumBadge.textContent = displayIndex;

            thumbItem.appendChild(deleteBadge);
            thumbItem.appendChild(pageNumBadge);
            thumbsContainer.appendChild(thumbItem);

            setupDragAndDrop(thumbItem);

            thumbItem.addEventListener('pointerdown', (e) => {
                if (e.target.classList.contains('thumb-delete-badge')) return;
                longPressTimer = setTimeout(() => {
                    toggleEditMode(true);
                }, 500);
            });

            thumbItem.addEventListener('pointerup', () => clearTimeout(longPressTimer));
            thumbItem.addEventListener('pointermove', () => clearTimeout(longPressTimer));

            thumbItem.onclick = () => {
                if (!isEditMode) {
                    const pIndex = parseInt(thumbItem.dataset.pageNum);
                    goToPage(pIndex);
                }
            };

            const thumbObserver = new IntersectionObserver((entries, obs) => {
                entries.forEach(async entry => {
                    if (entry.isIntersecting) {
                        obs.disconnect();
                        if (!pdfDoc) return;
                        const page = await pdfDoc.getPage(actualPageNum);
                        const thumbCanvas = document.createElement('canvas');
                        const thumbViewport = page.getViewport({ scale: 0.12 });
                        thumbCanvas.width = thumbViewport.width;
                        thumbCanvas.height = thumbViewport.height;
                        thumbItem.insertBefore(thumbCanvas, pageNumBadge);
                        page.render({ canvasContext: thumbCanvas.getContext('2d'), viewport: thumbViewport });
                    }
                });
            }, { root: thumbsContainer, rootMargin: '100px' });
            
            thumbObserver.observe(thumbItem);
        }

        function toggleEditMode(enable) {
            isEditMode = enable;
            const container = document.getElementById('thumbnailsContainer');
            if (!container) return;
            if (enable) {
                container.classList.add('edit-mode');
            } else {
                container.classList.remove('edit-mode');
            }
        }

        function updateThumbnailsAndPagesIndexes() {
            const thumbs = document.querySelectorAll('.thumb-item');
            const newOrder = [];
            
            thumbs.forEach((thumb, idx) => {
                const newDisplayIndex = idx + 1;
                const actualPage = parseInt(thumb.dataset.actualPage);
                
                thumb.dataset.pageNum = newDisplayIndex;
                const badge = thumb.querySelector('.thumb-page-num');
                if (badge) badge.textContent = newDisplayIndex;

                if (newDisplayIndex === currentPage) {
                    thumb.classList.add('active');
                } else {
                    thumb.classList.remove('active');
                }

                newOrder.push(actualPage);
            });

            pageOrder = newOrder;

            const container = document.getElementById('viewer-container');
            if (container) {
                pageOrder.forEach((actualPage, idx) => {
                    const newDisplayIndex = idx + 1;
                    const wrapper = container.querySelector(`.page-wrapper[data-actual-page="${actualPage}"]`);
                    if (wrapper) {
                        wrapper.dataset.pageNum = newDisplayIndex;
                        if (typeof updatePageBookmarkUI === 'function') updatePageBookmarkUI(newDisplayIndex);
                    }
                });
            }

            reorderDOMPages();
            savePageOrder();
            updatePageDisplay();
        }

        function reorderDOMPages() {
            const container = document.getElementById('viewer-container');
            if (!container) return;
            pageOrder.forEach(actualPage => {
                const wrapper = container.querySelector(`.page-wrapper[data-actual-page="${actualPage}"]`);
                if (wrapper) {
                    container.appendChild(wrapper);
                }
            });
        }

        function setupDragAndDrop(thumb) {
            thumb.addEventListener('dragstart', (e) => {
                thumb.classList.add('dragging');
                e.dataTransfer.setData('text/plain', thumb.dataset.actualPage);
            });

            thumb.addEventListener('dragend', () => {
                thumb.classList.remove('dragging');
                updateThumbnailsAndPagesIndexes();
            });

            thumb.addEventListener('dragover', (e) => {
                e.preventDefault();
                const container = document.getElementById('thumbnailsContainer');
                if (!container) return;
                const dragging = container.querySelector('.dragging');
                if (!dragging) return;
                const siblings = [...container.querySelectorAll('.thumb-item:not(.dragging)')];
                const nextSibling = siblings.find(sibling => {
                    return e.clientX <= sibling.getBoundingClientRect().left + sibling.getBoundingClientRect().width / 2;
                });
                if (nextSibling) {
                    container.insertBefore(dragging, nextSibling);
                } else {
                    container.appendChild(dragging);
                }
            });

            thumb.addEventListener('drop', (e) => {
                e.preventDefault();
            });
        }

        async function savePageOrder() {
            if (typeof updateAutosaveIndicator === 'function') updateAutosaveIndicator('saving');
            return new Promise((resolve) => {
                if (!db || !currentFileId) return resolve();
                const tx = db.transaction("files", "readwrite");
                const store = tx.objectStore("files");
                store.get(currentFileId).onsuccess = e => {
                    const data = e.target.result;
                    if (data) {
                        data.pageOrder = [...pageOrder];
                        store.put(data).onsuccess = () => {
                            if (typeof updateAutosaveIndicator === 'function') updateAutosaveIndicator('saved');
                            resolve();
                        };
                    } else {
                        resolve();
                    }
                };
            });
        }

        function goToPage(pageNum) {
            if (!pdfDoc || pageNum < 1 || pageNum > pageOrder.length) return;
            if (typeof savePageData === 'function') savePageData(currentPage);
            currentPage = pageNum;
            
            const targetWrapper = document.querySelector(`.page-wrapper[data-page-num="${pageNum}"]`);
            if (targetWrapper) {
                if (viewMode === 'vertical') {
                    targetWrapper.scrollIntoView({ behavior: 'smooth', block: 'start' });
                } else {
                    updatePageDisplay();
                }
            }
            
            const bookmarkBtn = document.getElementById('bookmarkToggleBtn');
            if (bookmarkBtn) {
                if (currentBookmarks[currentPage]) bookmarkBtn.classList.add('active');
                else bookmarkBtn.classList.remove('active');
            }

            const thumbs = document.querySelectorAll('.thumb-item');
            thumbs.forEach((thumb) => {
                const pNum = parseInt(thumb.dataset.pageNum);
                if (pNum === currentPage) {
                    thumb.classList.add('active');
                    thumb.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
                } else {
                    thumb.classList.remove('active');
                }
            });
        }

        function changePage(dir) {
            goToPage(currentPage + dir);
        }

        function updatePageDisplay() {
            if (viewMode !== 'horizontal') return;

            const wrappers = document.querySelectorAll('.page-wrapper');
            wrappers.forEach((wrapper) => {
                const pNum = parseInt(wrapper.dataset.pageNum);
                if (pNum === currentPage) {
                    wrapper.classList.add('active');
                } else {
                    wrapper.classList.remove('active');
                }
            });
        }

        /* الزوم والتحريك الحر للوصول لكل ركن ومكان في الصفحة بكامل الحرية */
        let initialDistance = null;
        let pinchCenter = { x: 0, y: 0 };
        const viewer = document.getElementById('viewer-container');
        const editorScreen = document.getElementById('editor-screen');

        const startTouch = () => { if (currentTool && editorScreen) editorScreen.classList.add('is-touching'); };
        const endTouch = () => { if (editorScreen) editorScreen.classList.remove('is-touching'); };

        if (viewer) {
            viewer.addEventListener('pointerdown', startTouch);
            viewer.addEventListener('pointerup', endTouch);
            viewer.addEventListener('pointercancel', endTouch);

            viewer.addEventListener('touchstart', e => {
                if (e.touches.length === 2) {
                    initialDistance = Math.hypot(
                        e.touches[0].clientX - e.touches[1].clientX,
                        e.touches[0].clientY - e.touches[1].clientY
                    );

                    const rect = viewer.getBoundingClientRect();
                    pinchCenter = {
                        x: (e.touches[0].clientX + e.touches[1].clientX) / 2 - rect.left + viewer.scrollLeft,
                        y: (e.touches[0].clientY + e.touches[1].clientY) / 2 - rect.top + viewer.scrollTop
                    };
                }
            }, { passive: true });

            viewer.addEventListener('touchmove', e => {
                if (e.touches.length === 2 && initialDistance) {
                    e.preventDefault();

                    const currentDistance = Math.hypot(
                        e.touches[0].clientX - e.touches[1].clientX,
                        e.touches[0].clientY - e.touches[1].clientY
                    );
                    
                    const factor = currentDistance / initialDistance;
                    const prevScale = zoomScale;
                    const newScale = Math.max(0.6, Math.min(4.0, prevScale * factor));
                    
                    if (newScale !== prevScale) {
                        const scaleRatio = newScale / prevScale;
                        zoomScale = newScale;

                        requestAnimationFrame(() => {
                            applyZoomTransform();
                            viewer.scrollLeft = pinchCenter.x * scaleRatio - (pinchCenter.x - viewer.scrollLeft);
                            viewer.scrollTop = pinchCenter.y * scaleRatio - (pinchCenter.y - viewer.scrollTop);
                        });
                    }

                    initialDistance = currentDistance;
                }
            }, { passive: false });

            viewer.addEventListener('touchend', e => {
                if (e.touches.length < 2) initialDistance = null;
                if (e.touches.length === 0) endTouch();
            }, { passive: true });
        }

        /*
         * تغيير الحجم الحقيقي للصفحة بدل transform فقط.
         * هذا يجعل overflow يحسب العرض والارتفاع بعد الزوم فعلياً،
         * وبالتالي يمكن التحرك يمين/شمال وفوق/تحت بحرية.
         */
        /*
         * على الكمبيوتر:
         * Ctrl + Wheel أو Cmd + Wheel = Zoom حول مكان المؤشر.
         * Wheel العادي يظل Scroll طبيعي في كل الاتجاهات.
         */
        if (viewer) {
            viewer.addEventListener('wheel', e => {
                if (!(e.ctrlKey || e.metaKey) || !pdfDoc) return;

                e.preventDefault();

                const rect = viewer.getBoundingClientRect();
                const cursorX = e.clientX - rect.left + viewer.scrollLeft;
                const cursorY = e.clientY - rect.top + viewer.scrollTop;

                const oldScale = zoomScale;
                const factor = Math.exp(-e.deltaY * 0.0025);
                const newScale = Math.max(0.6, Math.min(4.0, oldScale * factor));

                if (newScale === oldScale) return;

                zoomScale = newScale;
                applyZoomTransform();

                const ratio = newScale / oldScale;

                requestAnimationFrame(() => {
                    viewer.scrollLeft = Math.max(
                        0,
                        cursorX * ratio - (e.clientX - rect.left)
                    );
                    viewer.scrollTop = Math.max(
                        0,
                        cursorY * ratio - (e.clientY - rect.top)
                    );
                });
            }, { passive: false });
        }

        function applyZoomTransform() {
            document.querySelectorAll('.page-wrapper').forEach(w => {
                const baseW = parseFloat(w.dataset.baseWidth) || 600;
                const baseH = parseFloat(w.dataset.baseHeight) || 800;

                w.style.width = (baseW * zoomScale) + 'px';
                w.style.height = (baseH * zoomScale) + 'px';
                w.style.flex = '0 0 auto';
            });
        }

        function toggleTool(toolName) {
            const bgPanel = document.getElementById('background-panel');
            if (bgPanel) bgPanel.style.display = 'none';
            document.getElementById('bgToggleBtn')?.classList.remove('active');

            if (currentTool === toolName) {
                currentTool = null;
                hideSizeSlider();
            } else {
                currentTool = toolName;
                showSizeSlider(toolName);
            }
            updateToolButtonsUI();
            updateCanvasPointerEvents();
        }

        function updateToolButtonsUI() {
            document.querySelectorAll('#toolbar button').forEach(b => {
                if (b.id !== 'viewModeToggleBtn' && b.id !== 'undoBtn' && b.id !== 'bgToggleBtn' && b.id !== 'bookmarkToggleBtn') b.classList.remove('active');
            });
            if (currentTool === 'pen') document.getElementById('penBtn')?.classList.add('active');
            if (currentTool === 'text') document.getElementById('textBtn')?.classList.add('active');
            if (currentTool === 'eraser') document.getElementById('eraserBtn')?.classList.add('active');
        }

        function updateCanvasPointerEvents() {
            document.querySelectorAll('canvas.draw-canvas').forEach(c => {
                c.style.pointerEvents = currentTool ? 'auto' : 'none';
            });
        }

        function showSizeSlider(toolName) {
            const panel = document.getElementById('size-slider-panel');
            const slider = document.getElementById('toolSizeSlider');
            const badge = document.getElementById('sizeValBadge');
            const label = document.getElementById('sizeSliderLabel');

            if (!panel || !slider) return;

            panel.style.display = 'flex';
            if (toolName === 'text') {
                if (label) label.innerText = 'Font Size:';
                slider.min = "10";
                slider.max = "80";
            } else {
                if (label) label.innerText = 'Size:';
                slider.min = "1";
                slider.max = "100";
            }

            const val = toolSizes[toolName] || (toolName === 'text' ? 18 : 5);
            slider.value = val;
            if (badge) badge.innerText = val;
        }

        function hideSizeSlider() {
            const panel = document.getElementById('size-slider-panel');
            if (panel) panel.style.display = 'none';
        }

        function updateToolSize(val) {
            const badge = document.getElementById('sizeValBadge');
            if (badge) badge.innerText = val;
            if (currentTool) {
                toolSizes[currentTool] = parseInt(val);
                if (currentTool === 'text' && activeTextNode) {
                    activeTextNode.style.fontSize = val + 'px';
                    if (typeof savePageData === 'function') savePageData(currentPage);
                }
            }
        }

        let strokePoints = [];
        const eraserCursor = document.getElementById('eraser-cursor');

        function initDrawingEvents(canvas, displayIndex, actualPageNum) {
            const ctx = canvas.getContext('2d');

            function getPos(e) {
                const rect = canvas.getBoundingClientRect();
                return {
                    x: (e.clientX - rect.left) * (canvas.width / rect.width),
                    y: (e.clientY - rect.top) * (canvas.height / rect.height)
                };
            }

            canvas.onpointerdown = e => {
                if (!currentTool) return;
                startTouch();

                if (currentTool === 'text') {
                    const rect = canvas.parentElement.getBoundingClientRect();
                    const fontSize = toolSizes['text'] || 18;
                    const baseW = parseFloat(canvas.parentElement.dataset.baseWidth) || 600;
                    const baseH = parseFloat(canvas.parentElement.dataset.baseHeight) || 800;
                    
                    const clickX = ((e.clientX - rect.left) / rect.width) * baseW;
                    const clickY = ((e.clientY - rect.top) / rect.height) * baseH;
                    
                    if (typeof createTextNode === 'function') {
                        createTextNode(clickX, clickY, "Type here...", activeColor, canvas.parentElement, displayIndex, fontSize);
                        if (typeof savePageData === 'function') savePageData(displayIndex);
                    }
                    return;
                }
                
                isDrawing = true;
                canvas.setPointerCapture(e.pointerId);

                historyStack.push({ pageNum: displayIndex, dataUrl: canvas.toDataURL() });
                if (historyStack.length > 20) historyStack.shift();

                const pos = getPos(e);
                strokePoints = [pos];

                const currentSize = toolSizes[currentTool] * (baseScale * renderQualityScale);

                if (currentTool === 'eraser') {
                    ctx.globalCompositeOperation = 'destination-out';
                    ctx.lineWidth = currentSize;
                    ctx.lineCap = 'round';
                    ctx.lineJoin = 'round';

                    if (eraserCursor) {
                        const displaySize = toolSizes['eraser'] * zoomScale;
                        eraserCursor.style.width = displaySize + 'px';
                        eraserCursor.style.height = displaySize + 'px';
                        eraserCursor.style.left = e.clientX + 'px';
                        eraserCursor.style.top = e.clientY + 'px';
                        eraserCursor.style.display = 'block';
                    }
                } else {
                    ctx.globalCompositeOperation = 'source-over';
                    ctx.strokeStyle = activeColor;
                    ctx.lineWidth = currentSize;
                    ctx.lineCap = 'round';
                    ctx.lineJoin = 'round';
                    
                    ctx.beginPath();
                    ctx.arc(pos.x, pos.y, currentSize / 2, 0, Math.PI * 2);
                    ctx.fillStyle = activeColor;
                    ctx.fill();
                }
            };

            canvas.onpointermove = e => {
                if (currentTool === 'eraser' && isDrawing && eraserCursor) {
                    eraserCursor.style.left = e.clientX + 'px';
                    eraserCursor.style.top = e.clientY + 'px';
                }

                if (!isDrawing || !currentTool) return;
                const pos = getPos(e);

                if (currentTool === 'pen') {
                    strokePoints.push(pos);
                    
                    if (strokePoints.length >= 3) {
                        const len = strokePoints.length;
                        const p0 = strokePoints[len - 3];
                        const p1 = strokePoints[len - 2];
                        const p2 = strokePoints[len - 1];

                        const mid1 = { x: (p0.x + p1.x) / 2, y: (p0.y + p1.y) / 2 };
                        const mid2 = { x: (p1.x + p2.x) / 2, y: (p1.y + p2.y) / 2 };

                        ctx.beginPath();
                        ctx.moveTo(mid1.x, mid1.y);
                        ctx.quadraticCurveTo(p1.x, p1.y, mid2.x, mid2.y);
                        ctx.stroke();
                    } else if (strokePoints.length === 2) {
                        ctx.beginPath();
                        ctx.moveTo(strokePoints[0].x, strokePoints[0].y);
                        ctx.lineTo(strokePoints[1].x, strokePoints[1].y);
                        ctx.stroke();
                    }
                } else if (currentTool === 'eraser') {
                    const lastPt = strokePoints[strokePoints.length - 1] || pos;
                    ctx.beginPath();
                    ctx.moveTo(lastPt.x, lastPt.y);
                    ctx.lineTo(pos.x, pos.y);
                    ctx.stroke();
                    strokePoints.push(pos);
                }
            };

            canvas.onpointerup = () => {
                endTouch();
                if (eraserCursor) eraserCursor.style.display = 'none';
                if (isDrawing) {
                    isDrawing = false;
                    strokePoints = [];
                    if (typeof savePageData === 'function') savePageData(displayIndex);
                }
            };

            canvas.onpointercancel = () => {
                endTouch();
                if (eraserCursor) eraserCursor.style.display = 'none';
                isDrawing = false;
                strokePoints = [];
            };
        }

        function undo() {
            if (historyStack.length > 0) {
                const { pageNum, dataUrl } = historyStack.pop();
                const wrapper = document.querySelector(`.page-wrapper[data-page-num="${pageNum}"]`);
                if (!wrapper) return;
                const drawCanvas = wrapper.querySelector('.draw-canvas');
                if (!drawCanvas) return;
                const drawCtx = drawCanvas.getContext('2d');

                const img = new Image();
                img.onload = () => {
                    drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
                    drawCtx.drawImage(img, 0, 0);
                    if (typeof savePageData === 'function') savePageData(pageNum);
                };
                img.src = dataUrl;
            }
        }

        function savePageDataNow(displayIndex) {
            return new Promise((resolve, reject) => {
                try {
                    clearTimeout(saveTimeout);
                    const wrapper = document.querySelector(`.page-wrapper[data-page-num="${displayIndex}"]`);
                    if (wrapper) {
                        const actualPage = wrapper.dataset.actualPage;
                        const drawCanvas = wrapper.querySelector('.draw-canvas');
                        if (drawCanvas) {
                            currentDrawings[actualPage] = drawCanvas.toDataURL();
                        }
                        
                        const textsOnPage = [];
                        wrapper.querySelectorAll('.text-node-wrapper').forEach(wrapperNode => {
                            const node = wrapperNode.querySelector('.text-node');
                            if (node) {
                                textsOnPage.push({
                                    text: node.innerText,
                                    x: parseFloat(wrapperNode.dataset.baseX) || 0,
                                    y: parseFloat(wrapperNode.dataset.baseY) || 0,
                                    color: node.style.color || activeColor,
                                    fontSize: parseFloat(node.style.fontSize) || 18
                                });
                            }
                        });
                        currentTexts[actualPage] = textsOnPage;

                        const imagesOnPage = [];
                        wrapper.querySelectorAll('.img-node').forEach(node => {
                            const img = node.querySelector('img');
                            if (img) {
                                imagesOnPage.push({
                                    src: img.src,
                                    x: parseFloat(node.dataset.baseX) || 0,
                                    y: parseFloat(node.dataset.baseY) || 0,
                                    w: parseFloat(node.style.width) || 150,
                                    h: parseFloat(node.style.height) || 150
                                });
                            }
                        });
                        currentImages[actualPage] = imagesOnPage;
                    }

                    if (!currentFileId || !db) { resolve(); return; }

                    const tx = db.transaction("files", "readwrite");
                    const store = tx.objectStore("files");
                    const getReq = store.get(currentFileId);
                    
                    getReq.onsuccess = e => {
                        const data = e.target.result;
                        if (data) {
                            data.drawings = currentDrawings;
                            data.texts = currentTexts;
                            data.images = currentImages;
                            data.bookmarks = currentBookmarks;
                            data.pageOrder = [...pageOrder];
                            const putReq = store.put(data);
                            putReq.onsuccess = () => resolve();
                            putReq.onerror = err => reject(err);
                        } else {
                            resolve();
                        }
                    };
                    getReq.onerror = err => reject(err);
                } catch (err) {
                    reject(err);
                }
            });
        }

        function savePageData(displayIndex) {
            if (typeof updateAutosaveIndicator === 'function') updateAutosaveIndicator('saving');
            clearTimeout(saveTimeout);
            saveTimeout = setTimeout(() => {
                savePageDataNow(displayIndex).then(() => {
                    if (typeof updateAutosaveIndicator === 'function') updateAutosaveIndicator('saved');
                }).catch(err => console.error("Autosave Error:", err));
            }, 300);
        }

        function restorePageDrawings(actualPageNum, drawCanvas) {
            const drawCtx = drawCanvas.getContext('2d');
            drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
            if (currentDrawings[actualPageNum]) {
                const img = new Image();
                img.onload = () => drawCtx.drawImage(img, 0, 0);
                img.src = currentDrawings[actualPageNum];
            }
        }

        function restorePageTexts(actualPageNum, wrapper) {
            wrapper.querySelectorAll('.text-node-wrapper').forEach(n => n.remove());
            if (currentTexts[actualPageNum]) {
                currentTexts[actualPageNum].forEach(item => {
                    createTextNode(item.x, item.y, item.text, item.color, wrapper, wrapper.dataset.pageNum, item.fontSize);
                });
            }
        }

        function restorePageImages(actualPageNum, wrapper) {
            wrapper.querySelectorAll('.img-node').forEach(n => n.remove());
            if (currentImages[actualPageNum]) {
                currentImages[actualPageNum].forEach(item => {
                    createImageNode(item.x, item.y, item.src, item.w, item.h, wrapper, wrapper.dataset.pageNum);
                });
            }
        }

        function createTextNode(x, y, text = "Type here...", color = activeColor, parentWrapper = null, displayIndex = currentPage, fontSize = 18) {
            if (!parentWrapper) parentWrapper = document.querySelector(`.page-wrapper[data-page-num="${displayIndex}"]`);
            if (!parentWrapper) return;

            const baseW = parseFloat(parentWrapper.dataset.baseWidth) || 600;
            const baseH = parseFloat(parentWrapper.dataset.baseHeight) || 800;

            const wrapperNode = document.createElement('div');
            wrapperNode.className = 'text-node-wrapper';
            
            wrapperNode.dataset.baseX = x;
            wrapperNode.dataset.baseY = y;
            wrapperNode.style.left = ((x / baseW) * 100) + '%';
            wrapperNode.style.top = ((y / baseH) * 100) + '%';

            const node = document.createElement('div');
            node.className = 'text-node';
            node.contentEditable = true;
            node.innerText = text;
            node.style.color = color;
            node.style.fontSize = fontSize + 'px';

            const delBadge = document.createElement('button');
            delBadge.className = 'delete-text-badge';
            delBadge.innerText = '✕';
            delBadge.onclick = (e) => {
                e.stopPropagation();
                wrapperNode.remove();
                savePageData(displayIndex);
                if (typeof showUndoToast === 'function') {
                    showUndoToast("Text deleted", () => {
                        createTextNode(x, y, text, color, parentWrapper, displayIndex, fontSize);
                        savePageData(displayIndex);
                    });
                }
            };

            node.onfocus = () => {
                activeTextNode = node;
                if (currentTool === 'text') {
                    showSizeSlider('text');
                    const currentSz = parseFloat(node.style.fontSize) || 18;
                    const slider = document.getElementById('toolSizeSlider');
                    const badge = document.getElementById('sizeValBadge');
                    if (slider) slider.value = currentSz;
                    if (badge) badge.innerText = currentSz;
                }
            };

            let isDragging = false, startX, startY, initialBaseX, initialBaseY;

            wrapperNode.onpointerdown = e => {
                if (e.target === delBadge) return;
                if (document.activeElement === node) return;

                isDragging = true;
                startX = e.clientX;
                startY = e.clientY;
                initialBaseX = parseFloat(wrapperNode.dataset.baseX) || 0;
                initialBaseY = parseFloat(wrapperNode.dataset.baseY) || 0;
                
                wrapperNode.setPointerCapture(e.pointerId);
                e.stopPropagation();
            };

            wrapperNode.onpointermove = e => {
                if (isDragging) {
                    const rect = parentWrapper.getBoundingClientRect();
                    const deltaX = (e.clientX - startX) * (baseW / rect.width);
                    const deltaY = (e.clientY - startY) * (baseH / rect.height);

                    const newBaseX = initialBaseX + deltaX;
                    const newBaseY = initialBaseY + deltaY;

                    wrapperNode.dataset.baseX = newBaseX;
                    wrapperNode.dataset.baseY = newBaseY;
                    wrapperNode.style.left = ((newBaseX / baseW) * 100) + '%';
                    wrapperNode.style.top = ((newBaseY / baseH) * 100) + '%';
                }
            };

            wrapperNode.onpointerup = e => {
                if (isDragging) {
                    isDragging = false;
                    try { wrapperNode.releasePointerCapture(e.pointerId); } catch(err){}
                    savePageData(displayIndex);
                }
            };

            node.onblur = () => {
                activeTextNode = null;
                savePageData(displayIndex);
            };

            wrapperNode.appendChild(node);
            wrapperNode.appendChild(delBadge);
            parentWrapper.appendChild(wrapperNode);
            
            if (text === "Type here...") {
                setTimeout(() => {
                    node.focus();
                    const range = document.createRange();
                    range.selectNodeContents(node);
                    const sel = window.getSelection();
                    sel.removeAllRanges();
                    sel.addRange(range);
                }, 50);
            }
        }

        function handleImageUpload(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = ev => {
                const wrapper = document.querySelector(`.page-wrapper[data-page-num="${currentPage}"]`);
                createImageNode(50, 50, ev.target.result, 150, 150, wrapper, currentPage);
                savePageData(currentPage);
            };
            reader.readAsDataURL(file);
            e.target.value = '';
        }

        function createImageNode(x, y, src, w = 150, h = 150, parentWrapper = null, displayIndex = currentPage) {
            if (!parentWrapper) parentWrapper = document.querySelector(`.page-wrapper[data-page-num="${displayIndex}"]`);
            if (!parentWrapper) return;

            const baseW = parseFloat(parentWrapper.dataset.baseWidth) || 600;
            const baseH = parseFloat(parentWrapper.dataset.baseHeight) || 800;

            const node = document.createElement('div');
            node.className = 'img-node';
            node.dataset.baseX = x;
            node.dataset.baseY = y;
            node.style.left = ((x / baseW) * 100) + '%';
            node.style.top = ((y / baseH) * 100) + '%';
            node.style.width = w + 'px';
            node.style.height = h + 'px';

            const img = document.createElement('img');
            img.src = src;

            const delBtn = document.createElement('button');
            delBtn.className = 'delete-img';
            delBtn.innerText = '✕';
            delBtn.onclick = () => { 
                node.remove(); 
                savePageData(displayIndex); 
                if (typeof showUndoToast === 'function') {
                    showUndoToast("Image deleted", () => {
                        createImageNode(x, y, src, w, h, parentWrapper, displayIndex);
                        savePageData(displayIndex);
                    });
                }
            };

            const resizeHandle = document.createElement('div');
            resizeHandle.className = 'resize-handle';
            
            resizeHandle.onpointerdown = e => {
                e.stopPropagation();
                let startX = e.clientX;
                let startY = e.clientY;
                let startWidth = node.offsetWidth;
                let startHeight = node.offsetHeight;

                const onPointerMove = moveEvent => {
                    let newWidth = Math.max(50, startWidth + (moveEvent.clientX - startX) / zoomScale);
                    let newHeight = Math.max(50, startHeight + (moveEvent.clientY - startY) / zoomScale);
                    node.style.width = newWidth + 'px';
                    node.style.height = newHeight + 'px';
                };

                const onPointerUp = () => {
                    window.removeEventListener('pointermove', onPointerMove);
                    window.removeEventListener('pointerup', onPointerUp);
                    savePageData(displayIndex);
                };

                window.addEventListener('pointermove', onPointerMove);
                window.addEventListener('pointerup', onPointerUp);
            };

            node.appendChild(img);
            node.appendChild(delBtn);
            node.appendChild(resizeHandle);

            let isDragging = false, startX, startY, initialBaseX, initialBaseY;

            node.onpointerdown = e => {
                if (e.target === delBtn || e.target === resizeHandle) return;
                isDragging = true;
                startX = e.clientX;
                startY = e.clientY;
                initialBaseX = parseFloat(node.dataset.baseX) || 0;
                initialBaseY = parseFloat(node.dataset.baseY) || 0;
                
                node.setPointerCapture(e.pointerId);
                e.stopPropagation();
            };

            node.onpointermove = e => {
                if (isDragging) {
                    const rect = parentWrapper.getBoundingClientRect();
                    const deltaX = (e.clientX - startX) * (baseW / rect.width);
                    const deltaY = (e.clientY - startY) * (baseH / rect.height);

                    const newBaseX = initialBaseX + deltaX;
                    const newBaseY = initialBaseY + deltaY;

                    node.dataset.baseX = newBaseX;
                    node.dataset.baseY = newBaseY;
                    node.style.left = ((newBaseX / baseW) * 100) + '%';
                    node.style.top = ((newBaseY / baseH) * 100) + '%';
                }
            };

            node.onpointerup = e => {
                if (isDragging) {
                    isDragging = false;
                    try { node.releasePointerCapture(e.pointerId); } catch(err){}
                    savePageData(displayIndex);
                }
            };

            parentWrapper.appendChild(node);
        }

        // تحويل ألوان Hex/RGB إلى RGB متوافق مع PDFLib
        function parseColorToPdfRgb(colorStr) {
            if (!colorStr) return PDFLib.rgb(0, 0, 0);
            if (colorStr.startsWith('#')) {
                let hex = colorStr.replace('#', '');
                if (hex.length === 3) hex = hex.split('').map(c => c + c).join('');
                const intVal = parseInt(hex, 16);
                return PDFLib.rgb(((intVal >> 16) & 255) / 255, ((intVal >> 8) & 255) / 255, (intVal & 255) / 255);
            }
            const match = colorStr.match(/rgba?\((\d+),\s*(\d+),\s*(\d+)/);
            if (match) {
                return PDFLib.rgb(parseInt(match[1]) / 255, parseInt(match[2]) / 255, parseInt(match[3]) / 255);
            }
            return PDFLib.rgb(0, 0, 0);
        }

        async function exportFullPDF() {
            if (!pdfDoc || !window.PDFLib) return;
            await savePageDataNow(currentPage);

            const tx = db.transaction("files", "readonly");
            tx.objectStore("files").get(currentFileId).onsuccess = async e => {
                const record = e.target.result;
                if (!record || !record.data) return;

                const pdfLibDoc = await PDFLib.PDFDocument.load(record.data);
                const newDoc = await PDFLib.PDFDocument.create();

                for (let i = 0; i < pageOrder.length; i++) {
                    const actualPageNum = pageOrder[i];
                    const [copiedPage] = await newDoc.copyPages(pdfLibDoc, [actualPageNum - 1]);
                    const page = newDoc.addPage(copiedPage);
                    const { width, height } = page.getSize();

                    // 1. تصدير الرسومات
                    if (record.drawings && record.drawings[actualPageNum]) {
                        try {
                            const img = await newDoc.embedPng(record.drawings[actualPageNum]);
                            page.drawImage(img, { x: 0, y: 0, width: width, height: height });
                        } catch(err) { console.error("Error embedding drawings:", err); }
                    }

                    // 2. تصدير الصور المضافة
                    if (record.images && record.images[actualPageNum]) {
                        for (const imgData of record.images[actualPageNum]) {
                            try {
                                let embeddedImg;
                                if (imgData.src.startsWith('data:image/png')) {
                                    embeddedImg = await newDoc.embedPng(imgData.src);
                                } else {
                                    embeddedImg = await newDoc.embedJpg(imgData.src);
                                }
                                const pdfY = height - imgData.y - imgData.h;
                                page.drawImage(embeddedImg, {
                                    x: imgData.x,
                                    y: pdfY,
                                    width: imgData.w,
                                    height: imgData.h
                                });
                            } catch(err) { console.error("Error embedding image node:", err); }
                        }
                    }

                    // 3. تصدير النصوص
                    if (record.texts && record.texts[actualPageNum]) {
                        record.texts[actualPageNum].forEach(t => {
                            if (!t.text) return;
                            const pdfY = height - t.y - (t.fontSize || 18);
                            try {
                                page.drawText(t.text, {
                                    x: t.x,
                                    y: pdfY > 0 ? pdfY : t.y,
                                    size: t.fontSize || 18,
                                    color: parseColorToPdfRgb(t.color)
                                });
                            } catch(err) { console.error("Error drawing text node:", err); }
                        });
                    }
                }

                const pdfBytes = await newDoc.save();
                const blob = new Blob([pdfBytes], { type: 'application/pdf' });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = `notebook_export_${Date.now()}.pdf`;
                link.click();
            };
        }
    </script>
