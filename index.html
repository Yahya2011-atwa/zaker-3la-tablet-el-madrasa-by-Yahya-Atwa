        function initVirtualViewer() {
            const container = document.getElementById('viewer-container');
            const thumbsContainer = document.getElementById('thumbnailsContainer');
            if (!container || !thumbsContainer) return;
            installVerticalPageSync();
            container.innerHTML = '';
            thumbsContainer.innerHTML = '';
            renderedPages.clear();

            if (pageObserver) pageObserver.disconnect();

            pageObserver = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    const pageWrapper = entry.target;
                    const displayIndex = parseInt(pageWrapper.dataset.pageNum);
                    const actualPageNum = parseInt(pageWrapper.dataset.actualPage);

                    if (entry.isIntersecting) {
                        if (!renderedPages.has(displayIndex)) {
                            renderPageContent(pageWrapper, actualPageNum, displayIndex);
                            renderedPages.add(displayIndex);
                        }
                    } else {
                        if (renderedPages.has(displayIndex)) {
                            const canvases = pageWrapper.querySelectorAll('canvas');
                            canvases.forEach(c => {
                                const ctx = c.getContext('2d');
                                if (ctx) ctx.clearRect(0, 0, c.width, c.height);
                            });
                            pageWrapper.dataset.rendered = "false";
                            renderedPages.delete(displayIndex);
                        }
                    }
                });
            }, { root: container, rootMargin: ((navigator.deviceMemory || 4) <= 2 ? '90px 80px' : '180px 140px') }); // زيادة مساحة التتبع لضمان سلاسة السحب في كل الاتجاهات

            for (let index = 0; index < pageOrder.length; index++) {
                const actualPageNum = pageOrder[index];
                const displayIndex = index + 1;

                const pageWrapper = document.createElement('div');
                pageWrapper.className = `page-wrapper ${globalPageStyle} ${displayIndex === currentPage ? 'active' : ''}`;
                pageWrapper.dataset.pageNum = displayIndex;
                pageWrapper.dataset.actualPage = actualPageNum;

                // إضافة البوكمارك الحمراء على الصفحة من فوق وتحتها ظل
                const bookmarkBadge = document.createElement('div');
                bookmarkBadge.className = 'page-bookmark-badge';
                bookmarkBadge.innerHTML = '';
                bookmarkBadge.onclick = () => {
                    if (typeof goToPage === 'function') goToPage(displayIndex);
                    toggleSidebar(true);
                };
                pageWrapper.appendChild(bookmarkBadge);

                container.appendChild(pageWrapper);
                pageObserver.observe(pageWrapper);

                if (typeof renderThumbnailSkeleton === 'function') renderThumbnailSkeleton(displayIndex, actualPageNum);
                updatePageBookmarkUI(displayIndex);
            }

            applyViewModeUI();
            if (typeof reorderDOMPages === 'function') reorderDOMPages();
            if (typeof goToPage === 'function') goToPage(currentPage);
            requestAnimationFrame(() => {
                applyZoomTransform();
                const c = document.getElementById('viewer-container');
                const state = savedPageViewState[currentPage] || savedPageViewState[String(currentPage)] || {};
                if (c) { c.scrollLeft = Number(state.scrollLeft || 0); c.scrollTop = Number(state.scrollTop || 0); }
            });
        }

        async function renderPageContent(pageWrapper, actualPageNum, displayIndex) {
            if (pageWrapper.dataset.rendered === "true") return;
            pageWrapper.dataset.rendered = "true";

            const page = await pdfDoc.getPage(actualPageNum);
            const viewport = page.getViewport({ scale: baseScale });
            let quality = renderQualityScale;
            const maxPixels = ((navigator.deviceMemory || 4) <= 2 ? 2200000 : 6000000);
            const wantedPixels = viewport.width * viewport.height * quality * quality;
            if (wantedPixels > maxPixels) quality = Math.sqrt(maxPixels / (viewport.width * viewport.height));
            const hdViewport = page.getViewport({ scale: baseScale * quality });

            pageWrapper.dataset.baseWidth = viewport.width;
            pageWrapper.dataset.baseHeight = viewport.height;
            pageWrapper.style.width = (viewport.width * zoomScale) + 'px';
            pageWrapper.style.height = (viewport.height * zoomScale) + 'px';

            let pdfCanvas = pageWrapper.querySelector('canvas.pdf-render');
            if (!pdfCanvas) {
                pdfCanvas = document.createElement('canvas');
                pdfCanvas.className = 'pdf-render';
                pageWrapper.appendChild(pdfCanvas);
            }
            pdfCanvas.width = Math.ceil(hdViewport.width);
            pdfCanvas.height = Math.ceil(hdViewport.height);
            pdfCanvas.style.width = '100%';
            pdfCanvas.style.height = '100%';

            let textLayerDiv = pageWrapper.querySelector('.textLayer');
            if (!textLayerDiv) {
                textLayerDiv = document.createElement('div');
                textLayerDiv.className = 'textLayer';
                pageWrapper.appendChild(textLayerDiv);
            } else {
                textLayerDiv.innerHTML = '';
            }

            let drawCanvas = pageWrapper.querySelector('canvas.draw-canvas');
            if (!drawCanvas) {
                drawCanvas = document.createElement('canvas');
                drawCanvas.className = 'draw-canvas';
                pageWrapper.appendChild(drawCanvas);
            }
            drawCanvas.width = Math.ceil(hdViewport.width);
            drawCanvas.height = Math.ceil(hdViewport.height);
            drawCanvas.style.width = '100%';
            drawCanvas.style.height = '100%';

            page.render({ 
                canvasContext: pdfCanvas.getContext('2d'), 
                viewport: hdViewport 
            }).promise.then(async () => {
                const textContent = await page.getTextContent();
                pdfjsLib.renderTextLayer({
                    textContent: textContent,
                    container: textLayerDiv,
                    viewport: viewport,
                    textDivs: []
                });
                // Release PDF.js page resources after the visible render is complete.
                page.cleanup?.();
            }).catch(err => {
                console.error('Page render error:', err);
                pageWrapper.dataset.rendered = "false";
                renderedPages.delete(displayIndex);
            });

            if (typeof restorePageDrawings === 'function') restorePageDrawings(actualPageNum, drawCanvas);
            if (typeof restorePageTexts === 'function') restorePageTexts(actualPageNum, pageWrapper);
            if (typeof restorePageImages === 'function') restorePageImages(actualPageNum, pageWrapper);
            if (typeof initDrawingEvents === 'function') initDrawingEvents(drawCanvas, displayIndex, actualPageNum);
            if (typeof updateCanvasPointerEvents === 'function') updateCanvasPointerEvents();
        }

function renderThumbnailSkeleton(displayIndex, actualPageNum) {
            const thumbsContainer = document.getElementById('thumbnailsContainer');
            if (!thumbsContainer) return;

            const thumbItem = document.createElement('div');
            thumbItem.className = `thumb-item ${displayIndex === currentPage ? 'active' : ''}`;
            thumbItem.dataset.pageNum = displayIndex;
            thumbItem.dataset.actualPage = actualPageNum;
            thumbItem.draggable = true;

            const deleteBadge = document.createElement('div');
            deleteBadge.className = 'thumb-delete-badge';
            deleteBadge.innerText = '✕';
            deleteBadge.onclick = (e) => {
                e.stopPropagation();
                const pIndex = parseInt(thumbItem.dataset.pageNum);
                if (typeof confirmDeletePage === 'function') confirmDeletePage(pIndex);
            };

            const pageNumBadge = document.createElement('div');
            pageNumBadge.className = 'thumb-page-num';
            pageNumBadge.textContent = displayIndex;

            const thumbBookmarkBadge = document.createElement('div');
            thumbBookmarkBadge.className = 'thumb-bookmark-badge';
            thumbBookmarkBadge.textContent = '';
            thumbItem.appendChild(deleteBadge);
            thumbItem.appendChild(thumbBookmarkBadge);
            thumbItem.appendChild(pageNumBadge);
            if (currentBookmarks[actualPageNum]) thumbItem.classList.add('bookmarked');
            thumbsContainer.appendChild(thumbItem);

            setupDragAndDrop(thumbItem);

            thumbItem.addEventListener('pointerdown', (e) => {
                if (e.target.classList.contains('thumb-delete-badge')) return;
                longPressTimer = setTimeout(() => {
                    toggleEditMode(true);
                }, 500);
            });

            thumbItem.addEventListener('pointerup', () => clearTimeout(longPressTimer));
            thumbItem.addEventListener('pointermove', () => clearTimeout(longPressTimer));

            thumbItem.onclick = () => {
                if (!isEditMode) {
                    const pIndex = parseInt(thumbItem.dataset.pageNum);
                    goToPage(pIndex);
                }
            };

            const thumbObserver = new IntersectionObserver((entries, obs) => {
                entries.forEach(async entry => {
                    if (entry.isIntersecting) {
                        obs.disconnect();
                        if (!pdfDoc) return;
                        try {
                            const page = await pdfDoc.getPage(actualPageNum);
                            const thumbViewport = page.getViewport({ scale: THUMB_SCALE });
                            const thumbCanvas = document.createElement('canvas');
                            thumbCanvas.width = Math.max(1, Math.ceil(thumbViewport.width));
                            thumbCanvas.height = Math.max(1, Math.ceil(thumbViewport.height));
                            thumbCanvas.style.height = '60px';
                            thumbCanvas.style.width = 'auto';
                            thumbCanvas.style.position = 'relative';
                            thumbItem.insertBefore(thumbCanvas, pageNumBadge);

                            const overlayCanvas = document.createElement('canvas');
                            overlayCanvas.className = 'thumb-annotation-canvas';
                            overlayCanvas.width = thumbCanvas.width;
                            overlayCanvas.height = thumbCanvas.height;
                            overlayCanvas.style.height = '60px';
                            overlayCanvas.style.width = 'auto';
                            thumbItem.insertBefore(overlayCanvas, pageNumBadge);

                            await page.render({
                                canvasContext: thumbCanvas.getContext('2d', { alpha: false }),
                                viewport: thumbViewport
                            }).promise;

                            renderThumbnailAnnotations(displayIndex, actualPageNum, thumbCanvas, overlayCanvas);
                            page.cleanup?.();
                        } catch (err) {
                            console.error('Thumbnail render error:', err);
                        }
                    }
                });
            }, { root: thumbsContainer, rootMargin: '100px' });

            thumbObserver.observe(thumbItem);
        }

        function getThumbnailCanvases(displayIndex) {
            const thumb = document.querySelector(`.thumb-item[data-page-num="${displayIndex}"]`);
            if (!thumb) return null;
            return {
                pdf: thumb.querySelector('canvas:not(.thumb-annotation-canvas)'),
                overlay: thumb.querySelector('canvas.thumb-annotation-canvas')
            };
        }

        function loadThumbnailImage(src) {
            return new Promise(resolve => {
                if (!src) return resolve(null);
                const img = new Image();
                img.onload = () => resolve(img);
                img.onerror = () => resolve(null);
                img.src = src;
            });
        }

        async function renderThumbnailAnnotations(displayIndex, actualPageNum, pdfCanvas = null, overlayCanvas = null) {
            const canvases = overlayCanvas ? { pdf: pdfCanvas, overlay: overlayCanvas } : getThumbnailCanvases(displayIndex);
            if (!canvases?.overlay) return;

            const canvas = canvases.overlay;
            const ctx = canvas.getContext('2d');
            if (!ctx) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const baseW = parseFloat(document.querySelector(`.page-wrapper[data-page-num="${displayIndex}"]`)?.dataset.baseWidth) || (canvas.width / THUMB_SCALE);
            const scale = canvas.width / baseW;

            const drawing = currentDrawings[actualPageNum];
            if (drawing) {
                const img = await loadThumbnailImage(drawing);
                if (img) ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            }

            const images = currentImages[actualPageNum] || [];
            for (const item of images) {
                const img = await loadThumbnailImage(item.src);
                if (!img) continue;
                ctx.drawImage(img,
                    (Number(item.x) || 0) * scale,
                    (Number(item.y) || 0) * scale,
                    Math.max(1, (Number(item.w) || 150) * scale),
                    Math.max(1, (Number(item.h) || 150) * scale)
                );
            }

            const texts = currentTexts[actualPageNum] || [];
            ctx.save();
            ctx.textBaseline = 'top';
            for (const item of texts) {
                if (!item?.text) continue;
                const fontSize = Math.max(4, (Number(item.fontSize) || 18) * scale);
                ctx.font = `${fontSize}px -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif`;
                ctx.fillStyle = item.color || activeColor || '#000000';
                const lines = String(item.text).split(/\r?\n/);
                lines.forEach((line, index) => {
                    ctx.fillText(line, (Number(item.x) || 0) * scale, ((Number(item.y) || 0) * scale) + index * fontSize * 1.3);
                });
            }
            ctx.restore();
        }

        function refreshThumbnail(displayIndex, actualPageNum = Number(pageOrder[displayIndex - 1])) {
            const canvases = getThumbnailCanvases(displayIndex);
            if (!canvases?.overlay) return;
            renderThumbnailAnnotations(displayIndex, actualPageNum, canvases.pdf, canvases.overlay).catch(err => console.error('Thumbnail update error:', err));
        }

        function toggleEditMode(enable) {
            isEditMode = !!enable;
            const container = document.getElementById('thumbnailsContainer');
            if (!container) return;
            container.classList.toggle('edit-mode', isEditMode);
            if (!isEditMode && longPressTimer) {
                clearTimeout(longPressTimer);
                longPressTimer = null;
            }
        }

        document.addEventListener('pointerdown', (e) => {
            if (!isEditMode) return;
            const insideThumb = e.target.closest('#thumbnailsContainer .thumb-item');
            const insideThumbBar = e.target.closest('#bottom-thumbnails-bar');
            if (!insideThumb && !insideThumbBar) toggleEditMode(false);
        }, true);

        async function captureRenderedPageStatesNow() {
            if (!currentFileId || !db) return;
            const wrappers = [...document.querySelectorAll('.page-wrapper[data-actual-page]')];
            for (const wrapper of wrappers) {
                if (wrapper.dataset.rendered !== 'true') continue;
                const actualPage = Number(wrapper.dataset.actualPage);
                const drawCanvas = wrapper.querySelector('.draw-canvas');
                if (drawCanvas) currentDrawings[actualPage] = drawCanvas.toDataURL('image/png');
                const texts = [];
                wrapper.querySelectorAll('.text-node-wrapper').forEach(w => {
                    const n = w.querySelector('.text-node');
                    if (n) texts.push({text:n.innerText,x:parseFloat(w.dataset.baseX)||0,y:parseFloat(w.dataset.baseY)||0,color:n.style.color||activeColor,fontSize:parseFloat(n.style.fontSize)||18});
                });
                currentTexts[actualPage] = texts;
                const images = [];
                wrapper.querySelectorAll('.img-node').forEach(n => {
                    const img=n.querySelector('img');
                    if(img) images.push({src:img.src,x:parseFloat(n.dataset.baseX)||0,y:parseFloat(n.dataset.baseY)||0,w:parseFloat(n.style.width)||150,h:parseFloat(n.style.height)||150});
                });
                currentImages[actualPage] = images;
                await putPageState({fileId:currentFileId,page:actualPage,drawings:currentDrawings[actualPage]||null,texts,images});
            }
        }

        async function updateThumbnailsAndPagesIndexes() {
            await captureRenderedPageStatesNow();
            const activeActualPage = Number(pageOrder[currentPage - 1]) || 0;
            const thumbs = [...document.querySelectorAll('.thumb-item')];
            const newOrder = thumbs.map(thumb => Number(thumb.dataset.actualPage)).filter(Boolean);
            pageOrder = newOrder;
            if (activeActualPage) {
                const nextIndex = pageOrder.indexOf(activeActualPage);
                currentPage = nextIndex >= 0 ? nextIndex + 1 : Math.min(currentPage, pageOrder.length);
            }
            thumbs.forEach((thumb, idx) => {
                const display = idx + 1;
                thumb.dataset.pageNum = display;
                const badge = thumb.querySelector('.thumb-page-num');
                if (badge) badge.textContent = display;
                thumb.classList.toggle('active', display === currentPage);
                thumb.classList.toggle('bookmarked', !!currentBookmarks[Number(thumb.dataset.actualPage)]);
            });
            await saveDocumentSettings();
            // Rebuild the viewer so every draw/text/image event is rebound to the page's actual identity.
            initVirtualViewer();
            renderSidebarBookmarks();
            schedulePortablePDFSave();
        }

        function reorderDOMPages() {
            const container = document.getElementById('viewer-container');
            if (!container) return;
            pageOrder.forEach(actualPage => {
                const wrapper = container.querySelector(`.page-wrapper[data-actual-page="${actualPage}"]`);
                if (wrapper) {
                    container.appendChild(wrapper);
                }
            });
        }

        function setupDragAndDrop(thumb) {
            thumb.addEventListener('dragstart', (e) => {
                thumb.classList.add('dragging');
                e.dataTransfer.setData('text/plain', thumb.dataset.actualPage);
            });

            thumb.addEventListener('dragend', async () => {
                thumb.classList.remove('dragging');
                await updateThumbnailsAndPagesIndexes();
            });

            thumb.addEventListener('dragover', (e) => {
                e.preventDefault();
                const container = document.getElementById('thumbnailsContainer');
                if (!container) return;
                const dragging = container.querySelector('.dragging');
                if (!dragging) return;
                const siblings = [...container.querySelectorAll('.thumb-item:not(.dragging)')];
                const nextSibling = siblings.find(sibling => {
                    return e.clientX <= sibling.getBoundingClientRect().left + sibling.getBoundingClientRect().width / 2;
                });
                if (nextSibling) {
                    container.insertBefore(dragging, nextSibling);
                } else {
                    container.appendChild(dragging);
                }
            });

            thumb.addEventListener('drop', (e) => {
                e.preventDefault();
            });
        }

        async function saveDocumentSettings() {
            if (!db || !currentFileId) return;
            const container = document.getElementById('viewer-container');
            const saved = savedPageViewState || {};
            saved.currentPage = currentPage;
            saved.viewMode = viewMode;
            saved.globalPageStyle = globalPageStyle;
            const state = saved[currentPage] || {};
            state.zoomScale = zoomScale;
            if (container) {
                state.scrollLeft = container.scrollLeft;
                state.scrollTop = container.scrollTop;
            }
            state.timestamp = Date.now();
            saved[currentPage] = state;
            savedPageViewState = saved;

            updateAutosaveIndicator('saving');
            await putSettings({
                fileId: currentFileId,
                pageOrder: [...pageOrder],
                bookmarks: currentBookmarks,
                bookmarkVersion: 2,
                viewMode,
                globalPageStyle,
                pageViewState: savedPageViewState
            });
            updateAutosaveIndicator('saved');
        }

        function scheduleDocumentSettingsSave() {
            clearTimeout(viewSaveTimeout);
            viewSaveTimeout = setTimeout(() => {
                saveDocumentSettings().catch(err => console.error('View state save error:', err));
            }, ((navigator.deviceMemory || 4) <= 2 ? 650 : 350));
        }

        async function savePageOrder() {
            await saveDocumentSettings();
        }

        async function deleteAllPageStates(fileId) {
            const states = await getAllPageStates(fileId).catch(() => []);
            if (!states.length) return;
            const tx = db.transaction('pages', 'readwrite');
            const store = tx.objectStore('pages');
            states.forEach(state => store.delete([fileId, Number(state.page)]));
            await new Promise((resolve, reject) => {
                tx.oncomplete = resolve;
                tx.onerror = e => reject(e.target.error);
                tx.onabort = e => reject(e.target.error || new Error('Page-state delete aborted'));
            });
        }

        async function replaceAllPageStates(fileId) {
            await deleteAllPageStates(fileId);
            await saveAllLoadedPageStates();
        }

        async function saveAllLoadedPageStates() {
            const tasks = [];
            for (const displayIndex of Object.keys(currentDrawings)) {
                const actualPage = Number(displayIndex);
                tasks.push(putPageState({
                    fileId: currentFileId,
                    page: actualPage,
                    drawings: currentDrawings[actualPage] || null,
                    texts: currentTexts[actualPage] || [],
                    images: currentImages[actualPage] || []
                }));
            }
            for (const displayIndex of Object.keys(currentTexts)) {
                const actualPage = Number(displayIndex);
                if (currentDrawings[actualPage] !== undefined) continue;
                tasks.push(putPageState({
                    fileId: currentFileId,
                    page: actualPage,
                    drawings: null,
                    texts: currentTexts[actualPage] || [],
                    images: currentImages[actualPage] || []
                }));
            }
            for (const displayIndex of Object.keys(currentImages)) {
                const actualPage = Number(displayIndex);
                if (currentDrawings[actualPage] !== undefined || currentTexts[actualPage] !== undefined) continue;
                tasks.push(putPageState({
                    fileId: currentFileId,
                    page: actualPage,
                    drawings: null,
                    texts: [],
                    images: currentImages[actualPage] || []
                }));
            }
            await Promise.all(tasks);
        }

        function syncActiveThumbnail(instant = false) {
            const container = document.getElementById('thumbnailsContainer');
            if (!container) return;
            const thumbs = container.querySelectorAll('.thumb-item');
            let activeThumb = null;
            thumbs.forEach(thumb => {
                const active = Number(thumb.dataset.pageNum) === Number(currentPage);
                thumb.classList.toggle('active', active);
                if (active) activeThumb = thumb;
            });
            if (!activeThumb) return;
            const target = activeThumb.offsetLeft - (container.clientWidth - activeThumb.offsetWidth) / 2;
            const max = Math.max(0, container.scrollWidth - container.clientWidth);
            container.scrollTo({left:Math.max(0,Math.min(max,target)), behavior:instant ? 'auto' : ((navigator.deviceMemory || 4) <= 2 ? 'auto' : 'smooth')});
        }

        function goToPage(pageNum) {
            if (!pdfDoc || pageNum < 1 || pageNum > pageOrder.length) return;
            const previousPage = currentPage;
            if (previousPage !== pageNum) {
                savePageDataNow(previousPage).catch(() => {});
                currentPage = pageNum;
            }

            const container = document.getElementById('viewer-container');
            const targetWrapper = document.querySelector(`.page-wrapper[data-page-num="${pageNum}"]`);
            const saved = savedPageViewState[pageNum] || savedPageViewState[String(pageNum)] || {};

            if (targetWrapper && container) {
                if (viewMode === 'vertical') {
                    const top = Math.max(0, targetWrapper.offsetTop - 12);
                    container.scrollTo({top, behavior: ((navigator.deviceMemory || 4) <= 2 ? 'auto' : 'smooth')});
                } else {
                    updatePageDisplay();
                    requestAnimationFrame(() => {
                        container.scrollLeft = Number(saved.scrollLeft || 0);
                        container.scrollTop = Number(saved.scrollTop || 0);
                    });
                }
            }

            const bookmarkBtn = document.getElementById('bookmarkToggleBtn');
            if (bookmarkBtn) bookmarkBtn.classList.toggle('active', !!currentBookmarks[currentPage]);

            syncActiveThumbnail();

            const pageState = savedPageViewState[currentPage] || {};
            if (Number.isFinite(Number(pageState.zoomScale))) {
                zoomScale = Math.max(0.5, Math.min(6.0, Number(pageState.zoomScale)));
                applyZoomTransform();
            }
            scheduleDocumentSettingsSave();
        }

        function changePage(dir) {
            goToPage(currentPage + dir);
        }

        let verticalPageSyncRaf = 0;
        function installVerticalPageSync() {
            const container = document.getElementById('viewer-container');
            if (!container || container.dataset.pageSyncInstalled === '1') return;
            container.dataset.pageSyncInstalled = '1';
            container.addEventListener('scroll', () => {
                if (viewMode !== 'vertical') return;
                if (verticalPageSyncRaf) return;
                verticalPageSyncRaf = requestAnimationFrame(() => {
                    verticalPageSyncRaf = 0;
                    const pages = container.querySelectorAll('.page-wrapper');
                    if (!pages.length) return;
                    const viewportMid = container.scrollTop + container.clientHeight * 0.38;
                    let best = currentPage, bestDist = Infinity;
                    pages.forEach(p => {
                        const center = p.offsetTop + p.offsetHeight / 2;
                        const dist = Math.abs(center - viewportMid);
                        if (dist < bestDist) { bestDist = dist; best = Number(p.dataset.pageNum); }
                    });
                    if (best !== currentPage) {
                        currentPage = best;
                        document.getElementById('bookmarkToggleBtn')?.classList.toggle('active', !!currentBookmarks[currentPage]);
                        syncActiveThumbnail(true);
                        scheduleDocumentSettingsSave();
                    }
                });
            }, {passive:true});
        }

        function updatePageDisplay() {
            if (viewMode !== 'horizontal') return;
            const wrappers = document.querySelectorAll('.page-wrapper');
            wrappers.forEach(wrapper => {
                const pNum = parseInt(wrapper.dataset.pageNum);
                wrapper.classList.toggle('active', pNum === currentPage);
            });
        }

        /* Pinch/zoom: always anchors on the point between the two fingers. */
        let initialDistance = null;
        let pinchStartZoom = 1;
        let pinchPoint = { x: 0, y: 0 };
        let pinchMidClient = { x: 0, y: 0 };
        const viewer = document.getElementById('viewer-container');
        const editorScreen = document.getElementById('editor-screen');
        const isLowPowerDevice = (navigator.deviceMemory || 4) <= 2;
        const startTouch = () => { if (currentTool && editorScreen) editorScreen.classList.add('is-touching'); };
        const endTouch = () => { if (editorScreen) editorScreen.classList.remove('is-touching'); };
        const touchDistance = (a,b) => Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);
        const touchMid = (a,b) => ({x:(a.clientX+b.clientX)/2,y:(a.clientY+b.clientY)/2});

        function applyZoomAround(newScale, clientX, clientY) {
            if (!viewer || !pdfDoc) return;
            const rect = viewer.getBoundingClientRect();
            const old = zoomScale;
            const z = Math.max(0.5, Math.min(6.0, newScale));
            if (Math.abs(z-old)<0.001) return;
            const lx = clientX-rect.left, ly=clientY-rect.top;
            const logicalX=(viewer.scrollLeft+lx)/old;
            const logicalY=(viewer.scrollTop+ly)/old;
            zoomScale=z;
            applyZoomTransform();
            requestAnimationFrame(()=>{
                viewer.scrollLeft=Math.max(0,logicalX*z-lx);
                viewer.scrollTop=Math.max(0,logicalY*z-ly);
                scheduleDocumentSettingsSave();
                updateZoomLabel();
            });
        }

        if (viewer) {
            viewer.addEventListener('touchstart', e => {
                if (e.touches.length!==2) return;
                e.preventDefault();
                e.stopImmediatePropagation();
                isDrawing=false;
                const d=touchDistance(e.touches[0],e.touches[1]);
                const m=touchMid(e.touches[0],e.touches[1]);
                const rect=viewer.getBoundingClientRect();
                initialDistance=Math.max(1,d);
                pinchStartZoom=zoomScale;
                pinchMidClient=m;
                pinchPoint={x:(viewer.scrollLeft+(m.x-rect.left))/zoomScale,y:(viewer.scrollTop+(m.y-rect.top))/zoomScale};
            },{passive:false,capture:true});

            viewer.addEventListener('touchmove', e => {
                if (e.touches.length!==2 || initialDistance===null) return;
                e.preventDefault();
                e.stopImmediatePropagation();
                const d=touchDistance(e.touches[0],e.touches[1]);
                const m=touchMid(e.touches[0],e.touches[1]);
                const z=Math.max(0.5,Math.min(6.0,pinchStartZoom*(d/initialDistance)));
                zoomScale=z;
                applyZoomTransform();
                const rect=viewer.getBoundingClientRect();
                viewer.scrollLeft=Math.max(0,pinchPoint.x*z-(m.x-rect.left));
                viewer.scrollTop=Math.max(0,pinchPoint.y*z-(m.y-rect.top));
                pinchMidClient=m;
                updateZoomLabel();
            },{passive:false,capture:true});

            const endPinch=()=>{ if(initialDistance!==null){ initialDistance=null; scheduleDocumentSettingsSave(); } };
            viewer.addEventListener('touchend', e => { e.stopImmediatePropagation(); endPinch(); },{passive:true,capture:true});
            viewer.addEventListener('touchcancel', e => { e.stopImmediatePropagation(); endPinch(); },{passive:true,capture:true});

            viewer.addEventListener('wheel', e => {
                if (!(e.ctrlKey||e.metaKey)||!pdfDoc) return;
                e.preventDefault();
                e.stopImmediatePropagation();
                applyZoomAround(zoomScale*Math.exp(-e.deltaY*0.0025),e.clientX,e.clientY);
            },{passive:false,capture:true});

            let scrollRaf=null;
            viewer.addEventListener('scroll',()=>{
                if(scrollRaf)return;
                scrollRaf=requestAnimationFrame(()=>{scrollRaf=null;scheduleDocumentSettingsSave();});
            },{passive:true});
        }

        function applyZoomTransform() {
            document.querySelectorAll('.page-wrapper').forEach(w=>{
                const baseW=parseFloat(w.dataset.baseWidth)||600;
                const baseH=parseFloat(w.dataset.baseHeight)||800;
                w.style.width=(baseW*zoomScale)+'px';
                w.style.height=(baseH*zoomScale)+'px';
                w.style.flex='0 0 auto';

                // Keep text/images attached to the same document coordinates while keeping their own size unchanged.

        function initDrawingEvents(canvas, displayIndex, actualPageNum) {
            const ctx = canvas.getContext('2d', { alpha:true, desynchronized:true });
            ctx.imageSmoothingEnabled = true;
            ctx.imageSmoothingQuality = 'high';
            const getPos = e => {
                const r = canvas.getBoundingClientRect();
                return { x:(e.clientX-r.left)*(canvas.width/r.width), y:(e.clientY-r.top)*(canvas.height/r.height) };
            };
            let points = [], drawing = false;
            const saveActual = () => {
                const wrapper = document.querySelector(`.page-wrapper[data-actual-page="${actualPageNum}"]`);
                const liveDisplay = wrapper ? Number(wrapper.dataset.pageNum) : getDisplayForActual(actualPageNum);
                if (liveDisplay) savePageData(liveDisplay);
            };
            const finish = () => {
                if (!drawing) return;
                drawing=false; points=[]; ctx.globalAlpha=1; ctx.globalCompositeOperation='source-over';
                if (eraserCursor) eraserCursor.style.display='none';
                saveActual();
            };
            const drawSegment = p => {
                const last = points[points.length-1];
                if (!last) { points.push(p); return; }
                const dx=p.x-last.x, dy=p.y-last.y, dist=Math.hypot(dx,dy);
                if (dist < .15) return;
                // Interpolate aggressively so even extremely fast pen motion never leaves holes.
                const maxStep = Math.max(.7, Math.min(2.2, ctx.lineWidth * .18));
                const steps = Math.max(1, Math.ceil(dist/maxStep));
                let prev=last;
                for(let i=1;i<=steps;i++){
                    const t=i/steps;
                    const q={x:last.x+dx*t,y:last.y+dy*t};
                    ctx.beginPath();
                    ctx.moveTo(prev.x,prev.y);
                    ctx.lineTo(q.x,q.y);
                    ctx.stroke();
                    prev=q;
                }
                points.push(p);
                if(points.length>12) points.splice(0,points.length-6);
            };
            canvas.onpointerdown = e => {
                if (!currentTool) return;
                startTouch();
                if (currentTool==='text') {
                    const rect=canvas.parentElement.getBoundingClientRect(), fontSize=toolSizes.text||18;
                    const bw=+(canvas.parentElement.dataset.baseWidth||600), bh=+(canvas.parentElement.dataset.baseHeight||800);
                    createTextNode(((e.clientX-rect.left)/rect.width)*bw,((e.clientY-rect.top)/rect.height)*bh,'Type here...',activeColor,canvas.parentElement,Number(canvas.parentElement.dataset.pageNum),fontSize);
                    saveActual(); return;
                }
                if(!['pen','eraser','highlighter'].includes(currentTool)) return;
                redoStack=[];
                historyStack.push({pageNum:Number(canvas.parentElement.dataset.pageNum),actualPage:actualPageNum,dataUrl:canvas.toDataURL('image/png')});
                if(historyStack.length>12)historyStack.shift();
                drawing=true; canvas.setPointerCapture?.(e.pointerId);
                const factor = canvas.width / (+(canvas.parentElement.dataset.baseWidth||canvas.width));
                const size=(toolSizes[currentTool]||4)*factor;
                ctx.lineWidth=size;ctx.lineCap='round';ctx.lineJoin='round';ctx.miterLimit=2;
                if(currentTool==='eraser'){
                    ctx.globalCompositeOperation='destination-out';ctx.globalAlpha=1;ctx.strokeStyle='rgba(0,0,0,1)';
                    if(eraserCursor){const ds=toolSizes.eraser*zoomScale;eraserCursor.style.width=ds+'px';eraserCursor.style.height=ds+'px';eraserCursor.style.left=e.clientX+'px';eraserCursor.style.top=e.clientY+'px';eraserCursor.style.display='block';}
                } else {
                    ctx.globalCompositeOperation='source-over';ctx.strokeStyle=activeColor;ctx.globalAlpha=currentTool==='highlighter'?.28:1;
                }
                const p=getPos(e); points=[p];
                ctx.beginPath();ctx.arc(p.x,p.y,Math.max(.5,size/2),0,Math.PI*2);
                ctx.fillStyle=currentTool==='eraser'?'rgba(0,0,0,1)':activeColor;ctx.fill();
            };
            canvas.onpointermove = e => {
                if(currentTool==='eraser'&&drawing&&eraserCursor){eraserCursor.style.left=e.clientX+'px';eraserCursor.style.top=e.clientY+'px';}
                if(!drawing)return;
                const events = typeof e.getCoalescedEvents === 'function' ? e.getCoalescedEvents() : [e];
                for(const ev of events) drawSegment(getPos(ev));
            };
            canvas.onpointerup=finish; canvas.onpointercancel=finish; canvas.onpointerleave=()=>{};
        }

        // تحويل ألوان Hex/RGB إلى RGB متوافق مع PDFLib
        function parseColorToPdfRgb(colorStr) {
            if (!colorStr) return PDFLib.rgb(0, 0, 0);
            if (colorStr.startsWith('#')) {
                let hex = colorStr.replace('#', '');
                if (hex.length === 3) hex = hex.split('').map(c => c + c).join('');
                const intVal = parseInt(hex, 16);
                return PDFLib.rgb(((intVal >> 16) & 255) / 255, ((intVal >> 8) & 255) / 255, (intVal & 255) / 255);
            }
            const match = colorStr.match(/rgba?\((\d+),\s*(\d+),\s*(\d+)/);
            if (match) {
                return PDFLib.rgb(parseInt(match[1]) / 255, parseInt(match[2]) / 255, parseInt(match[3]) / 255);
            }
            return PDFLib.rgb(0, 0, 0);
        }

        async function buildPortablePdfBytes() {
            if (!pdfDoc || !window.PDFLib || !currentFileId) return null;
            const record = await getRecord(currentFileId);
            if (!record || (!record.data && !record.chunked)) return null;
            // Keep very large PDFs (>650 MB) in their chunked/editable form during
            // normal autosave. Flattening such a file would require a second full
            // in-memory copy and can freeze low-memory devices.
            if (Number(record.size) > LARGE_PDF_FLATTEN_LIMIT) return null;
            const sourceBytes = await assemblePdfBytes(record);
            const pdfLibDoc = await PDFLib.PDFDocument.load(sourceBytes);
            const newDoc = await PDFLib.PDFDocument.create();

            for (let i = 0; i < pageOrder.length; i++) {
                const actualPageNum = pageOrder[i];
                const [copiedPage] = await newDoc.copyPages(pdfLibDoc, [actualPageNum - 1]);
                const page = newDoc.addPage(copiedPage);
                const { width, height } = page.getSize();

                if (currentDrawings && currentDrawings[actualPageNum]) {
                    try {
                        const img = await newDoc.embedPng(currentDrawings[actualPageNum]);
                        page.drawImage(img, { x: 0, y: 0, width, height });
                    } catch (err) { console.error('Error embedding drawings:', err); }
                }

                if (currentImages && currentImages[actualPageNum]) {
                    for (const imgData of currentImages[actualPageNum]) {
                        try {
                            let embeddedImg;
                            if (String(imgData.src).startsWith('data:image/png')) embeddedImg = await newDoc.embedPng(imgData.src);
                            else embeddedImg = await newDoc.embedJpg(imgData.src);
                            const pdfY = height - imgData.y - imgData.h;
                            page.drawImage(embeddedImg, { x: imgData.x, y: pdfY, width: imgData.w, height: imgData.h });
                        } catch (err) { console.error('Error embedding image node:', err); }
                    }
                }

                if (currentTexts && currentTexts[actualPageNum]) {
                    currentTexts[actualPageNum].forEach(t => {
                        if (!t.text) return;
                        try {
                            const pdfY = height - t.y - (t.fontSize || 18);
                            page.drawText(t.text, {
                                x: t.x,
                                y: pdfY > 0 ? pdfY : t.y,
                                size: t.fontSize || 18,
                                color: parseColorToPdfRgb(t.color)
                            });
                        } catch (err) { console.error('Error drawing text node:', err); }
                    });
                }
            }
            return await newDoc.save({ useObjectStreams: true });
        }

        async function fingerprintBytes(bytes) {
            const buf = bytes instanceof Uint8Array ? bytes : new Uint8Array(bytes);
            const hash=await crypto.subtle.digest('SHA-256',buf);
            return Array.from(new Uint8Array(hash)).map(b=>b.toString(16).padStart(2,'0')).join('');
        }

        async function writeBytesToOriginalFile(bytes) {
            if (!currentFileHandle || !bytes) return false;
            try {
                if (!(await ensureHandlePermission(currentFileHandle, false))) return false;
                const writable=await currentFileHandle.createWritable({keepExistingData:false});
                await writable.write(new Blob([bytes],{type:'application/pdf'}));
                await writable.close();
                const record=await getRecord(currentFileId);
                if(record){record.fileHandle=currentFileHandle;record.latestWrittenFingerprint=await fingerprintBytes(bytes);record.lastOriginalWriteAt=Date.now();await putRecord(record);}
                return true;
            } catch(err) {
                console.warn('Could not write directly to original PDF:',err);
                return false;
            }
        }

        async function savePortablePDF() {
            if (!currentFileId || !db || !pdfDoc) return;
            if (portableSavePromise) {
                await portableSavePromise;
                return;
            }
            portableSavePromise = (async () => {
                try {
                    updateAutosaveIndicator('saving');
                    const bytes = await buildPortablePdfBytes();
                    if (bytes) {
                        await storePortablePdfInChunks(currentFileId, new Blob([bytes], { type: 'application/pdf' }));
                        await writeBytesToOriginalFile(bytes);
                    }
                    updateAutosaveIndicator('saved');
                } finally {
                    portableSavePromise = null;
                }
            })();
            await portableSavePromise;
        }

        function schedulePortablePDFSave() {
            clearTimeout(portableSaveTimeout);
            portableSaveTimeout = setTimeout(() => {
                savePortablePDF().catch(err => console.error('Portable PDF autosave error:', err));
            }, 1200);
        }

        async function exportFullPDF() {
            if (!pdfDoc || !window.PDFLib || !currentFileId) return;
            try {
                await savePageDataNow(currentPage);
                await saveDocumentSettings();
                updateAutosaveIndicator('saving');

                const bytes = await buildPortablePdfBytes();
                if (!bytes) {
                    const record = await getRecord(currentFileId);
                    if (Number(record?.size) > LARGE_PDF_FLATTEN_LIMIT) {
                        alert('This PDF is larger than 650 MB. It remains fully editable and saved in chunks; flatten/export is intentionally skipped to prevent freezing low-memory devices.');
                    }
                    updateAutosaveIndicator('saved');
                    return;
                }
                await storePortablePdfInChunks(currentFileId, new Blob([bytes], { type: 'application/pdf' }));
                await writeBytesToOriginalFile(bytes);

                const blob = new Blob([bytes], { type: 'application/pdf' });
                const link = document.createElement('a');
                const url = URL.createObjectURL(blob);
                link.href = url;
                link.download = `notebook_export_${Date.now()}.pdf`;
                document.body.appendChild(link);
                link.click();
                link.remove();
                setTimeout(() => URL.revokeObjectURL(url), 60_000);
                updateAutosaveIndicator('saved');
            } catch (err) {
                console.error('Export error:', err);
                updateAutosaveIndicator('saved');
                alert('Export failed: ' + (err?.message || err));
            }
        }

        // ===== Lightweight Select / Lasso-like rectangle selection =====
        let selectedNodes = new Set();
        let selectionDrag = null;
        function clearSelection(){selectedNodes.forEach(n=>n.classList.remove('selected-node'));selectedNodes.clear();}
        function nodeRect(n){return n.getBoundingClientRect();}
        function rectIntersects(a,b){return !(a.right<b.left||a.left>b.right||a.bottom<b.top||a.top>b.bottom);}
        document.addEventListener('pointerdown',e=>{
            if(currentTool!=='select')return;
            const wrapper=e.target.closest('.page-wrapper');
            if(!wrapper)return;
            const selected=e.target.closest('.selected-node');
            if(selected){
                // Group move for selected text/images. Ink remains on its shared canvas.
                e.preventDefault(); e.stopImmediatePropagation();
                const startX=e.clientX,startY=e.clientY, parent=wrapper, rect=parent.getBoundingClientRect();
                const origin=[...selectedNodes].map(n=>({n,x:+(n.dataset.baseX||0),y:+(n.dataset.baseY||0)}));
                const move=ev=>{const dx=(ev.clientX-startX)*(+(parent.dataset.baseWidth||600)/rect.width);const dy=(ev.clientY-startY)*(+(parent.dataset.baseHeight||800)/rect.height);origin.forEach(o=>{const nx=o.x+dx,ny=o.y+dy;o.n.dataset.baseX=nx;o.n.dataset.baseY=ny;o.n.style.left=(nx*zoomScale)+'px';o.n.style.top=(ny*zoomScale)+'px';});};
                const up=()=>{window.removeEventListener('pointermove',move,true);window.removeEventListener('pointerup',up,true);savePageData(+wrapper.dataset.pageNum||currentPage);};
                window.addEventListener('pointermove',move,true);window.addEventListener('pointerup',up,true);return;
            }
            if(e.target.closest('.text-node,.img-node,.delete-text-badge,.delete-img,.resize-handle'))return;
            clearSelection();
            const r=wrapper.getBoundingClientRect(); const x0=e.clientX-r.left,y0=e.clientY-r.top;
            const box=document.createElement('div');box.className='selection-box';box.style.left=x0+'px';box.style.top=y0+'px';box.style.width='0px';box.style.height='0px';wrapper.appendChild(box);
            const move=ev=>{const x=ev.clientX-r.left,y=ev.clientY-r.top;box.style.left=Math.min(x0,x)+'px';box.style.top=Math.min(y0,y)+'px';box.style.width=Math.abs(x-x0)+'px';box.style.height=Math.abs(y-y0)+'px';};
            const up=()=>{window.removeEventListener('pointermove',move,true);window.removeEventListener('pointerup',up,true);const br=box.getBoundingClientRect();box.remove();wrapper.querySelectorAll('.text-node-wrapper,.img-node').forEach(n=>{if(rectIntersects(br,nodeRect(n))){selectedNodes.add(n);n.classList.add('selected-node');}});};
            window.addEventListener('pointermove',move,true);window.addEventListener('pointerup',up,true);
        },true);
        window.addEventListener('keydown',e=>{if(e.key==='Escape')clearSelection();if((e.key==='Delete'||e.key==='Backspace')&&selectedNodes.size){const grouped=[...selectedNodes];clearSelection();grouped.forEach(n=>n.remove());savePageData(currentPage);}});

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') document.getElementById('color-modal-overlay')?.classList.remove('show');
        });

        // ===== PDF Outline in the existing sidebar =====
        const baseRenderSidebarBookmarks = renderSidebarBookmarks;
        async function renderSidebarBookmarks(){
            baseRenderSidebarBookmarks();
            const list=document.getElementById('sidebarBookmarksList');
            if(!list||!pdfDoc)return;
            try{
                const outline=await pdfDoc.getOutline();
                if(!outline?.length)return;
                const heading=document.createElement('div');heading.style.cssText='font-size:12px;font-weight:700;opacity:.7;margin:12px 3px 4px';heading.textContent='PDF OUTLINE';list.appendChild(heading);
                const add=(items,depth=0)=>items.forEach(item=>{const el=document.createElement('div');el.className='bookmark-item';el.style.marginLeft=Math.min(depth*10,30)+'px';const info=document.createElement('div');info.className='bookmark-info';const title=document.createElement('div');title.className='bookmark-title';title.textContent=item.title||'Untitled';info.appendChild(title);el.appendChild(info);el.onclick=async()=>{try{const dest=await pdfDoc.getDestination(item.dest);if(dest){const ref=dest[0];const idx=await pdfDoc.getPageIndex(ref);const actual=idx+1;const display=pageOrder.indexOf(actual)+1;if(display>0)goToPage(display);}}catch(_){}toggleSidebar(false);};list.appendChild(el);if(item.items?.length)add(item.items,depth+1);});
                add(outline,0);
            }catch(e){console.debug('Outline unavailable',e);}
        }

        // ===== Search =====
        let pdfSearchCache = new Map();
        let pdfSearchResults = [];
        let pdfSearchIndex = -1;
        function toggleSearchPanel(){
            const p=document.getElementById('search-panel');p?.classList.toggle('show');
            if(p?.classList.contains('show')) setTimeout(()=>document.getElementById('pdfSearchInput')?.focus(),20);
        }
        function closeSearchPanel(){document.getElementById('search-panel')?.classList.remove('show');clearSearchHighlights();}
        function clearSearchHighlights(){document.querySelectorAll('.search-page-match').forEach(el=>el.classList.remove('search-page-match'));}
        async function getPageTextCached(actual){
            if(pdfSearchCache.has(actual))return pdfSearchCache.get(actual);
            const page=await pdfDoc.getPage(actual);const tc=await page.getTextContent();const text=tc.items.map(i=>i.str).join(' ');pdfSearchCache.set(actual,text);page.cleanup?.();return text;
        }
        async function runPdfSearch(){
            const q=(document.getElementById('pdfSearchInput')?.value||'').trim().toLowerCase();if(!q||!pdfDoc)return;
            pdfSearchResults=[];pdfSearchIndex=-1;clearSearchHighlights();const st=document.getElementById('searchStatus');if(st)st.textContent='…';
            for(let d=1;d<=pageOrder.length;d++){
                const actual=pageOrder[d-1];const text=(await getPageTextCached(actual)).toLowerCase();if(text.includes(q))pdfSearchResults.push(d);
                if(d%5===0)await new Promise(r=>setTimeout(r,0));
            }
            if(pdfSearchResults.length){pdfSearchIndex=0;showSearchResult();}
            if(st)st.textContent=pdfSearchResults.length?`1 / ${pdfSearchResults.length}`:'0 / 0';
        }
        function showSearchResult(){
            if(!pdfSearchResults.length)return;
            clearSearchHighlights();
            const p=pdfSearchResults[pdfSearchIndex];
            goToPage(p);
            requestAnimationFrame(()=>document.querySelector(`.page-wrapper[data-page-num="${p}"]`)?.classList.add('search-page-match'));
            const st=document.getElementById('searchStatus');if(st)st.textContent=`${pdfSearchIndex+1} / ${pdfSearchResults.length}`;
        }
        function searchNavigate(dir){if(!pdfSearchResults.length)return;pdfSearchIndex=(pdfSearchIndex+dir+pdfSearchResults.length)%pdfSearchResults.length;showSearchResult();}
        document.getElementById('pdfSearchInput')?.addEventListener('keydown',e=>{if(e.key==='Enter'){if(pdfSearchResults.length)searchNavigate(1);else runPdfSearch();}});

        // ===== Dark mode =====
        function applyDarkMode(){document.body.classList.toggle('dark-mode',localStorage.getItem('zakerDarkMode')==='1');}
        function toggleDarkMode(){const on=localStorage.getItem('zakerDarkMode')==='1';localStorage.setItem('zakerDarkMode',on?'0':'1');applyDarkMode();scheduleDocumentSettingsSave();}
        // Dark mode UI was removed; do not re-apply any previous dark-mode preference.
        // Persist small UI preferences without touching PDF bytes.
        const _oldSaveDocumentSettings = saveDocumentSettings;
        saveDocumentSettings = async function(){
            await _oldSaveDocumentSettings();
            try { localStorage.setItem('zakerLastZoom', String(zoomScale)); localStorage.setItem('zakerLastViewMode', viewMode); } catch(e){}
        };
        window.addEventListener('beforeunload',()=>{try{scheduleDocumentSettingsSave();}catch(e){}});
        updateZoomLabel();
    </script>
</body>
</html>
